# TeamClu AI Gateway — operator catalog (example)
# Mount read-only into ai-gateway container as /app/catalog.yaml
#
# Three layers:
#   providers      — how to reach an upstream (api_base + key + usage quirks)
#   backend_models — which upstream model to call. NO PRICING.
#   public_models  — the customer-facing tier: 1:n routes + THE PRICE
#
# Pricing is OURS, set on the three tiers, not derived from upstream cost.
# See §4.4 of docs/specs/2026-08-28-team-ai-gateway-design.md for why that
# collapses four layers of complexity (peak/off-peak spreads, prompt-cache
# split billing, mixed-route price uncertainty, FX drift).
#
# This file is PER DEPLOYMENT, not a single source of truth in the repo: each
# deploy target runs its own gateway against its own database (§3.1).

providers:
  deepseek:
    api_base: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    # How this provider reports token usage on a STREAMING response.
    #   always               — usage arrives unprompted, riding the last normal
    #                          chunk (the one carrying finish_reason).
    #   needs_stream_options — must inject stream_options.include_usage; the
    #                          provider then emits an EXTRA usage-only frame
    #                          with empty choices, which the gateway swallows
    #                          when the client did not ask for it.
    # Verified against the live API on 2026-08-28 (§4.4.0.1).
    usage_mode: always
  # An OpenAI-COMPATIBLE relay (cli-proxy-api) on our own Singapore box, which
  # is how `pro` and `max` reach the gpt-5.6 family. NOT api.openai.com: the
  # Shenzhen deploy box cannot reach that, but it reaches this in ~250ms, so
  # this provider needs no egress proxy.
  #
  # ⚠️ Startup validation requires a key for EVERY provider listed here. Listing
  # this one without OPENAI_API_KEY in the environment makes the gateway refuse
  # to boot — which is what happened the first time this file reached
  # production. Set the key BEFORE installing a catalog that names this.
  #
  # `api_key_env` reuses OPENAI_API_KEY rather than introducing MX5_API_KEY
  # because the compose `environment:` map is an ALLOWLIST that already carries
  # it — a new name has to be declared on both deploy targets before it reaches
  # the container at all. The commented-out api.openai.com block that used to
  # sit here was removed so nothing else claims this variable.
  mx5:
    api_base: https://ai.mx5.cn/v1
    api_key_env: OPENAI_API_KEY
    # MEASURED 2026-09-09 against the live endpoint, not assumed: usage arrives
    # unprompted, riding the last normal chunk (the one carrying finish_reason)
    # — the DeepSeek shape, NOT OpenAI's separate usage-only frame. Declaring
    # `needs_stream_options` here would inject a stream_options this upstream
    # never asked for.
    usage_mode: always

# Body keys forwarded upstream. Everything else is dropped with a debug log.
# The equivalent of the old gateway's `drop_params: true`.
#
# DeepSeek was measured to TOLERATE unknown params (a bogus key still returned
# 200), so this is defensive rather than required — it earns its keep the day
# we add a stricter provider. Not a Phase 0 blocker.
default_supported_params:
  - model
  - messages
  - stream
  - stream_options
  - temperature
  - top_p
  - max_tokens
  - stop
  - tools
  - tool_choice
  - parallel_tool_calls
  - response_format
  - seed
  - n
  - presence_penalty
  - frequency_penalty
  - user

backend_models:
  # No pricing here — what a tier costs the customer is decided in
  # public_models below. The optional `cost` block would feed margin reporting
  # only and is never used to charge anyone; omitting it changes nothing.
  ds-v4-pro:
    provider: deepseek
    upstream_model: deepseek-v4-pro
    # Sizes the pre-flight reservation when the request omits max_tokens.
    # Keep it generous: reasoning tokens count toward completion_tokens and can
    # consume the entire output budget on their own (§4.4.0.1).
    default_max_output_tokens: 16000

  ds-v4-flash:
    provider: deepseek
    upstream_model: deepseek-v4-flash
    default_max_output_tokens: 16000

  # The gpt-5.6 family, behind the mx5 relay. Backend ids carry the provider
  # prefix so `ai_usage_logs.backend_model_id` says where a request actually
  # landed without a join — that column is the margin/cost basis (§4.4.0).
  #
  # 16000 matches the DeepSeek backends deliberately. This sizes the pre-flight
  # HOLD only (it never caps the upstream), and CREDITS_ENFORCED is ON: raising
  # it raises every hold, which on `max` (80 credits/output token) is what
  # starts 402-ing teams that were fine yesterday. Under-reserving instead just
  # risks a small overshoot, which the ledger already tolerates by design.
  mx5-gpt-5.6-terra:
    provider: mx5
    upstream_model: gpt-5.6-terra
    default_max_output_tokens: 16000

  mx5-gpt-5.6-sol:
    provider: mx5
    upstream_model: gpt-5.6-sol
    default_max_output_tokens: 16000

public_models:
  # ── THE public contract: exactly three tiers, and their prices ───────
  # The desktop hardcodes these three ids (§4.3.1). They are STABLE NAMES —
  # what changes is which backend they point at, and that mapping lives right
  # here. Re-point a tier, adjust weights, or swap vendors with no client
  # release and no price change.
  #
  # Adding a FOURTH tier requires shipping a client. Deliberate: adding a tier
  # is a product decision, not a config tweak.
  #
  # ⚠️ PRICES BELOW ARE PLACEHOLDERS — the real numbers are a pricing decision
  # (design 附录 F). The one ENGINEERING constraint on whatever gets chosen:
  # a typical request must cost at least a few thousand credits, or ceil()
  # rounding swallows small requests — and agent traffic is all small requests
  # (§4.4.1). These placeholders satisfy it by making 1 credit ≈ 1 input token
  # on the `default` tier.
  #
  # ⚠️ Write plain digits. YAML 1.2 reads 1_000_000 as a STRING, not an int.

  default:
    name: 标准
    routing: priority
    pricing:
      input_per_1m_credits: 1000000
      output_per_1m_credits: 4000000
    routes:
      - backend: ds-v4-flash

  # PRICING IS UNCHANGED from when this tier pointed at DeepSeek, and that is
  # the whole point of pricing the TIER rather than the backend (§4.4):
  # re-pointing `pro` at a different vendor moves our cost, not the customer's
  # price. Do not "adjust" these to match the new upstream.
  #
  # Failover, not priority: the mx5 relay fronts subscription accounts and is a
  # weaker availability story than a first-party API, so the tier keeps serving
  # from DeepSeek if it goes down — at the same price either way.
  #
  # ⚠️ Failover only advances on 5xx or a transport error (app.ts). A 401 from a
  # bad OPENAI_API_KEY passes straight through to the caller instead of quietly
  # serving DeepSeek — which is what you want: a wrong key should be loud.
  pro:
    name: 高级
    routing: failover
    pricing:
      input_per_1m_credits: 4000000
      output_per_1m_credits: 16000000
    routes:
      - backend: mx5-gpt-5.6-terra
      - backend: ds-v4-pro

  max:
    name: 旗舰
    routing: failover
    pricing:
      input_per_1m_credits: 20000000
      output_per_1m_credits: 80000000
    routes:
      - backend: mx5-gpt-5.6-sol
      - backend: ds-v4-pro

  # ── transition aliases — REMOVE IN PHASE 3 ───────────────────────────
  # Old clients still send these vendor ids, and they are still sitting in
  # team_workspace_config.llm_models. Keep them serving until those clients are
  # gone, then drop both these entries and the
  # dead llm_models rows. See §4.3.2. Priced identically to the tier they
  # shadow, so the migration never changes anyone's bill.
  #
  # Unknown model ids get 403 model_not_allowed — never a silent fallback to
  # `default`, which would leave a mis-configured client on the wrong tier with
  # no signal.
  deepseek-v4-flash:
    name: DeepSeek V4 Flash
    routing: priority
    pricing:
      input_per_1m_credits: 1000000
      output_per_1m_credits: 4000000
    routes:
      - backend: ds-v4-flash

  deepseek-v4-pro:
    name: DeepSeek V4 Pro
    routing: priority
    pricing:
      input_per_1m_credits: 4000000
      output_per_1m_credits: 16000000
    routes:
      - backend: ds-v4-pro
