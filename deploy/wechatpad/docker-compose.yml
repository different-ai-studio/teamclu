# iPad-protocol WeChat server for the `wechatpad` channel
# (docs/features/wechatpad.md). Run it on the machine amuxd runs on:
#
#   REDIS_PASSWORD=$(openssl rand -hex 12) docker compose -f deploy/wechatpad/docker-compose.yml up -d
#
# The image is closed source and holds the account's session, so it is bound
# to loopback and gets a network of its own. `houhou/wechat-ipad:latest`
# (protocol 8.0.59) refuses to start without a paid auth key; the 8074 image is
# the one that runs. It is amd64-only (Rosetta on Apple Silicon).
name: teamclu-wechatpad
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redis:/data]
    networks: [wechatpad]
    restart: unless-stopped
  wechat-ipad:
    image: registry.cn-shenzhen.aliyuncs.com/houhou/wechat-ipad-8074:latest
    platform: linux/amd64
    depends_on: [redis]
    ports: ["127.0.0.1:3010:9000"]
    environment:
      WECHAT_PORT: "9000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD}"
      REDIS_DB: "0"
      # Where the server pushes messages: amuxd's wechatpad callback port
      # (`callback_port` in the channel settings, default 9101).
      WECHAT_CLIENT_HOST: host.docker.internal:9101
    networks: [wechatpad]
    restart: unless-stopped
networks:
  wechatpad: {}
volumes:
  redis: {}
