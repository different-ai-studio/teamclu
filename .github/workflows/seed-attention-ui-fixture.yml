# One-shot diagnose + seed for attention UI fixtures on self-host RDS.
name: Seed Attention UI Fixture

on:
  workflow_dispatch: {}

concurrency:
  group: selfhost-ecs
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: self-host-production
    steps:
      - name: Diagnose then seed on self-host DB
        uses: appleboy/ssh-action@v1.2.5
        env:
          BELAYO_TEST_RDS_PRIVATE_HOST: ${{ secrets.BELAYO_TEST_RDS_PRIVATE_HOST }}
          BELAYO_TEST_RDS_PORT: ${{ secrets.BELAYO_TEST_RDS_PORT }}
          BELAYO_TEST_RDS_USER: ${{ secrets.BELAYO_TEST_RDS_USER }}
          BELAYO_TEST_RDS_PASSWORD: ${{ secrets.BELAYO_TEST_RDS_PASSWORD }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          envs: BELAYO_TEST_RDS_PRIVATE_HOST,BELAYO_TEST_RDS_PORT,BELAYO_TEST_RDS_USER,BELAYO_TEST_RDS_PASSWORD
          script: |
            set -eu
            cat > /tmp/diag-attention.sql <<'SQL'
            \set ON_ERROR_STOP on
            SELECT 'USER_EXACT' AS k, id::text, email FROM auth.users WHERE lower(email) = lower('1264118202@qq.com');
            SELECT 'USER_QQ' AS k, id::text, email FROM auth.users WHERE email ILIKE '%qq.com%' ORDER BY created_at DESC LIMIT 30;
            SELECT 'TEAM' AS k, id::text, name FROM amux.teams WHERE name ILIKE '%bertran%' OR name ILIKE '%huang%' ORDER BY created_at DESC;
            SELECT 'MEMBER' AS k, t.name AS team, a.id::text AS actor_id, a.display_name, u.email
              FROM amux.teams t
              JOIN amux.actors a ON a.team_id = t.id AND a.actor_type = 'member'
              LEFT JOIN auth.users u ON u.id = a.user_id
             WHERE t.name ILIKE '%bertran%' OR t.name ILIKE '%huang%'
             ORDER BY t.name, a.display_name
             LIMIT 50;
            SQL
            echo "=== diagnose ==="
            docker run --rm --network host -i \
              -e PGPASSWORD="$BELAYO_TEST_RDS_PASSWORD" \
              -e PGHOST="$BELAYO_TEST_RDS_PRIVATE_HOST" \
              -e PGPORT="${BELAYO_TEST_RDS_PORT:-5432}" \
              -e PGUSER="$BELAYO_TEST_RDS_USER" \
              -e PGDATABASE=supabase_db \
              postgres:15-alpine psql -v ON_ERROR_STOP=1 < /tmp/diag-attention.sql
            echo "=== diagnose done ==="
