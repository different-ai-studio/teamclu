name: Nightly TeamClu Beta / Copilot361 Release

# Nightly beta release for the OSS brands. Every night this:
#   1. Bumps the desktop beta version by one (0.2.28-beta.1 -> 0.2.28-beta.2;
#      or, from a stable X.Y.Z, starts X.Y.(Z+1)-beta.1) and commits that bump
#      to `main`. The commit — NOT a git tag — is what advances the beta number,
#      so `release.yml` (which triggers on `push: tags: v*`) is never fired.
#   2. Dispatches release-oss.yml for TeamClu Beta and independent Copilot361 with the
#      new `v<version>` tag input. That workflow re-syncs the four version
#      sources on its runner, verifies the bump, and publishes each brand to its
#      own OSS prefix — clients force-upgrade because the bundled amuxd version
#      strictly increased.
#
# release-oss.yml stays one-channel-per-run by design (per-channel concurrency
# groups guard each channel's latest.json), so we dispatch it twice rather than
# adding a brand matrix there.
#
# NOTE ON TOKENS: pushing the bump to `main` and dispatching another workflow
# both need write scopes. The default GITHUB_TOKEN works UNLESS `main` is a
# protected branch (its pushes can't bypass protection). If so, set a repo
# secret NIGHTLY_DISPATCH_PAT (a PAT / GitHub App token with `contents:write` +
# `actions:write` and bypass on main); it takes precedence below.

on:
  schedule:
    - cron: "0 16 * * *" # 16:00 UTC = 00:00 (24:00) Asia/Shanghai
  workflow_dispatch: {}

# Never let two nightly runs bump the version concurrently — the later push
# would race the earlier one on main.
concurrency:
  group: nightly-release-oss
  cancel-in-progress: false

permissions:
  contents: write # commit + push the version bump to main
  actions: write # dispatch release-oss.yml

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Use the PAT (needed if main is protected) when present, else the
          # default token. `token` controls the credentials persisted for push.
          token: ${{ secrets.NIGHTLY_DISPATCH_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Compute next beta version
        id: ver
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # $ inside the node -e '...' are JS template literals, not shell.
          NEXT="$(node -e '
            const v = require("./package.json").version;
            const m = v.match(/^(\d+)\.(\d+)\.(\d+)(?:-beta\.(\d+))?$/);
            if (!m) { console.error("unsupported version for nightly beta: " + v); process.exit(1); }
            const [, MA, MI, PA, BETA] = m;
            const next = BETA !== undefined
              ? `${MA}.${MI}.${PA}-beta.${Number(BETA) + 1}`
              : `${MA}.${MI}.${Number(PA) + 1}-beta.1`;
            console.log(next);
          ')"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next beta version: $NEXT"

      - name: Bump the four version sources
        run: node scripts/bump-desktop-version.mjs "${{ steps.ver.outputs.next }}"

      - name: Commit + push bump to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): nightly beta v${{ steps.ver.outputs.next }}"
          git push origin HEAD:main

      - name: Dispatch TeamClu Beta and Copilot361 releases
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_DISPATCH_PAT || secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail

          # Both brands' releases call the SAME reusable mirror-pi-oss workflow,
          # which serializes every caller on one global concurrency group.
          # Dispatching them back to back put two callers in that single group
          # and GitHub killed one mid-flight: teamclu's mirror-pi was cancelled
          # 11 seconds in, one second after copilot361's was created. Because
          # build-macos (and through it publish-manifest) is gated on mirror-pi,
          # that skipped both and cost the brand its entire release -- while the
          # nightly version bump had already landed on main, so the version
          # number moved and nothing shipped behind it.
          #
          # Keep the serialization rather than giving each brand its own group:
          # the mirror drops the upstream shrinkwrap and runs `npm install
          # --omit=dev` with no lockfile, so two concurrent mirrors can resolve
          # different dependency trees. Interleaved asset/manifest writes would
          # then leave latest.json advertising a sha256 for bytes that are no
          # longer at that key, which every client rejects as a checksum
          # mismatch. Stagger the callers instead.
          dispatch_and_wait() {
            local brand="$1" before after run_id state
            before=$(gh run list --workflow release-oss.yml --limit 1 \
              --json databaseId --jq '.[0].databaseId // 0')

            echo "Dispatching release-oss for $brand @ $TAG"
            gh workflow run release-oss.yml --ref main -f brand="$brand" -f tag="$TAG"

            # `gh workflow run` does not report the run it created, so wait for a
            # new id to show up. We dispatch one brand at a time, so the newest
            # release-oss run is unambiguously ours.
            run_id=""
            for _ in $(seq 1 30); do
              after=$(gh run list --workflow release-oss.yml --limit 1 \
                --json databaseId --jq '.[0].databaseId // 0')
              if [ "$after" != "$before" ]; then run_id="$after"; break; fi
              sleep 5
            done
            if [ -z "$run_id" ]; then
              echo "::warning::could not identify the $brand run — dispatching the next brand without waiting"
              return 0
            fi
            echo "  -> run $run_id; waiting for its mirror-pi to release the group"

            # Wait on mirror-pi only, not the whole release. Everything after it
            # shares no group with the other brand and is meant to overlap, so
            # blocking on the full run would serialize two ~30-minute builds.
            for _ in $(seq 1 120); do
              state=$(gh run view "$run_id" --json jobs \
                --jq '[.jobs[] | select(.name | startswith("mirror-pi")) | .status] | first // ""')
              if [ "$state" = "completed" ]; then
                echo "  -> mirror-pi finished; group is free"
                return 0
              fi
              sleep 10
            done
            echo "::warning::timed out waiting for $brand mirror-pi — dispatching the next brand anyway"
          }

          for brand in teamclu copilot361; do
            dispatch_and_wait "$brand"
          done
