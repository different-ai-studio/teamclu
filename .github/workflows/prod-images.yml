name: Publish production images

on:
  workflow_dispatch:
  pull_request:
    branches: [release/hangzhou-cloud-api]

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/fc
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/fc/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --import tsx --test test/config-route.test.ts test/push-deps-mqtt-url.test.ts

  publish:
    name: Publish ${{ matrix.image }}
    if: github.repository == 'different-ai-studio/teamclu' && github.ref == 'refs/heads/release/hangzhou-cloud-api' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: teamclu-prod-cloud-api
            context: services/fc
            dockerfile: services/fc/Dockerfile
    env:
      IMAGE: ghcr.io/different-ai-studio/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/different-ai-studio/teamclu
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Record published digest
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s@%s\n' "$IMAGE" "$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
          printf '\nFor a new package, set visibility to Public in GHCR package settings before the anonymous ACK pull test.\n' >> "$GITHUB_STEP_SUMMARY"
