name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `lts/*`, matching every other workflow in this repo — so CI validates on
      # the same Node the release jobs build with, rather than a version nothing
      # ships on. The old '20' pin was the outlier, and it broke the Expo suite:
      # its cache tests drive a real SQLite through `node:sqlite`
      # (src/test/helpers/memory-db.ts), a built-in that does not exist before
      # Node 22.5 and is behind --experimental-sqlite until 23.4, so four suites
      # died at import with "No such built-in module: node:sqlite".
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store/v3
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit

      # The agent bridges are plain Node packages outside the pnpm workspace, so
      # nothing here ever ran their tests. Both suites import only node builtins
      # and their own module, so they need no install step.
      - name: Run agent bridge tests
        run: >-
          node --test
          apps/daemon/claude-bridge/src/transcript-repair.test.mjs
          apps/daemon/cursor-bridge/src/auth-retry.test.mjs

      # The scripts above are scoped to @teamclu/app, so the Expo app was
      # outside every gate until now. See apps/expo/CI.md for what is and is
      # not covered.
      - name: Run Expo TypeScript check
        run: pnpm typecheck:expo

      - name: Run Expo unit tests
        run: pnpm test:expo

      # Same gap as the Expo one above: the extension has its own tsconfig and
      # was never typechecked by CI, so it drifted broken (12 errors) without
      # anything going red. Gated here so it cannot rot again.
      - name: Run extension TypeScript check
        run: pnpm typecheck:extension

      - name: Run extension unit tests
        run: pnpm test:extension

      - name: Run script tests
        run: pnpm test:scripts

      # Smoke/E2E use tauri-mcp and require a built Tauri app (pnpm tauri:build),
      # which this job does not build — so this stays advisory and never gates.
      # Run locally or in a job that builds the app to execute smoke/e2e.
      - name: Run smoke tests
        run: pnpm test:smoke
        continue-on-error: true

  rust-check:
    name: Rust Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libpipewire-0.3-dev is for xcap's Wayland screenshot backend
          # (xcap -> libwayshot-xcap -> pipewire -> libspa-sys), whose build
          # script shells out to pkg-config and fails the whole Clippy job when
          # libpipewire-0.3.pc is absent. Nothing in the Rust sources changed to
          # need it — it arrived through Cargo.lock.
          # libgbm-dev is for the same xcap dependency chain, but only the test
          # step needs it: clippy and check never link, and `-lgbm` is a link
          # input (xcap -> libwayshot-xcap -> gbm-sys). Without it the desktop
          # unit tests fail at `rust-lld: unable to find library -lgbm` after a
          # full compile, which reads as a test failure rather than a missing
          # system package.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libglib2.0-dev patchelf libasound2-dev protobuf-compiler libpipewire-0.3-dev libgbm-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          # apps/desktop is a member of the root workspace, so cargo puts its
          # output under the root target/, not apps/desktop/target/.
          workspaces: |
            . -> target

      - name: Create stub sidecar binaries (tauri-build requires them to exist)
        run: |
          mkdir -p apps/desktop/binaries
          touch apps/desktop/binaries/teamclu-introspect-x86_64-unknown-linux-gnu
          touch apps/desktop/binaries/amuxd-x86_64-unknown-linux-gnu
          # `resources` in tauri.conf.json globs binaries/{cursor,claude}-bridge/**/*.
          # The whole binaries/ dir is gitignored, so on a fresh checkout those
          # globs resolve to nothing and tauri-build fails the build script —
          # before clippy ever runs. A glob needs a file, not just the directory.
          mkdir -p apps/desktop/binaries/cursor-bridge apps/desktop/binaries/claude-bridge
          touch apps/desktop/binaries/cursor-bridge/.keep
          touch apps/desktop/binaries/claude-bridge/.keep

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path apps/desktop/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --manifest-path apps/desktop/Cargo.toml -- -D warnings

      # Never ran before, and it showed: the skills root moved to
      # `~/.agents/skills` and the assertion for the old path sat red for
      # however long, four separate test-local `HomeGuard`s raced each other
      # over `$HOME`, and three oss_sync tests could only pass on a machine
      # with a (gitignored) build.config.json. All fixed; this is what keeps
      # them fixed.
      #
      # No build config on the runner, so `CLOUD_API_URL` is unset — the tests
      # that need it skip themselves rather than fail (see
      # `commands::oss_sync::fc_endpoint_tests::baked_endpoint_or_skip`).
      - name: Run desktop unit tests
        run: cargo test -p teamclu --locked --lib

  database:
    name: Database Tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Started by hand rather than as a `services:` container. The Supabase
      # image runs initdb against a TEMPORARY server and then restarts, so a
      # plain pg_isready health check can go green against the instance that is
      # about to shut down; the wait below looks for the second "ready to accept
      # connections" instead.
      - name: Start Postgres (same image as the deployment)
        run: |
          docker run -d --name pgtap \
            -e POSTGRES_PASSWORD=postgres \
            public.ecr.aws/supabase/postgres:17.6.1.106
          for i in $(seq 1 120); do
            n=$(docker logs pgtap 2>&1 | grep -c "ready to accept connections" || true)
            if [ "$n" -ge 2 ] && docker exec -e PGPASSWORD=postgres pgtap \
                 psql -U supabase_admin -d postgres -tAc "select 1" >/dev/null 2>&1; then
              echo "postgres ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "postgres never became ready"; docker logs pgtap | tail -30; exit 1

      - name: Copy repo into the container
        run: docker cp "$PWD/." pgtap:/work

      # GoTrue and Storage normally create their own schemas before the app
      # migrations run (see `depends_on` on the migrate service in
      # deploy/self-host/docker-compose.yml). CI has neither, so stub just the
      # objects our migrations reference. Runs as supabase_admin because `auth`
      # and `storage` belong to it and the image's `postgres` is not a superuser.
      - name: Bootstrap GoTrue/Storage objects
        run: |
          docker exec -e PGUSER=supabase_admin -e PGPASSWORD=postgres -e PGDATABASE=postgres \
            pgtap psql -v ON_ERROR_STOP=1 -f /work/services/supabase/tests/ci-bootstrap.sql

      - name: Apply migrations
        run: |
          docker exec -e PGUSER=supabase_admin -e PGPASSWORD=postgres -e PGDATABASE=postgres \
            pgtap bash -c 'MIGRATIONS_DIR=/work/services/supabase/migrations \
              bash /work/deploy/self-host/init/apply-migrations.sh'

      # Everything not quarantined — see services/supabase/tests/QUARANTINE.md.
      - name: Run pgTAP suite
        run: |
          docker exec -e PGUSER=supabase_admin -e PGPASSWORD=postgres -e PGDATABASE=postgres \
            pgtap bash -c 'cd /work/services/supabase/tests && bash run.sh'

  daemon-linux:
    name: Daemon Unit Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install protoc (for prost_build)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      # The single-agent runtime tests spawn a real `opencode serve`
      # (apply_start_runtime success paths), so the binary must be on PATH.
      - name: Install opencode (runtime under test)
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Run amuxd unit tests
        run: cargo test -p amuxd --locked

      # Owns the storage-namespace rules every runtime resolves paths through,
      # including the ratchet that keeps `~/.amuxd` / `~/.teamclu` spelled in
      # one place (docs/architecture/amuxd-home-layout-v2.md §8). Its tests were
      # never run by CI before.
      - name: Run teamclu-runtime-env unit tests
        run: cargo test -p teamclu-runtime-env --locked

  daemon-windows:
    name: Daemon (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # `choco install protoc` intermittently fails / leaves protoc off PATH,
      # making prost-build report "Could not find protoc" and reddening this job
      # for reasons unrelated to the change under test. arduino/setup-protoc
      # downloads a pinned protoc release and adds it to PATH deterministically.
      - name: Install protoc (for prost_build)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      # Compile + link gate only. amuxd now compiles and links on Windows.
      # The full unit-test suite is NOT run here: the broader daemon tests
      # carry Unix assumptions (paths, sockets) beyond this port's scope, so
      # behavioral verification on Windows is done manually on a real machine.
      - name: Check amuxd compiles on Windows
        run: cargo check -p amuxd --locked

      - name: Build amuxd on Windows
        run: cargo build -p amuxd --locked

  desktop-windows:
    name: Desktop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Same protoc story as daemon-windows: the desktop crate pulls in
      # teamclu-proto, whose build script needs it.
      - name: Install protoc (for prost_build)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          # apps/desktop is a workspace member, so its output lands under the
          # root target/ (see rust-check).
          workspaces: |
            . -> target

      - name: Create stub sidecar binaries (tauri-build requires them to exist)
        shell: bash
        run: |
          mkdir -p apps/desktop/binaries
          touch apps/desktop/binaries/teamclu-introspect-x86_64-pc-windows-msvc.exe
          touch apps/desktop/binaries/amuxd-x86_64-pc-windows-msvc.exe
          # See rust-check: `resources` globs binaries/{cursor,claude}-bridge/**/*
          # and all of binaries/ is gitignored, so the globs need a real file
          # or tauri-build fails before any crate compiles.
          mkdir -p apps/desktop/binaries/cursor-bridge apps/desktop/binaries/claude-bridge
          touch apps/desktop/binaries/cursor-bridge/.keep
          touch apps/desktop/binaries/claude-bridge/.keep

      # Compile gate only, and the only one this crate's Windows code gets:
      # rust-check runs on ubuntu and daemon-windows covers only amuxd, so
      # every `#[cfg(target_os = "windows")]` block in apps/desktop used to
      # reach a compiler for the first time inside the tag-triggered release
      # build. The updater's Windows install path (#1049) is written against
      # ShellExecuteW and cannot be checked from a macOS dev machine — ring's
      # C sources need an MSVC toolchain to cross-compile — so without this
      # job it had no coverage anywhere.
      #
      # `--no-default-features` mirrors what release.yml / release-oss.yml
      # actually ship on Windows. The feature list is empty today, so it
      # changes nothing; it keeps this job honest if that stops being true.
      - name: Check the desktop app compiles on Windows
        run: cargo check --manifest-path apps/desktop/Cargo.toml --locked --no-default-features
