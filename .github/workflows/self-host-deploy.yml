name: Self-Host Deploy

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'deploy/self-host/**'
      - 'services/fc/**'
      - 'services/ai-gateway/**'
      - 'services/supabase/migrations/**'

# Shared with daemon-deploy.yml deploy job — both reset /opt/teamclaw on the
# same ECS box. Never cancel mid compose build / up.
concurrency:
  group: selfhost-ecs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: self-host-production

    steps:
      - name: Deploy to ECS
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TRUSTED_EXTERNAL_JWT_SECRET: ${{ secrets.TRUSTED_EXTERNAL_JWT_SECRET }}
          AGENT_MANAGEMENT_GRANT_SECRET: ${{ secrets.AGENT_MANAGEMENT_GRANT_SECRET }}
          FC_SUPABASE_URL: ${{ secrets.FC_SUPABASE_URL }}
          FC_SUPABASE_PUBLIC_URL: ${{ secrets.FC_SUPABASE_PUBLIC_URL }}
          FC_SUPABASE_ANON_KEY: ${{ secrets.FC_SUPABASE_ANON_KEY }}
          FC_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FC_SUPABASE_SERVICE_ROLE_KEY }}
          BELAYO_TEST_RDS_PRIVATE_HOST: ${{ secrets.BELAYO_TEST_RDS_PRIVATE_HOST }}
          BELAYO_TEST_RDS_PORT: ${{ secrets.BELAYO_TEST_RDS_PORT }}
          BELAYO_TEST_RDS_USER: ${{ secrets.BELAYO_TEST_RDS_USER }}
          BELAYO_TEST_RDS_PASSWORD: ${{ secrets.BELAYO_TEST_RDS_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          AUTH_EGRESS_PROXY: ${{ secrets.AUTH_EGRESS_PROXY }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          command_timeout: 30m
          envs: DEEPSEEK_API_KEY,TRUSTED_EXTERNAL_JWT_SECRET,AGENT_MANAGEMENT_GRANT_SECRET,FC_SUPABASE_URL,FC_SUPABASE_PUBLIC_URL,FC_SUPABASE_ANON_KEY,FC_SUPABASE_SERVICE_ROLE_KEY,BELAYO_TEST_RDS_PRIVATE_HOST,BELAYO_TEST_RDS_PORT,BELAYO_TEST_RDS_USER,BELAYO_TEST_RDS_PASSWORD,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,AUTH_EGRESS_PROXY
          script: |
            set -e
            cd /opt/teamclaw

            echo "=== git pull ==="
            # This ECS box reaches github.com over https unreliably: a bare fetch
            # fails roughly 2 times in 5 with "GnuTLS recv error (-110)", and it
            # burns ~90s stalling first. lowSpeed* aborts a stalled transfer after
            # 20s so a retry can actually happen inside the job's timeout.
            git config http.lowSpeedLimit 1000
            git config http.lowSpeedTime 20
            fetched=""
            for i in 1 2 3 4 5 6 7 8; do
              if git fetch origin main; then fetched=yes; echo "  fetch ok (attempt $i)"; break; fi
              echo "  fetch attempt $i failed; retrying in 10s"
              sleep 10
            done
            [ -n "$fetched" ] || { echo "git fetch failed after 8 attempts"; exit 1; }
            git reset --hard origin/main

            cd deploy/self-host

            echo "=== ensure runtime env ==="
            # The server's .env predates the bundled gateway and bootstrap/gen-secrets.sh
            # is NOT run here (it would re-mint ANON_KEY/SERVICE_ROLE_KEY with fresh
            # iat/exp on every deploy). Upsert required runtime values idempotently.
            upsert_env() { # $1=key $2=value — skip empty values rather than blanking a good one
              [ -n "$2" ] || { echo "  skip $1 (empty)"; return 0; }
              if grep -q "^$1=" .env; then
                awk -v k="$1" -v v="$2" 'BEGIN{FS=OFS="="} $1==k{print k"="v; next}{print}' .env > .env.tmp && mv .env.tmp .env
              else
                printf '%s=%s\n' "$1" "$2" >> .env
              fi
              echo "  set $1"
            }
            # The FC_SUPABASE_* overrides select an EXTERNAL Supabase for fc.
            # Unlike the values above, an empty secret here must clear the .env
            # line rather than leave the previous one standing: otherwise
            # deleting the secret cannot ever point fc back at the bundled
            # Supabase (docker-compose defaults SUPABASE_URL to http://kong:8000
            # only when FC_SUPABASE_URL is unset).
            sync_env() { # $1=key $2=value — empty value deletes the key
              if [ -z "$2" ]; then
                if grep -q "^$1=" .env; then
                  grep -v "^$1=" .env > .env.tmp && mv .env.tmp .env
                  echo "  cleared $1 (secret empty)"
                else
                  echo "  skip $1 (empty, absent)"
                fi
                return 0
              fi
              upsert_env "$1" "$2"
            }
            upsert_env TRUSTED_EXTERNAL_JWT_SECRET "$TRUSTED_EXTERNAL_JWT_SECRET"
            # Deliberately NOT defaulted to TRUSTED_EXTERNAL_JWT_SECRET. That
            # secret is shared with the external login provider, and this one
            # signs grants that authorize capability management on every Agent
            # in every team. sync_env so clearing the GitHub secret clears the
            # server value instead of leaving a stale key signing grants.
            sync_env AGENT_MANAGEMENT_GRANT_SECRET "$AGENT_MANAGEMENT_GRANT_SECRET"
            sync_env FC_SUPABASE_URL "$FC_SUPABASE_URL"
            sync_env FC_SUPABASE_PUBLIC_URL "$FC_SUPABASE_PUBLIC_URL"
            sync_env FC_SUPABASE_ANON_KEY "$FC_SUPABASE_ANON_KEY"
            sync_env FC_SUPABASE_SERVICE_ROLE_KEY "$FC_SUPABASE_SERVICE_ROLE_KEY"

            if [ -n "$FC_SUPABASE_URL" ]; then
              echo "=== migrate external Supabase schema ==="
              [ -n "$BELAYO_TEST_RDS_PRIVATE_HOST" ] || { echo "missing BELAYO_TEST_RDS_PRIVATE_HOST"; exit 1; }
              [ -n "$BELAYO_TEST_RDS_USER" ] || { echo "missing BELAYO_TEST_RDS_USER"; exit 1; }
              [ -n "$BELAYO_TEST_RDS_PASSWORD" ] || { echo "missing BELAYO_TEST_RDS_PASSWORD"; exit 1; }
              docker run --rm --network host \
                -e PGPASSWORD="$BELAYO_TEST_RDS_PASSWORD" \
                -e PGHOST="$BELAYO_TEST_RDS_PRIVATE_HOST" \
                -e PGPORT="${BELAYO_TEST_RDS_PORT:-5432}" \
                -e PGUSER="$BELAYO_TEST_RDS_USER" \
                -e PGDATABASE=supabase_db \
                -v "$PWD/../../services/supabase/migrations:/migrations:ro" \
                postgres:15-alpine sh -ceu '
                  psql -v ON_ERROR_STOP=1 -c "
                    create schema if not exists _selfhost;
                    create table if not exists _selfhost.schema_migrations (
                      filename text primary key,
                      applied_at timestamptz not null default now()
                    );
                  "

                  # This external database predates the deploy marker. The
                  # onboarding RPC is only created by the already-applied
                  # batch below, so record that batch once instead of replaying
                  # non-idempotent historical functions on every deployment.
                  if [ "$(psql -Atc "select count(*) from _selfhost.schema_migrations")" = "0" ] \
                    && [ "$(psql -Atc "select to_regprocedure(\$\$amux.list_teams_for_picker(uuid)\$\$) is not null")" = "t" ]; then
                    echo "adopt existing external onboarding migrations"
                    for migration in \
                      20260618010000_upgrade_account_to_org.sql \
                      20260618020000_bind_phone_to_account.sql \
                      20260630000000_add_team_default_agent.sql \
                      20260706000000_org_default_team_onboarding.sql \
                      20260715000000_invite_contact_pending.sql \
                      20260723000000_sessions_source_cron_job_id.sql \
                      20260723000000_team_visibility.sql \
                      20260727000000_sessions_source_read_path.sql \
                      20260727030000_detach_gateway_session.sql \
                      20260728000000_gateway_session_switch.sql \
                      20260801000000_prefer_org_named_team_on_onboarding.sql \
                      20260801010000_team_bootstrap_and_discovery.sql
                    do
                      psql -v ON_ERROR_STOP=1 -c "insert into _selfhost.schema_migrations (filename) values (\$\$${migration}\$\$) on conflict do nothing"
                    done
                  fi

                  # Scan the directory instead of listing files by hand. The
                  # hand-maintained list this replaces was a trap: a migration
                  # that was not added to it never ran against this database and
                  # the deploy still reported success, which is exactly how
                  # 20260804000000 and 20260804010000 went missing. The bundled
                  # Supabase has always scanned (deploy/self-host/init/apply-migrations.sh);
                  # this loop keeps the same _selfhost.schema_migrations ledger,
                  # so it can scan too.
                  #
                  # Two exclusion lists, for two different reasons. They are the
                  # only thing worth stating by hand, because they are decisions
                  # rather than omissions — and unlike the old list, forgetting
                  # to touch them fails safe (a new migration simply applies).
                  #
                  # NEVER: the squashed baseline. It is for brand-new databases
                  # only — its own header says so — and this database predates
                  # it. Applying it here would replay the entire schema over a
                  # live one.
                  NEVER="20260601000000_baseline.sql"
                  #
                  # WITHHELD: correct for this database, but not yet. Empty
                  # right now — 20260804020000 sat here until its FC was
                  # redeployed, and both landed on 2026-08-04. Anything added
                  # back must say why, and who clears it.
                  WITHHELD=""

                  for migration in $(ls /migrations/*.sql | xargs -n1 basename | sort)
                  do
                    case " $NEVER " in
                      *" $migration "*)
                        echo "never applied to the external database: $migration"
                        continue
                        ;;
                    esac
                    case " $WITHHELD " in
                      *" $migration "*)
                        echo "withheld (see comment above): $migration"
                        continue
                        ;;
                    esac
                    if [ "$(psql -Atc "select exists (select 1 from _selfhost.schema_migrations where filename = \$\$${migration}\$\$)")" = "t" ]; then
                      echo "skip external migration: $migration"
                      continue
                    fi
                    echo "apply external migration: $migration"
                    psql -v ON_ERROR_STOP=1 -f "/migrations/$migration"
                    psql -v ON_ERROR_STOP=1 -c "insert into _selfhost.schema_migrations (filename) values (\$\$${migration}\$\$)"
                  done
                '
            fi
            # FC -> gateway, for the credits/quota routes. The client-facing
            # URL is per-team (team_workspace_config.llm_base_url), not an env var.
            upsert_env AI_GATEWAY_INTERNAL_URL "http://ai-gateway:4001"

            # Shared secret for the gateway's /internal/* routes (FC -> gateway).
            # Preserved once set: rotating it locks FC out of an already-running
            # gateway until both restart together.
            if ! grep -qE '^AI_GATEWAY_SERVICE_TOKEN=.+' .env; then
              upsert_env AI_GATEWAY_SERVICE_TOKEN "$(openssl rand -hex 32)"
            fi
            # Where the gateway asks GoTrue who a token belongs to. In-network;
            # it never needs the public hostname.
            grep -qE '^SUPABASE_URL=.+' .env || upsert_env SUPABASE_URL "http://kong:8000"

            # The gateway's own least-privilege database login.
            #
            # The migration creates the `ai_gateway` role NOLOGIN on purpose so
            # no credential lives in git — which means SOMETHING has to grant it
            # login, and that something is here. Without this the container
            # crash-loops on "DATABASE_URL is required" and the deploy's health
            # wait times out.
            #
            # Generated once and preserved: regenerating on every deploy would
            # invalidate the URL already in .env for the running container.
            if ! grep -qE '^AI_GATEWAY_DB_URL=.+' .env; then
              GW_PW="$(openssl rand -hex 24)"
              docker compose exec -T -e PGPASSWORD="$(grep '^POSTGRES_PASSWORD=' .env | cut -d= -f2-)" \
                db psql -U supabase_admin -d postgres -q \
                -c "alter role ai_gateway login password '$GW_PW';"
              upsert_env AI_GATEWAY_DB_URL "postgres://ai_gateway:$GW_PW@db:5432/postgres"
              echo "  provisioned ai_gateway database login"
            else
              echo "  keep AI_GATEWAY_DB_URL (already set)"
            fi

            # Per-deployment catalog. Deliberately not in git (upstream keys and
            # prices differ per deployment), so seed it from the example on
            # first deploy.
            #
            # This must run BEFORE `docker compose up`: a missing bind source is
            # not an error to Docker, it creates a DIRECTORY at that path and
            # the gateway dies with EISDIR.
            if [ ! -f ai/catalog.yaml ]; then
              [ -d ai/catalog.yaml ] && rmdir ai/catalog.yaml
              cp ai/catalog.example.yaml ai/catalog.yaml
              echo "  seeded ai/catalog.yaml from the example"
            fi
            upsert_env DEEPSEEK_API_KEY "$DEEPSEEK_API_KEY"

            # Google sign-in. sync_env (not upsert_env) so clearing the GitHub
            # secret actually turns the provider back off instead of leaving a
            # stale credential in the server .env. ENABLE_GOOGLE_SIGNUP is
            # derived rather than a separate secret: a half-configured provider
            # (enabled with no client id) makes GoTrue answer authorize requests
            # with a redirect to Google that can only fail, so the flag must not
            # be able to drift away from the credential pair.
            sync_env GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
            sync_env GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
            # Egress proxy for GoTrue (see supabase/docker-compose.yml). Google is
            # unreachable from this box without it, so an empty secret must clear
            # the key rather than leave a stale proxy in place.
            sync_env AUTH_EGRESS_PROXY "$AUTH_EGRESS_PROXY"
            if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
              upsert_env ENABLE_GOOGLE_SIGNUP "true"
            else
              upsert_env ENABLE_GOOGLE_SIGNUP "false"
            fi

            # GoTrue only honours a redirect_to that matches GOTRUE_URI_ALLOW_LIST
            # (= ADDITIONAL_REDIRECT_URLS); anything else is silently rewritten to
            # SITE_URL. The desktop loopback would then sit waiting for a code that
            # never arrives — a hang rather than an error. The server .env predates
            # OAuth and has this blank, and it is not a secret, so seed it here.
            # Merge instead of overwrite: an entry added by hand on the box (a new
            # client scheme, a staging callback) must survive the next deploy.
            redirects="$(grep '^ADDITIONAL_REDIRECT_URLS=' .env | head -1 | cut -d= -f2-)"
            for want in 'http://127.0.0.1:*/callback' 'teamclu://auth-callback'; do
              printf '%s' "$redirects" | tr ',' '\n' | grep -Fxq "$want" \
                || redirects="${redirects:+$redirects,}$want"
            done
            upsert_env ADDITIONAL_REDIRECT_URLS "$redirects"

            echo "=== build fc + ai-gateway ==="
            # BOTH locally-built services. `up` runs with --pull never and no
            # --build, so anything omitted here keeps whatever image it was
            # first created from — silently, and forever.
            #
            # ai-gateway was missing from this line when it was introduced, so
            # every gateway change after the first deploy ran against stale
            # code. The symptom is a 404 on a route that demonstrably exists in
            # the repo, which sends you looking at routing rather than at the
            # image. Add any new locally-built service here.
            #
            # amuxd also has a `build:` in compose but is deliberately NOT here:
            # that build is for local dev, while this box receives amuxd as a
            # prebuilt image via daemon-deploy.yml's `docker load`.
            docker compose build fc ai-gateway

            # `up --pull never` fetches nothing, so any image this compose file
            # adds must be pulled here or the whole `up` aborts with "No such
            # image". Guarded by the service list, which only names services
            # whose profile is active — a box that never enabled MinIO skips it.
            if docker compose config --services | grep -qx minio; then
              echo "=== pull minio (up --pull never will not fetch it) ==="
              for svc in minio minio-init; do
                pulled=""
                for i in 1 2 3; do
                  if docker compose pull "$svc"; then pulled=yes; break; fi
                  echo "  $svc pull attempt $i failed; retrying in 10s"
                  sleep 10
                done
                [ -n "$pulled" ] || { echo "$svc image pull failed after 3 attempts"; exit 1; }
              done
            fi

            echo "=== up ==="
            docker compose up -d --pull never --remove-orphans

            # auth is recreated whenever its env changes (mailer templates, OAuth,
            # etc.). Kong keeps stale upstream connections to the old container IP
            # and answers /auth/v1/* with "invalid response from upstream" until
            # restarted — which makes the post-deploy e2e suite fail on refresh.
            echo "=== restart kong (flush stale auth upstream after compose up) ==="
            docker compose restart kong
            timeout 60 sh -c \
              'until docker compose ps kong | grep -q "Up\|running"; do sleep 3; done'

            echo "=== wait for ai-gateway healthy ==="
            timeout 180 sh -c \
              'until docker compose ps ai-gateway | grep -q healthy; do sleep 5; done'

            echo "=== wait for fc healthy ==="
            timeout 90 sh -c \
              'until docker compose ps fc | grep -q healthy; do sleep 5; done'

            echo "=== restart caddy (Caddyfile is a bind-mount; up -d / reload don't reliably pick up edits) ==="
            docker compose restart caddy
            timeout 60 sh -c \
              'until docker compose ps caddy | grep -q "Up\|running"; do sleep 3; done'

            echo "=== ai-gateway smoke ==="
            sh /opt/teamclaw/deploy/self-host/smoke/ai-gateway-smoke.sh

            echo "=== e2e verification ==="
            if [ -n "$FC_SUPABASE_URL" ]; then
              curl --fail --silent --show-error --max-time 15 \
                -H "apikey: $FC_SUPABASE_SERVICE_ROLE_KEY" \
                -H "Authorization: Bearer $FC_SUPABASE_SERVICE_ROLE_KEY" \
                -H "Content-Profile: amux" \
                -H "Content-Type: application/json" \
                --data '{"p_default_org_id":null}' \
                "$FC_SUPABASE_URL/rest/v1/rpc/list_teams_for_picker" >/dev/null
              echo "external Supabase RPC smoke: OK"
            else
              cd /opt/teamclaw/services/fc
              npm ci --prefer-offline --silent
              sh /opt/teamclaw/deploy/self-host/smoke/run-e2e.sh
            fi

            echo "=== deploy complete ==="
