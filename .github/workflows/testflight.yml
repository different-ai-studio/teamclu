name: TestFlight

on:
  push:
    tags:
      - "ios-v*"
    branches:
      - main
    paths:
      - "apps/ios/**"
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether this run should actually publish, and absorbs the debounce
  # wait. Split out from the build so the 5-minute sleep burns Linux minutes
  # rather than a macOS runner, and so the decision is made before anything
  # expensive starts.
  #
  # Deliberately does NOT set `defaults.run.working-directory` — apps/ios only
  # exists after checkout, and pointing the default at it is what silently
  # killed every main-push release from 2026-08-01 onward.
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Debounce: wait before deciding, so a burst of iOS PRs merged in quick
      # succession collapses into a single release. Each new push cancels the
      # in-progress run (concurrency above) and restarts this timer. Tag pushes
      # and workflow_dispatch skip the wait.
      - name: Debounce (batch consecutive iOS merges)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: sleep 300

      # The release flow is "merge the iOS PR, then push an ios-v* tag", so both
      # triggers fire for the same commit. `concurrency` groups on github.ref,
      # and a tag and a branch are different refs, so neither cancels the other:
      # two runs each ask App Store Connect for the latest build number, both get
      # the same answer, and the loser's upload is rejected as a duplicate. That
      # is a guaranteed red run on every normal release.
      #
      # Resolved by deferring to the tag: after the debounce, if this commit now
      # carries an ios-v* tag, that tag's own run is publishing it, so this one
      # stands down. A main push with no tag behind it still releases as before.
      - name: Decide whether to publish
        id: decide
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            git fetch --tags --force --quiet
            tags=$(git tag --points-at HEAD | grep '^ios-v' || true)
            if [ -n "$tags" ]; then
              echo "This commit is tagged: $tags"
              echo "Its tag run publishes it — standing down to avoid a duplicate upload."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  build-and-upload:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: macos-26

    defaults:
      run:
        working-directory: apps/ios

    env:
      TEAM_ID: ${{ secrets.TEAM_ID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 60
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 6

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: apps/ios

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode.app 2>/dev/null | head -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer" || sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      # What this job actually needs is the `iphoneos` SDK, which ships with
      # Xcode. `-downloadPlatform iOS` fetches a *simulator runtime* on top of
      # that — a different artefact, and the one that keeps failing: on
      # 2026-09-23 it answered "Unable to connect to simulator" (exit 70) about
      # 20 seconds in, on two consecutive releases, and both only went out
      # because someone re-ran the job by hand. An unattended release that
      # stops there is indistinguishable from no release at all.
      #
      # So the download is attempted, retried once after clearing whatever
      # CoreSimulator state it choked on, and then allowed to fail. The gate is
      # the SDK assertion below, which is what the build is really waiting for:
      # an archive for `generic/platform=iOS` never touches a simulator runtime.
      - name: Install iOS platform
        run: |
          set -uo pipefail
          echo "Ensuring iOS platform is installed..."
          for attempt in 1 2; do
            if xcodebuild -downloadPlatform iOS; then
              echo "Platform download succeeded on attempt $attempt."
              break
            fi
            echo "::warning::xcodebuild -downloadPlatform iOS failed (attempt $attempt)."
            if [ "$attempt" = 1 ]; then
              # The failure is the download talking to CoreSimulator, so give
              # it a clean service to talk to before the second try.
              xcrun simctl shutdown all || true
              killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
              sleep 10
            fi
          done

          set -e
          echo "--- available SDKs ---"
          xcodebuild -showsdks
          # The real precondition. Fails the job loudly if Xcode somehow has no
          # device SDK, which no amount of retrying would fix.
          if ! xcodebuild -showsdks | grep -qi iphoneos; then
            echo "::error::No iphoneos SDK available; cannot archive for device."
            exit 1
          fi

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      # pb.swift is generated but checked in; a proto change without a
      # `pnpm ios:proto-gen` re-run ships a client that silently drops the
      # new fields. Regenerate and fail on drift. A failure here can also
      # mean brew's protoc/plugin moved ahead of dev machines — then the fix
      # is still the same: regenerate locally and commit the result.
      - name: Guard generated protobuf drift
        working-directory: ${{ github.workspace }}
        run: |
          brew install swift-protobuf
          protoc -I proto \
            --swift_out=apps/ios/Packages/AMUXCore/Sources/AMUXCore/Proto \
            --swift_opt=Visibility=Public \
            proto/amux.proto proto/teamclu.proto
          git diff --exit-code -- 'apps/ios/Packages/AMUXCore/Sources/AMUXCore/Proto/*.pb.swift' \
            || { echo '::error::pb.swift is stale — run `pnpm ios:proto-gen` and commit the result'; exit 1; }

      - name: Build and upload to TestFlight
        run: bundle exec fastlane beta
