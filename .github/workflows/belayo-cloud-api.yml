# Build and deploy the Belayo Cloud API to Dokploy.
#
# The source directory keeps its historical `services/fc` name, but this
# workflow deploys a container to Dokploy; it does not deploy Alibaba Cloud FC.
# The production application is pinned to the amd64 worker dokploy-worker-2.
# Images are immutable and are pushed through the Dokploy manager's existing
# Alibaba ACR login, so no registry password is stored in GitHub.
#
# IMPORTANT: this workflow never applies Belayo database migrations. Migrations
# under services/supabase/migrations remain a separate, manual production step
# and must be completed before releasing code that depends on them.
name: Belayo Cloud API

on:
  push:
    branches: [main]
    paths:
      - 'services/fc/**'
      - '.github/workflows/belayo-cloud-api.yml'
  workflow_dispatch:

concurrency:
  group: belayo-cloud-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 60, not 30, because the image ships over SSH.
    #
    # The push step streams the whole image tar from the GitHub runner to the
    # Dokploy manager in China (`docker save | gzip | ssh … docker load`),
    # which it does because IMAGE_REPO is an ACR *VPC* address the runner
    # cannot reach. That transfer is the entire cost of this job, it grows with
    # the image, and it is not something a retry makes faster.
    #
    # 30 was never headroom, it was the answer. The last green run took 29m55s
    # — five seconds under — and the next two both died at 29.7m in that step,
    # with the rollout step never reached. A deploy that half-lands is worse
    # than a slow one: on 2026-09-23 it left belayo with the migrations applied
    # and the old image still serving, which is a broken app-create until
    # someone notices.
    timeout-minutes: 60
    env:
      APP_ID: AyIydhRyN4pMT0_Y0TXvq
      SERVICE: teamclu-cloud-api-shadow-qjau6z
      WORKER: dokploy-worker-2
      # Belayo manager, worker and ACR are in one VPC. Keep this internal
      # endpoint; `shadow-<sha>` below identifies the switched environment.
      IMAGE_REPO: registry-vpc.cn-shenzhen.aliyuncs.com/betlysaas/teamclu-cloud-api
    steps:
      - uses: actions/checkout@v4

      - name: Verify the Cloud API
        working-directory: services/fc
        run: |
          npm ci
          npm run typecheck
          node --import tsx --test test/deploy-env-parity.test.ts
          npm run build

      # Since 2026-11-11 the Dokploy manager takes SSH only from the company
      # VPN (headscale), so a runner joins it as an ephemeral tag:ci node and
      # reaches the manager on its private address, the way saas-mono's
      # deploy workflows do. BELAYO_DOKPLOY_HOST must hold that private
      # address; the public one times out on port 22.
      #
      # No --accept-routes in `args`: v4 always passes it itself
      # (src/main.ts), and a second copy makes `tailscale up` exit with
      # "flag provided multiple times".
      - name: Join company VPN
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.BELAYO_CI_TS_AUTHKEY }}
          args: --login-server=https://hs.mx5.cn
          hostname: gha-teamclu-cloud-api-${{ github.run_id }}

      - name: Start ssh-agent
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add - <<< "${{ secrets.BELAYO_DEPLOY_SSH_KEY }}"
          mkdir -p ~/.ssh
          printf 'Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n' > ~/.ssh/config

      - name: Build amd64 and push through the Dokploy manager
        env:
          MGR: ${{ secrets.BELAYO_DOKPLOY_HOST }}
          TAG: ${{ github.sha }}
        run: |
          IMG="$IMAGE_REPO:shadow-${TAG::9}"
          docker build --platform linux/amd64 -t "$IMG" services/fc
          docker run --rm --entrypoint sh "$IMG" -c 'test -s dist/server.js'
          # Keep load, inspect and push in one checked remote command.  A
          # separate best-effort SSH invocation previously let Actions report
          # success while the worker could not pull the tag.
          docker save "$IMG" | gzip \
            | ssh "root@$MGR" \
                "set -eu; gunzip | docker load; docker image inspect '$IMG'; docker push '$IMG'; echo deployed-image=\"$IMG\" manager=\"\$(hostname)\""

      - name: Roll the Cloud API and record the desired image
        env:
          MGR: ${{ secrets.BELAYO_DOKPLOY_HOST }}
          TAG: ${{ github.sha }}
        run: |
          IMG="$IMAGE_REPO:shadow-${TAG::9}"
          scp .github/scripts/belayo-rollout.sh "root@$MGR:/tmp/belayo-rollout.sh"
          ssh "root@$MGR" chmod 700 /tmp/belayo-rollout.sh
          ssh "root@$MGR" /tmp/belayo-rollout.sh "$SERVICE" "$IMG" "$WORKER" "$APP_ID" 9000
          ssh "root@$MGR" rm -f /tmp/belayo-rollout.sh

      # The rollout script already asked the new task directly. This asks the
      # way a client does, through Cloudflare and Traefik. A failure here is an
      # ingress problem, not an image one, so it fails the run without rolling
      # the service back.
      - name: Smoke — the public endpoint answers
        run: |
          curl -fsS --max-time 20 -o /dev/null https://teamclaw-api.ucar.cc/healthz
          curl -fsS --max-time 20 -o /dev/null https://teamclaw-api.ucar.cc/v1/config/public
