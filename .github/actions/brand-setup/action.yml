name: Brand setup
description: >
  Materialise a brand from the private enterprise-branding repo: place
  build.config.json + branding/ assets on disk and export the brand's
  distribution knobs (OSS bucket/prefix/CDN, app name) into $GITHUB_ENV.

inputs:
  brand:
    description: "Release channel id — built-in teamclu, or a directory under brands/ (e.g. copilot361)"
    required: true
  branding-repo:
    description: "owner/repo of the private enterprise-branding repo"
    required: true
  branding-repo-pat:
    description: "PAT with read access to the branding repo"
    required: true
  oss-bucket-default:
    description: "Fallback OSS bucket when the brand does not declare one"
    required: false
    default: ""
  oss-endpoint-default:
    description: "Fallback OSS endpoint when the brand does not declare one"
    required: false
    default: ""
  cdn-base-default:
    description: "Fallback public CDN base when the brand does not declare one"
    required: false
    default: ""
  cdn-refresh-region-default:
    description: "Fallback Alibaba CDN region for mutable release files"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Fetch brand from the enterprise-branding repo
      shell: bash
      env:
        BRAND: ${{ inputs.brand }}
        BRANDING_REPO: ${{ inputs.branding-repo }}
        BRANDING_REPO_PAT: ${{ inputs.branding-repo-pat }}
        OSS_BUCKET_DEFAULT: ${{ inputs.oss-bucket-default }}
        OSS_ENDPOINT_DEFAULT: ${{ inputs.oss-endpoint-default }}
        CDN_BASE_DEFAULT: ${{ inputs.cdn-base-default }}
        CDN_REFRESH_REGION_DEFAULT: ${{ inputs.cdn-refresh-region-default }}
      run: |
        set -euo pipefail

        # TeamClu Beta is the first-party OSS channel, not an OEM brand. Keep
        # its release definition in this repository so it cannot be silently
        # renamed or repointed by the retired Betly configuration.
        if [ "$BRAND" = "teamclu" ]; then
          test -n "$OSS_BUCKET_DEFAULT" || { echo '::error::OSS bucket is not configured'; exit 1; }
          test -n "$OSS_ENDPOINT_DEFAULT" || { echo '::error::OSS endpoint is not configured'; exit 1; }
          test -n "$CDN_BASE_DEFAULT" || { echo '::error::OSS CDN base is not configured'; exit 1; }
          cp build.config.production.json build.config.json
          BRAND="$BRAND" python3 - <<'PY'
        import json, os

        with open('build.config.json', encoding='utf-8') as f:
            cfg = json.load(f)
        app = cfg.setdefault('app', {})
        # The Beta page and window make the product migration explicit; the
        # product name remains TeamClu so bundle paths stay compatible.
        app['displayName'] = 'TeamClu 群策'
        app['shortName'] = 'teamclu'
        with open('build.config.json', 'w', encoding='utf-8') as f:
            json.dump(cfg, f, ensure_ascii=False, indent=2)
            f.write('\n')

        out = {
            'BRAND': 'teamclu',
            'CHROME_EXTENSION_ID': '',
            'APP_NAME': app['displayName'],
            'APP_PRODUCT_NAME': app.get('name') or 'TeamClu',
            'APP_SLUG': 'teamclu',
            'OSS_BUCKET': os.environ['OSS_BUCKET_DEFAULT'],
            'OSS_ENDPOINT': os.environ['OSS_ENDPOINT_DEFAULT'],
            # Preserve the former TeamClaw beta URL while its domain remains
            # the compatibility distribution hostname.
            'OSS_PREFIX': 'beta',
            'CDN_BASE': os.environ['CDN_BASE_DEFAULT'].rstrip('/'),
            'CDN_REFRESH_REGION': os.environ.get('CDN_REFRESH_REGION_DEFAULT', ''),
            'BRAND_MAC_EXTRA_ARGS': '',
        }
        with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
            for key, value in out.items():
                f.write(f'{key}={value}\n')
        with open('brand-page.json', 'w', encoding='utf-8') as f:
            json.dump({
                'lang': 'zh-CN',
                'badge': '每日 Beta',
                'noindex': False,
                'footerNote': 'TeamClu 群策 Beta，每日构建，欢迎反馈。',
            }, f, ensure_ascii=False)
        PY
          exit 0
        fi

        # Unlike release.yml — which treats a missing branding repo as "build the
        # default TeamClu" — every brand this pipeline publishes is defined in
        # the branding repo. Silently degrading would push unbranded binaries into
        # a brand's bucket, so a missing PAT is a hard error.
        if [ -z "$BRANDING_REPO" ] || [ -z "$BRANDING_REPO_PAT" ]; then
          echo "::error::BRANDING_REPO / ENTERPRISE_BRANDING_REPO_PAT not configured — cannot resolve brand '$BRAND'"
          exit 1
        fi

        rm -rf .branding-src
        git clone --depth 1 "https://x-access-token:${BRANDING_REPO_PAT}@github.com/${BRANDING_REPO}.git" .branding-src 2>&1 \
          | sed -e "s/${BRANDING_REPO_PAT}/***/g"

        src=".branding-src/brands/${BRAND}"
        if [ ! -d "$src" ]; then
          echo "::error::Brand '${BRAND}' not found in ${BRANDING_REPO} (expected ${src}/). Available:"
          ls .branding-src/brands 2>/dev/null || echo "  (no brands/ directory)"
          exit 1
        fi
        if [ ! -f "$src/build.config.json" ]; then
          echo "::error::${src}/build.config.json is missing — a brand must carry its complete build config"
          exit 1
        fi

        cp "$src/build.config.json" build.config.json

        # Assets live at branding/<palette>/ because that is the path baked into
        # app.logo and the path scripts/lib/brand-theme.js reads theme.json from.
        if [ -d .branding-src/branding ]; then
          mkdir -p ./branding
          cp -R .branding-src/branding/. ./branding/
        fi

        # Chrome extension assets are per-brand, so they come from brands/<brand>/
        # rather than the shared branding/ tree — two brands publishing different
        # Web Store items must not read each other's icons and screenshots.
        # Landing them at branding/extension/ keeps the path that
        # scripts/lib/branding.js resolveExtensionIconPlan already reads.
        if [ -d "$src/extension" ]; then
          mkdir -p ./branding/extension
          cp -R "$src/extension/." ./branding/extension/
          echo "Extension assets: $(find ./branding/extension -type f | wc -l | tr -d ' ') file(s) from ${src}/extension"
        else
          echo "Extension assets: none (${src}/extension not present) — default icons and no listing kit"
        fi

        BRAND="$BRAND" python3 - <<'PY'
        import json, os

        brand = os.environ['BRAND']
        # encoding= is not optional: a brand's page copy is free text and is
        # routinely Chinese, while Python on the Windows runner defaults open()
        # to the cp1252 locale codec. Reading UTF-8 through cp1252 either raises
        # (betly's "尝鲜版" carries 0x9d, which cp1252 leaves undefined) or, worse,
        # silently mojibakes any brand whose bytes happen to dodge the five
        # undefined ones. Pin UTF-8 on every handle so the platform can't decide.
        cfg = json.load(open('build.config.json', encoding='utf-8'))
        app = cfg.get('app', {})

        meta_path = f'.branding-src/brands/{brand}/brand.json'
        meta = json.load(open(meta_path, encoding='utf-8')) if os.path.isfile(meta_path) else {}
        oss = meta.get('oss') or {}

        def pick(value, fallback_env):
            # A brand that omits an OSS field inherits the repo-level default, so
            # betly keeps publishing exactly where it does today without
            # restating the shared TeamClu bucket.
            return value or os.environ.get(fallback_env, '')

        bucket = pick(oss.get('bucket'), 'OSS_BUCKET_DEFAULT')
        endpoint = pick(oss.get('endpoint'), 'OSS_ENDPOINT_DEFAULT')
        cdn_base = pick(oss.get('cdnBase'), 'CDN_BASE_DEFAULT')
        prefix = oss.get('prefix')

        missing = [n for n, v in
                   (('oss.bucket', bucket), ('oss.endpoint', endpoint),
                    ('oss.cdnBase', cdn_base), ('oss.prefix', prefix)) if not v]
        if missing:
            print(f'::error::Brand {brand!r} resolves no value for: {", ".join(missing)}')
            raise SystemExit(1)

        # Two different names, per scripts/lib/branding.js: app.name is the
        # productName that bundles/filenames and /Applications/<x>.app are built
        # from, while app.displayName is the human-facing label (window title).
        # Conflating them would put "Betly TeamClu.app" in betly's quarantine
        # hint for a bundle actually named TeamClu.app.
        product_name = app.get('name') or 'TeamClu'
        app_name = app.get('displayName') or product_name
        # shortName doubles as the slug for OSS object names, so it must survive a
        # URL untouched. vite.config.ts enforces the same [a-z0-9]{1,20} rule.
        app_slug = app.get('shortName') or ''
        if not app_slug.isalnum() or not app_slug.islower() or len(app_slug) > 20:
            print(f'::error::app.shortName must be 1-20 chars of [a-z0-9]; got {app_slug!r}')
            raise SystemExit(1)

        # Each brand publishes to its own Web Store item, so the item ID belongs
        # to the brand rather than to a single repo-level secret that whichever
        # brand ran last would overwrite. The OAuth credentials stay repo-level:
        # they authenticate the publisher account, not the item. Empty here means
        # "fall back to the CHROME_EXTENSION_ID secret".
        chrome = meta.get('chromeWebStore') or {}

        out = {
            'BRAND': brand,
            'CHROME_EXTENSION_ID': chrome.get('extensionId') or '',
            'APP_NAME': app_name,
            'APP_PRODUCT_NAME': product_name,
            'APP_SLUG': app_slug,
            'OSS_BUCKET': bucket,
            'OSS_ENDPOINT': endpoint,
            'OSS_PREFIX': prefix,
            'CDN_BASE': cdn_base.rstrip('/'),
            # Empty => bucket is served straight from the OSS endpoint with no CDN
            # in front, so there is no edge cache to purge.
            #
            # A brand that DECLARES the key owns the answer, even when the answer
            # is null/"" ("I have no CDN"). Only a brand that omits it entirely
            # inherits the repo-level default. `or` could not tell those apart:
            # it treats an explicit null as absent, so copilot361 — which is
            # served straight from OSS and declares cdnRefreshRegion: null —
            # silently inherited the default the moment one was set, and its
            # release then failed on `InvalidDomain.NotFound` trying to purge a
            # domain that is not a CDN domain at all.
            'CDN_REFRESH_REGION': (
                (oss.get('cdnRefreshRegion') or '')
                if 'cdnRefreshRegion' in oss
                else os.environ.get('CDN_REFRESH_REGION_DEFAULT', '')
            ),
            'BRAND_MAC_EXTRA_ARGS': (meta.get('build') or {}).get('macExtraArgs') or '',
        }
        with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
            for k, v in out.items():
                f.write(f'{k}={v}\n')

        # brand.json's page block is consumed by the publish job; pass it as a file
        # rather than env vars so free-text copy can contain anything.
        json.dump(meta.get('page') or {}, open('brand-page.json', 'w', encoding='utf-8'))

        print(f'Brand         : {brand} ({app_name} / {product_name}.app)')
        print(f'Backend       : {cfg.get("cloudApiUrl")}')
        print(f'Palette       : {app.get("palette")}')
        print(f'Publishing to : oss://{bucket}/{prefix}/  via {cdn_base}')
        PY

        rm -rf .branding-src
