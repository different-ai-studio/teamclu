# Local / optional `cross` config for aarch64-unknown-linux-gnu.
#
# Release CI (`release-oss.yml` → build-amuxd-linux) no longer uses `cross`.
# It builds on ubuntu-22.04 with `gcc-aarch64-linux-gnu` so the published
# binary stays at glibc ≤ 2.35 (Debian bookworm / Armbian-compatible).
#
# Do NOT point `image` at `ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main`:
# that image is Ubuntu 24.04 (glibc 2.39) and recreates the bookworm break.
# If you need `cross` locally, prefer a 22.04-based custom image, or match CI
# and install `gcc-aarch64-linux-gnu` on an Ubuntu 22.04 host instead.
#
# openssl in apps/daemon is `vendored`, so a multiarch libssl-dev:arm64 is
# not required for the CI path.
