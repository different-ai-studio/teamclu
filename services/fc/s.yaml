edition: 3.0.0
name: teamclu-fc
access: default

resources:
  teamclu-sync:
    component: fc3
    props:
      # Platform choices — overridable, but the current values are the defaults
      # so an env file that omits them still deploys where it always did.
      region: ${env('FC_REGION', 'cn-shenzhen')}
      # Defaults to the legacy shared function. Set FC_FUNCTION_NAME to target
      # another Function Compute function from this same s.yaml + services/fc code.
      functionName: ${env('FC_FUNCTION_NAME', 'teamclu-sync')}
      runtime: ${env('FC_RUNTIME', 'nodejs20')}
      handler: dist/index.handler
      timeout: 30
      cpu: 0.4
      memorySize: 512
      diskSize: 512
      logConfig: auto
      internetAccess: true
      # Account-specific resource ids: deliberately NO defaults. These name real
      # resources in one Alibaba account, so a baked-in value is either wrong for
      # everyone else or a silent cross-account deploy. Serverless Devs aborts on
      # an unset ${env('X')}, which is the intended behaviour — see the required
      # check in deploy-aliyun-fc.sh for a readable error before it gets there.
      #
      # The FC function reaches Supabase over a VPC-internal address, so these
      # must stay in step with SUPABASE_URL — changing one without the other
      # leaves the function unable to reach the database.
      vpcConfig:
        vpcId: ${env('FC_VPC_ID')}
        securityGroupId: ${env('FC_SECURITY_GROUP_ID')}
        vSwitchIds:
          - ${env('FC_VSWITCH_ID')}
      code: ./
      environmentVariables:
        ACCESS_KEY_ID: ${env('ACCESS_KEY_ID')}
        ACCESS_KEY_SECRET: ${env('ACCESS_KEY_SECRET')}
        ROLE_ARN: ${env('ROLE_ARN')}
        # OSS bucket is account-specific — no default, same reasoning as the vpc
        # ids above. REGION/ENDPOINT are derived from the region and keep theirs.
        BUCKET: ${env('BUCKET')}
        REGION: ${env('REGION', 'cn-shenzhen')}
        ENDPOINT: ${env('ENDPOINT', 'https://oss-cn-shenzhen.aliyuncs.com')}
        # Where team file bodies live. `s3` puts them in OSS alongside app
        # bundles (this target's choice); blank keeps the historical Supabase
        # Storage path. Self-host sets the same var to `s3` and points it at its
        # own MinIO — one code path, two backends, chosen per deployment.
        TEAM_BLOBS_BACKEND: ${env('TEAM_BLOBS_BACKEND', 's3')}
        SYNC_MAX_FILES_PER_TEAM: ${env('SYNC_MAX_FILES_PER_TEAM', '')}
        # OSS addresses buckets virtual-host style; only MinIO needs path style.
        S3_FORCE_PATH_STYLE: ${env('S3_FORCE_PATH_STYLE', '')}
        LITELLM_URL: ${env('LITELLM_URL', 'https://ai.ucar.cc')}
        LITELLM_MASTER_KEY: ${env('LITELLM_MASTER_KEY', '')}
        # Blank = no cap, matching the compose default. Keep the two targets in
        # step: a default that differs per target is how the $1 cap went unnoticed.
        LITELLM_DEFAULT_TEAM_MAX_BUDGET_USD: ${env('LITELLM_DEFAULT_TEAM_MAX_BUDGET_USD', '')}
        # LiteLLM usage reads the `litellm` database on the SAME Postgres instance
        # as the primary FC connection (DATABASE_URL/POSTGRES_*); only the db name
        # differs. Override the db name here if it is not `litellm`.
        LITELLM_DB_NAME: ${env('LITELLM_DB_NAME', 'litellm')}
        CODEUP_ORG_ID: ${env('CODEUP_ORG_ID', '')}
        CODEUP_PAT: ${env('CODEUP_PAT', '')}
        CODEUP_BOT_USERNAME: ${env('CODEUP_BOT_USERNAME', 'teamclu')}
        # Admin connection to the shared per-app Postgres DB (teamclaw_apps),
        # same RDS instance as the control plane but a DIFFERENT database. Used
        # only by apps provisioning (CREATE SCHEMA / CREATE ROLE). Never sent
        # to clients.
        APPS_DB_ADMIN_URL: ${env('APPS_DB_ADMIN_URL', '')}
        # FC 3.0 data-plane host for the apps module's own function calls. It is
        # account-scoped (<accountId>.<region>.fc.aliyuncs.com) and unrelated to
        # the OSS ENDPOINT above. Set one of the two.
        APPS_FC_ENDPOINT: ${env('APPS_FC_ENDPOINT', '')}
        ALIYUN_ACCOUNT_ID: ${env('ALIYUN_ACCOUNT_ID', '')}
        # Optional dedicated OSS profile for app code artifacts. On THIS target
        # everything already lives in one Alibaba account, so leaving these
        # blank keeps using ACCESS_KEY_ID / BUCKET / REGION / ENDPOINT above —
        # app deploys need no new configuration here. Self-host sets them
        # because its default S3 config is a box-local MinIO that Function
        # Compute cannot read code from.
        APPS_ACCESS_KEY_ID: ${env('APPS_ACCESS_KEY_ID', '')}
        APPS_ACCESS_KEY_SECRET: ${env('APPS_ACCESS_KEY_SECRET', '')}
        APPS_OSS_BUCKET: ${env('APPS_OSS_BUCKET', '')}
        APPS_REGION: ${env('APPS_REGION', '')}
        APPS_OSS_ENDPOINT: ${env('APPS_OSS_ENDPOINT', '')}
        # Parent domain for per-app vanity hostnames. Only self-host has the
        # reverse proxy that terminates them, so this is normally blank here —
        # declared so the two targets stay in step (deploy-env-parity.test.ts).
        APPS_PUBLIC_DOMAIN: ${env('APPS_PUBLIC_DOMAIN', '')}
        PUSH_WEBHOOK_SECRET: ${env('PUSH_WEBHOOK_SECRET')}
        MARKETPLACE_ADMIN_SECRET: ${env('MARKETPLACE_ADMIN_SECRET', '')}
        AGENT_MANAGEMENT_GRANT_SECRET: ${env('AGENT_MANAGEMENT_GRANT_SECRET', '')}
        CRON_TRIGGER_SECRET: ${env('CRON_TRIGGER_SECRET', '')}
        # Raw-TCP address for clients whose MQTT stack can't do WebSocket (iOS
        # CocoaMQTT, Expo). Keep in step with the compose `environment:` map —
        # a var declared on only one target silently drops `mqtt.tcpUrl` from
        # /v1/config/bootstrap there.
        MQTT_PUBLIC_TCP_BROKER_URL: ${env('MQTT_PUBLIC_TCP_BROKER_URL', '')}
        SUPABASE_URL: ${env('SUPABASE_URL')}
        SUPABASE_PUBLIC_URL: ${env('SUPABASE_PUBLIC_URL', '')}
        SUPABASE_SERVICE_ROLE_KEY: ${env('SUPABASE_SERVICE_ROLE_KEY')}
        SUPABASE_ANON_KEY: ${env('SUPABASE_ANON_KEY')}
        # Client-encrypted blobs: team file-sync bodies and skill packages.
        # These name Supabase buckets on the supabase backend; on
        # TEAM_BLOBS_BACKEND=s3 they are key PREFIXES inside the single BUCKET
        # above, which also holds app bundles under `apps/`. The prefix is what
        # keeps knowledge blobs and skill packages apart — their object paths are
        # otherwise byte-identical. Both have working defaults,
        # but `s deploy` overwrites the whole environment map — an undeclared
        # var simply never arrives, so declare them even when unset.
        TEAM_BLOBS_STORAGE_BUCKET: ${env('TEAM_BLOBS_STORAGE_BUCKET', 'team-blobs')}
        SKILLS_STORAGE_BUCKET: ${env('SKILLS_STORAGE_BUCKET', 'team-skills')}
        APNS_PRIVATE_KEY_P8: ${env('APNS_PRIVATE_KEY_P8')}
        APNS_KEY_ID: ${env('APNS_KEY_ID')}
        APNS_TEAM_ID: ${env('APNS_TEAM_ID')}
        APNS_TOPIC: ${env('APNS_TOPIC')}
        APNS_ENV: ${env('APNS_ENV')}
        # The ONE broker address: used by FC's own inbox publisher AND handed to
        # clients by /v1/config/bootstrap. Must be reachable by clients, not just
        # from inside the container. Required — no default, so a blank aborts the
        # deploy rather than shipping a bootstrap with no `mqtt` block.
        MQTT_BROKER_URL: ${env('MQTT_BROKER_URL')}
        MQTT_USERNAME: ${env('MQTT_USERNAME')}
        MQTT_PASSWORD: ${env('MQTT_PASSWORD')}
        MQTT_USE_TLS: ${env('MQTT_USE_TLS', '')}
        WEBSSO_LOGIN_URL: ${env('WEBSSO_LOGIN_URL', '')}
        WEBSSO_STORAGE_KEY: ${env('WEBSSO_STORAGE_KEY', '')}
        # Runtime feature flags served by /v1/config/{public,bootstrap}.
        #
        # The DURABLE values live in src/lib/feature-profiles.ts, in git — not
        # here. `s deploy` rewrites this whole environment map, so a var missing
        # from the deploying machine's env file wipes it rather than preserving
        # it; a login method configured only through env would disappear on the
        # next unrelated deploy. The profile name below has a non-empty default
        # so an operator who sets nothing still selects the right profile.
        #
        # APP_FEATURES_JSON is the emergency override only, and on this target
        # it is lost at the next deploy. Keep in step with the compose
        # `environment:` map — a var declared on only one target silently drops
        # the whole features block there.
        #
        # Deliberately NO default profile here, unlike compose. This s.yaml
        # deploys more than one Cloud API (belayo at teamclu-api.ucar.cc, and
        # the copilot361 backend), so any default is the wrong brand's flags for
        # somebody: a copilot361 deploy that inherited `belayo` would switch on
        # phone login for users whose build never offered it. Unset means "no
        # overrides", which is always safe — clients keep their baked config.
        # Each env file names its own profile; deploy-aliyun-fc.sh prints it.
        APP_FEATURES_PROFILE: ${env('APP_FEATURES_PROFILE', '')}
        APP_FEATURES_JSON: ${env('APP_FEATURES_JSON', '')}
        # Set to true when a reverse proxy (Caddy/FC gateway) handles CORS so
        # Hono's own CORS middleware is skipped — prevents duplicate headers.
        CORS_HANDLED_BY_PROXY: ${env('CORS_HANDLED_BY_PROXY', '')}
        DATABASE_URL: ${env('DATABASE_URL', '')}
        # Parts-based fallback for the same primary Postgres connection.
        # `resolveLiteLlmConnString` (lib/litellm-usage.ts) prefers DATABASE_URL
        # and falls back to these. Without them declared here that fallback was
        # unreachable in production: LiteLLM usage 503s the moment DATABASE_URL
        # is blank instead of degrading to the parts it already knows how to use.
        POSTGRES_HOST: ${env('POSTGRES_HOST', '')}
        POSTGRES_PORT: ${env('POSTGRES_PORT', '')}
        POSTGRES_USERNAME: ${env('POSTGRES_USERNAME', '')}
        POSTGRES_PASSWORD: ${env('POSTGRES_PASSWORD', '')}
        BACKEND_KIND: ${env('BACKEND_KIND', 'supabase')}
        # Phone login (partner-aligned). DEFAULT_ORG_ID = the default tenant new
        # users join; PHONE_EMAIL_DOMAIN = domain of the synthetic auth email
        # (`<phone>@<domain>`) and therefore half the account identity — it must
        # match the partner SaaS sharing this GoTrue, or phone users get a
        # parallel set of accounts; PHONE_AUTH_ENCRYPTION_KEY salts the
        # placeholder password for newly-created phone users (never
        # re-verified); SMS_DEBUG_MODE returns the code in the response instead
        # of sending SMS (dev only).
        DEFAULT_ORG_ID: ${env('DEFAULT_ORG_ID', '')}
        PHONE_EMAIL_DOMAIN: ${env('PHONE_EMAIL_DOMAIN', '')}
        PHONE_AUTH_ENCRYPTION_KEY: ${env('PHONE_AUTH_ENCRYPTION_KEY', '')}
        SMS_DEBUG_MODE: ${env('SMS_DEBUG_MODE', '')}
        AUTH_SECRET: ${env('AUTH_SECRET', '')}
        AUTH_BASE_URL: ${env('AUTH_BASE_URL', 'https://cloud.ucar.cc')}
        PG_POOL_MAX: ${env('PG_POOL_MAX', '1')}
        OTP_EMAIL_SMTP_HOST: ${env('OTP_EMAIL_SMTP_HOST', '')}
        OTP_EMAIL_SMTP_PORT: ${env('OTP_EMAIL_SMTP_PORT', '')}
        OTP_EMAIL_SMTP_USER: ${env('OTP_EMAIL_SMTP_USER', '')}
        OTP_EMAIL_SMTP_PASS: ${env('OTP_EMAIL_SMTP_PASS', '')}
        OTP_EMAIL_SMTP_SECURE: ${env('OTP_EMAIL_SMTP_SECURE', '')}
        OTP_EMAIL_FROM: ${env('OTP_EMAIL_FROM', '')}
        APPLE_CLIENT_ID: ${env('APPLE_CLIENT_ID', '')}
        APPLE_CLIENT_SECRET: ${env('APPLE_CLIENT_SECRET', '')}
        GOOGLE_CLIENT_ID: ${env('GOOGLE_CLIENT_ID', '')}
        GOOGLE_CLIENT_SECRET: ${env('GOOGLE_CLIENT_SECRET', '')}
      triggers:
        # Trigger name is parameterized so we can adopt a pre-existing function's
        # http trigger (FC console default is `defaultTrigger`). Defaults to
        # http-trigger for the legacy teamclu-sync function.
        - triggerName: ${env('FC_HTTP_TRIGGER_NAME', 'http-trigger')}
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
        - triggerName: oss-abandon-sessions
          triggerType: timer
          triggerConfig:
            cronExpression: '0 */15 * * * *'
            enable: true
            payload: '{"task":"oss-abandon-sessions"}'
        - triggerName: oss-gc-blobs
          triggerType: timer
          triggerConfig:
            cronExpression: '0 17 4 * * *'
            enable: true
            payload: '{"task":"oss-gc-blobs"}'
