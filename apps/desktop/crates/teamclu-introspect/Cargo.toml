[package]
name = "teamclu-introspect"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "teamclu-introspect"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time"] }
serde_json = "1"
# default-features off, rustls only: release-oss builds this sidecar in the
# same cargo invocation as amuxd, and reqwest's `default` (native-tls) would
# unify into amuxd's build — the beta.63 TLS-backend drift. Gate:
# scripts/verify-reqwest-rustls.sh.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
teamclu-runtime-env = { path = "../../../../crates/teamclu-runtime-env" }
uuid = { version = "1", features = ["v4"] }

# Link the MSVC VC runtime statically (UCRT stays dynamic, it ships with
# Windows). Without it this sidecar imports VCRUNTIME140.dll, which a clean
# Windows install does not have, and fails to start with "找不到
# VCRUNTIME140.dll". The desktop exe gets the same treatment from the Tauri CLI
# (STATIC_VCRUNTIME); sidecars built with plain cargo do not. No-op off MSVC.
[build-dependencies]
static_vcruntime = "3.0"

[dev-dependencies]
tempfile = "3"
