[package]
name = "amuxd"
version = "0.4.1-beta.37"
edition = "2021"

[dependencies]
# MQTT
rumqttc = { version = "0.24", features = ["websocket"] }

# NATS (alternative transport)
async-nats = "0.49"
futures-util = "0.3"

# Protobuf
prost = { workspace = true }
prost-types = { workspace = true }
teamclu-gateway = { path = "../../crates/teamclu-gateway" }
teamclu-proto = { path = "../../crates/teamclu-proto" }
teamclu-runtime-env = { path = "../../crates/teamclu-runtime-env" }
teamclu-transport = { path = "../../crates/teamclu-transport" }
teamclu-types = { path = "../../crates/teamclu-types" }
teamclu-skillpack = { path = "../../crates/teamclu-skillpack" }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
async-trait = "0.1"
futures = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"

# Config & serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
teamclu-binpath = { path = "../../crates/teamclu-binpath" }

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
rand = "0.8"
subtle = "2"
getrandom = "0.2"
flate2 = "1"
walkdir = "2"
# gitignore-syntax matching for the sync ignore rules (ripgrep's implementation).
ignore = "0.4"
# App starter templates are compiled into the binary (see sync::app_templates)
# so seeding an app needs no network, no git remote, and no credentials.
include_dir = "0.7"
# Event-driven filesystem watching (FSEvents/inotify/ReadDirectoryChangesW) for
# runtime refresh — replaces the old 350ms recursive-walk poll loop.
notify = { version = "8", features = ["macos_fsevent"] }
# Archive unpack (opencode release assets: zip on macOS/Windows, tar.gz on Linux)
zip = { version = "5", default-features = false, features = ["deflate"] }
# Runtime, not just tests: the team-skills reconcile unpacks each archive into a
# staging dir before swapping it over the installed pack.
tempfile = "3"
tar = "0.4"
humantime-serde = "1"
parking_lot = "0.12"

# HTTP / SSE (browser-facing daemon API)
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.5", features = ["util", "limit", "timeout"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "request-id", "util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
mime = "0.3"

# TLS (match rumqttc 0.24's rustls version)
rustls = "0.22"
tokio-rustls = "0.25"

# HTTP / JWT / crypto (Cloud API client + team_shared_env)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
base64 = "0.22"
# Attachment image downscale before base64-inlining into ACP prompts (issue #710)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
url = "2"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hex = "0.4"
urlencoding = "2"
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Mac → Linux cross-compile (cargo-zigbuild): teamclu-gateway pulls native-tls/openssl-sys;
# vendored builds OpenSSL from source so no Linux sysroot/pkg-config is needed on the host.
#
# Unix-only on purpose. As a plain dependency this also reached the Windows
# build, where native-tls uses schannel and nothing else wants openssl-sys — so
# the only thing it accomplished was making the runner compile OpenSSL from
# source, which needs perl/NASM and fails there:
#   cargo:warning=configuring OpenSSL build: 'perl' reported failure with exit code: 2
# That killed build-windows in release-oss, and publish-manifest requires it, so
# the 2026-08-03 nightly published nothing for either brand.
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
wiremock = "0.6"
async-nats = "0.49"
