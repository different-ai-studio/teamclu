openapi: 3.1.0
info:
  title: TeamClu Cloud API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.teamclu.local
security:
  - bearerAuth: []
tags:
  - name: Teams
    description: Team membership and team metadata.
  - name: Sessions
    description: Conversation session list and detail surfaces.
  - name: Messages
    description: Session message read and write operations.
  - name: Invites
    description: Team invite claim operations.
  - name: Workspaces
    description: Workspace CRUD operations.
  - name: Actors
    description: Actor directory and agent access management.
  - name: Notifications
    description: Notification preferences and session mute management.
  - name: Shortcuts
    description: Shortcut management and visibility control.
  - name: Config
    description: Runtime configuration delivered to authenticated clients (MQTT broker, feature flags).
  - name: Apps
    description: Per-app repo provisioning and the deploy pipeline (FC function + Postgres schema).
paths:
  /v1/auth/refresh:
    post:
      operationId: refreshAccessToken
      summary: Exchange a refresh token for a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, refreshToken, expiresAt]
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  expiresAt:
                    type: integer
                    format: int64
        "401":
          $ref: "#/components/responses/Error"
  /v1/teams:
    get:
      operationId: listTeams
      summary: List teams
      tags: [Teams]
      parameters:
        - name: scope
          in: query
          required: false
          description: |
            `all` returns the cross-org team picker source: the caller's teams
            across every org, unioned with PUBLIC teams in those orgs that the
            caller may join (each carrying `isMember`). Omitted returns only
            teams in the caller's current org that they are an actor in.
          schema:
            type: string
            enum: [all]
      responses:
        "200":
          description: Current user's teams.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Team"
                  nextCursor:
                    type:
                      - string
                      - "null"
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: createTeam
      summary: Create team
      tags: [Teams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                slug:
                  type:
                    - string
                    - "null"
                displayName:
                  description: |
                    Owner's display name for the auto-created member actor (e.g.
                    the OS full name or account email prefix). When omitted or
                    blank, the server synthesizes a stable "Adjective Animal"
                    handle seeded from the actor id. Replaces the legacy "You"
                    default.
                  type:
                    - string
                    - "null"
      responses:
        "200":
          description: |
            Created team. Writes the teams row and seeds team_workspace_config;
            the team's AI gateway is configured separately via
            `PUT /v1/teams/{teamId}/llm-config`.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/teams/bootstrap:
    post:
      operationId: bootstrapTeam
      summary: Resolve the caller's org and enter its default team
      description: >-
        Login onboarding, in one transaction. Resolves the caller's
        organization — minting one named after them (nickname, else the OAuth
        full name, else the email local part) when they belong to none — and
        returns that org's PUBLIC default team, creating it with the org's name
        on first use. An org that already has a public team yields that team
        with the caller enrolled as a member; it never creates a second one.

        Deployments that turn self-registration off answer `403
        registration_disabled` for a caller with no organization. Sign-in
        itself still succeeds, so an invitee can authenticate and then claim
        their invite.
      tags: [Teams]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  description: >-
                    Best-effort human name for the caller's member actor only.
                    It never names the org or the team — the server resolves
                    those from the account, because this value prefers the OS
                    account name, which on a fleet-imaged machine is not the
                    user.
                  type: [string, "null"]
      responses:
        "200":
          description: Bootstrapped team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "403":
          description: >-
            `registration_disabled` — self-registration is off on this
            deployment and the caller has no organization to enter.
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/teams/{teamId}:
    get:
      operationId: getTeam
      summary: Get team
      tags: [Teams]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Team.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateTeam
      summary: Update team (rename and/or visibility)
      tags: [Teams]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        description: At least one of `name` or `visibility` must be provided.
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 1
                visibility:
                  type: string
                  enum: [public, private]
      responses:
        "200":
          description: Updated team.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/teams/{teamId}/join:
    post:
      operationId: joinPublicTeam
      summary: Join a public team
      description: |
        Self-service join of a PUBLIC team. Adds the caller as a plain `member`
        (idempotent if already joined). Anonymous users must sign in first.
      tags: [Teams]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: The joined team.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/teams/{teamId}/invites:
    post:
      operationId: createTeamInvite
      summary: Create team invite
      tags: [Teams]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, displayName]
              properties:
                kind:
                  type: string
                  enum: [member, agent]
                  description: >-
                    `actorType` is accepted as a legacy alias.
                actorType:
                  type: string
                  enum: [member, agent]
                  deprecated: true
                  description: Legacy alias for `kind`.
                displayName:
                  type: string
                  minLength: 1
                teamRole:
                  type: string
                  enum: [owner, admin, member]
                  description: >-
                    Required when `kind=member`. `role` is accepted as a legacy alias.
                role:
                  type: string
                  deprecated: true
                  description: Legacy alias for `teamRole`.
                agentKind:
                  type:
                    - string
                    - "null"
                  description: Required when `kind=agent`.
                ttlSeconds:
                  type:
                    - integer
                    - "null"
                  description: Invite lifetime. Defaults to 604800 (7 days); floored at 60.
                targetActorId:
                  type:
                    - string
                    - "null"
                  format: uuid
                  description: >-
                    Re-invite an existing actor instead of creating a new one.
                    Agent invites only — it rotates the daemon's credentials onto
                    the same actor. Rejected with 22023 for `kind: member`; the
                    member equivalent was removed because its claim side could
                    never be reached by the person the link was for.
                inviteEmail:
                  type:
                    - string
                    - "null"
                  format: email
                  description: >-
                    Optional invitee email, member invites only. When set, the invitee
                    sees this invite via `listPendingInvites` after signing in with a
                    matching verified email — no token needs to reach them. Re-inviting
                    the same contact supersedes the previous pending invite.
                invitePhone:
                  type:
                    - string
                    - "null"
                  description: >-
                    Optional invitee phone, member invites only. Compared
                    digit-normalized against the signed-in user's verified phone.
      responses:
        "201":
          description: Created invite.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt, deeplink]
                properties:
                  token:
                    type: string
                  expiresAt:
                    type:
                      - string
                      - "null"
                    format: date-time
                  deeplink:
                    type:
                      - string
                      - "null"
                    description: "`amux://invite?token=…` — shareable out-of-band."
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        # `upgrade_required`: the team is still in the shared default org, which is
        # solo-only. Member invites need the account upgraded into its own org.
        "403":
          $ref: "#/components/responses/Error"
  /v1/teams/{teamId}/members/{actorId}:
    delete:
      operationId: removeTeamActor
      summary: Remove team actor
      description: |
        Hard-deletes a team actor. Members require team owner/admin.
        Personal agents require the owning member (`agentOwnerMemberId`).
        Team agents require team owner/admin. May return 409 when foreign-key
        references block deletion (`agent_delete_blocked_by_*`).
      tags: [Teams]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: actorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: OK
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/sessions:
    get:
      operationId: listSessions
      summary: List sessions
      description: |
        Sessions the calling actor participates in, newest activity first,
        excluding archived ones. Scoped to one team, optionally narrowed to one
        idea.

        This replaced `GET /v1/teams/{teamId}/sessions`, which returned a
        team's whole session list unpaginated. Callers that want every session
        in a team pass `teamId` and follow `nextCursor` to exhaustion.

        `teamId` is **required**. It identifies the caller's actor (one actor
        row per user per team) and it is the only thing that lets the query use
        an index — the un-scoped listing it replaced walked every participant
        row the caller had and sorted, which measured 4.5s at 6k sessions and
        timed out into a 500 past ~13k. Omitting it returns 400.
      tags: [Sessions]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
        - name: teamId
          in: query
          required: true
          description: The team to list sessions for.
          schema:
            type: string
            format: uuid
        - name: ideaId
          in: query
          description: >-
            Narrow to sessions attached to one idea. Applied server-side —
            filtering the returned page client-side would miss matches on
            later pages.
          schema:
            type: string
            format: uuid
        - name: kind
          in: query
          description: >-
            Session type to paginate. The filter is applied before LIMIT so
            regular and scheduled sessions have independent page boundaries.
          schema:
            type: string
            enum: [all, regular, cron]
            default: all
      responses:
        "200":
          description: Current actor sessions.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
                  nextCursor:
                    type:
                      - string
                      - "null"
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: createSession
      summary: Create session
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreate"
      responses:
        "201":
          description: Created session with participants.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionWithParticipants"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/sessions/{sessionId}:
    get:
      operationId: getSession
      summary: Get session with participants
      description: |
        `teamId` is **required**: it scopes the read to a team the caller has an
        actor in, so a session id from another team is a 404 at the query level
        rather than relying on RLS alone to hide the row.
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: teamId
          in: query
          required: true
          description: The team the session belongs to.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Session with participants.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionWithParticipants"
        "404":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
    patch:
      operationId: patchSession
      summary: Update session
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                mode:
                  type: string
                  enum: [solo, collab, control]
                ideaId:
                  type:
                    - string
                    - "null"
                  format: uuid
                archived:
                  type: boolean
      responses:
        "200":
          description: Updated session.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/sessions/{sessionId}/mark-viewed:
    post:
      operationId: markSessionViewed
      summary: Mark session viewed
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                lastReadMessageId:
                  type:
                    - string
                    - "null"
                  description: Pin the read marker to a specific message id. If omitted, the marker advances to the most recent message.
      responses:
        "204":
          description: OK
        "401":
          $ref: "#/components/responses/Error"
  /v1/sessions/{sessionId}/mark-unread:
    post:
      operationId: markSessionUnread
      summary: Mark session unread
      description: Deletes the calling actor's read marker so the session re-derives as unread.
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: OK
        "401":
          $ref: "#/components/responses/Error"
  /v1/teams/{teamId}/agent-runtimes:
    get:
      operationId: listTeamAgentRuntimes
      summary: List all agent runtimes for a team
      description: |
        Returns every row in `agent_runtimes` for the team that the caller
        can see. Used by iOS to merge backend runtime state into the local
        session list.
      tags: [Agents]
      parameters:
        - in: path
          name: teamId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Agent runtimes for team.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, teamId, agentId, backendType, status, createdAt, updatedAt]
                      properties:
                        id: { type: string }
                        teamId: { type: string }
                        agentId: { type: string }
                        sessionId: { type: [string, "null"] }
                        workspaceId: { type: [string, "null"] }
                        backendType: { type: string }
                        status: { type: string }
                        backendSessionId: { type: [string, "null"] }
                        runtimeId: { type: [string, "null"] }
                        currentModel: { type: [string, "null"] }
                        lastSeenAt: { type: [string, "null"], format: date-time }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
        "401":
          $ref: "#/components/responses/Error"
  /v1/sessions/{sessionId}/participants:
    get:
      operationId: listSessionParticipants
      summary: List session participants
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session participants.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionParticipantList"
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: upsertSessionParticipant
      summary: Add session participant (join if absent)
      description: |
        Adds the actor to the session. If they are already a participant the
        existing row is left untouched and returned as-is — including its
        current `role`, which this endpoint does not change.

        `session_participants` carries INSERT and SELECT policies and no UPDATE
        one, so the previous upsert was refused by RLS on every repeat call.
        Re-joining also used to rewrite `role`, which silently demoted an owner
        to `member` each time they spoke through a channel. Use a dedicated
        role-change path if promotion is needed.
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actorId]
              properties:
                actorId:
                  type: string
                  format: uuid
                role:
                  type: string
      responses:
        "200":
          description: Upserted participant.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionParticipant"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/sessions/{sessionId}/roster:
    get:
      operationId: listSessionRoster
      summary: List session participant display names
      description: |
        Returns display names for actors seated in this session, read from
        `actors` directly. Unlike `GET …/participants`, this bypasses the
        `actor_directory` visibility filter so a personal agent authenticated
        as itself can resolve its own display name (e.g. for session-context
        injection).

        Caller must be a participant in the session. Only seated actor ids are
        returned — no team-wide directory leak.
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session roster labels.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRoster"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/sessions/{sessionId}/participants/{actorId}:
    delete:
      operationId: removeSessionParticipant
      summary: Remove session participant
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: actorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: OK
        "401":
          $ref: "#/components/responses/Error"
  /v1/sessions/{sessionId}/participants/{actorId}/model:
    patch:
      operationId: updateParticipantModel
      summary: Update the model this agent uses in this session
      description: |
        Which model an agent runs on for one session, addressed by (session,
        actor) — the participant row's own key (ADR-0005).

        The column has existed since the ADR-0005 migration but had no writer:
        it was backfilled once from `agent_runtimes.current_model` and then
        drifted, while both the glossary and that ADR described it as
        authoritative. This endpoint is that missing writer.

        The daemon is the only caller. It is the sole component that observes
        which model a runtime actually settled on, and it is the only one
        present for gateway and cron sessions, where no client is (ADR-0007).
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: actorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model:
                  type: string
                  description: |
                    Backend-local model id, usually `provider/model`. Not
                    nullable: every entry point pins a model at creation time,
                    so there is no state to clear it back to (ADR-0007).
                  example: anthropic/claude-sonnet-4-6
      responses:
        "204":
          description: OK
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/sessions/by-acp/{acpSessionId}:
    get:
      operationId: getSessionByAcp
      summary: Get session by ACP session ID
      tags: [Sessions]
      parameters:
        - name: acpSessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session ACP binding.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [sessionId]
                properties:
                  sessionId:
                    type: string
                    format: uuid
                  gatewaySessionId:
                    type:
                      - string
                      - "null"
        "404":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/sessions/gateway/ensure:
    post:
      operationId: ensureGatewaySession
      summary: Ensure gateway session
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamId, binding, title, primaryAgentActorId]
              properties:
                teamId:
                  type: string
                  format: uuid
                binding:
                  type: string
                title:
                  type: string
                primaryAgentActorId:
                  type: string
                  format: uuid
                ownerMemberActorIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                participantActorIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Gateway session result.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, gatewaySessionId, created]
                properties:
                  sessionId:
                    type: string
                    format: uuid
                  gatewaySessionId:
                    type: string
                  created:
                    type: boolean
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/sessions/gateway:
    get:
      operationId: listGatewaySessions
      summary: List one gateway chat's sessions
      description: >-
        The sessions belonging to a single gateway chat, newest first: the one
        the chat is bound to right now plus every earlier generation that `/new`
        detached from it. Scoped to `gatewayKey` — the chat's binding, which
        unlike `binding` itself survives a detach — so a chat only ever
        enumerates its own lineage.
      tags: [Sessions]
      parameters:
        - name: teamId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: gatewayKey
          in: query
          required: true
          description: The chat's binding, e.g. `wecom://<bot>/user/<id>`.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: The chat's sessions, newest first.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [sessionId, title, isCurrent]
                      properties:
                        sessionId:
                          type: string
                          format: uuid
                        acpSessionId:
                          type:
                            - string
                            - "null"
                        title:
                          type:
                            - string
                            - "null"
                        isCurrent:
                          type: boolean
                          description: True for the session the chat is bound to now.
                        lastMessageAt:
                          type:
                            - string
                            - "null"
                          format: date-time
                        createdAt:
                          type:
                            - string
                            - "null"
                          format: date-time
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/sessions/gateway/attach:
    post:
      operationId: attachGatewaySession
      summary: Attach a gateway chat to one of its existing sessions
      description: >-
        The inverse of gateway detach: point a chat's binding at one of that
        chat's own sessions, so the next inbound message continues there.
        Because sessions are keyed by (teamId, binding), the binding is *moved* —
        released from its current holder, then set on the target.


        Fails soft with `attached: false` when the target does not exist or
        belongs to a different chat, so one conversation cannot hijack another's
        session and the caller can report "no such session" rather than a
        switch that did not happen.
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [binding, sessionId]
              properties:
                binding:
                  type: string
                sessionId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Attach result.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [attached]
                properties:
                  sessionId:
                    type:
                      - string
                      - "null"
                    format: uuid
                  acpSessionId:
                    type:
                      - string
                      - "null"
                  attached:
                    type: boolean
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/sessions/cron:
    post:
      operationId: createCronSession
      summary: Create cron session
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamId, primaryAgentActorId, title]
              properties:
                teamId:
                  type: string
                  format: uuid
                primaryAgentActorId:
                  type: string
                  format: uuid
                title:
                  type: string
      responses:
        "200":
          description: Cron session result.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [sessionId]
                properties:
                  sessionId:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/sessions/{sessionId}/messages:
    get:
      operationId: listMessages
      summary: List messages
      description: |
        One page of a session's history, walking **backward** from the newest
        message: the default page is the tail of the conversation, and
        `nextCursor` reaches further into the past. Messages inside a page are
        ordered oldest-first, so a client can render them in order.

        This endpoint was previously unbounded — it returned the entire history
        and always reported `nextCursor: null`. A session with 6k messages
        measured 6.1s / 3.7MB, 20k took 22.9s, and 40k exceeded the database
        statement timeout and failed with a 500.
      tags: [Messages]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: limit
          in: query
          description: Messages per page, counted back from the newest.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
        - name: cursor
          in: query
          description: >-
            From a previous response's `nextCursor`. Returns the page of
            messages immediately OLDER than that page.
          schema:
            type: string
      responses:
        "200":
          description: Session messages.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"
                  nextCursor:
                    type:
                      - string
                      - "null"
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: insertMessage
      summary: Insert message
      tags: [Messages]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: Idempotency-Key
          in: header
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsertMessageRequest"
      responses:
        "200":
          description: Inserted or replayed message.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/messages/{messageId}:
    patch:
      operationId: patchMessage
      summary: Update message content or metadata
      tags: [Messages]
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                metadata:
                  type:
                    - object
                    - "null"
                  additionalProperties: true
      responses:
        "200":
          description: Updated message.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteMessage
      summary: Delete message
      tags: [Messages]
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: OK
        "401":
          $ref: "#/components/responses/Error"
  /v1/invites/claim:
    post:
      operationId: claimInvite
      summary: Claim invite
      tags: [Invites]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Claimed invite.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimInviteResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/invites/pending:
    get:
      operationId: listPendingInvites
      summary: List invites addressed to the caller's verified email/phone
      description: >-
        The contact path: invites created with `inviteEmail`/`invitePhone` matching
        the caller's own verified contact, still pending, unexpired, and for a team
        the caller has not already joined. Takes no contact parameter by design —
        it reads the authenticated user's own identity, so it cannot be used to
        probe which addresses have invites waiting. Anonymous sessions always get
        an empty list, having no verified contact to match.
      tags: [Invites]
      responses:
        "200":
          description: Pending invites.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PendingInvite"
        "401":
          $ref: "#/components/responses/Error"
  /v1/invites/{inviteId}/accept:
    post:
      operationId: acceptPendingInvite
      summary: Accept an invite addressed to the caller
      description: >-
        Joins the team, equivalent to claiming the invite's token. Only invites
        visible via `listPendingInvites` can be accepted; anything else is a 404,
        so "not yours" is indistinguishable from "not there".
      tags: [Invites]
      parameters:
        - $ref: "#/components/parameters/InviteId"
      responses:
        "200":
          description: Joined team.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimInviteResult"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        # Already a member, or the invite was declined/superseded/consumed.
        "409":
          $ref: "#/components/responses/Error"
  /v1/invites/{inviteId}/decline:
    post:
      operationId: declinePendingInvite
      summary: Decline an invite addressed to the caller
      description: >-
        Marks the invite declined. The row is retained so the inviter can see the
        outcome; the token stops working.
      tags: [Invites]
      parameters:
        - $ref: "#/components/parameters/InviteId"
      responses:
        "204":
          description: Declined.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/heartbeat:
    post:
      operationId: heartbeat
      summary: Daemon liveness ping (updates last_seen)
      responses:
        "204":
          description: OK
        "401":
          $ref: "#/components/responses/Error"
  /v1/presence/foreground:
    post:
      operationId: writeForegroundPresence
      summary: Report that a client device is in the foreground until a deadline
      description: |
        Upserts a `client_presence` row keyed by (user_id, device_id). The
        push dispatcher reads this row to suppress notifications while the
        device is in the foreground.
      tags: [System]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, foregroundUntil]
              properties:
                deviceId:
                  type: string
                  description: Stable per-installation device identifier.
                foregroundUntil:
                  type: string
                  format: date-time
                  description: ISO 8601 timestamp until which the device should be treated as foreground.
      responses:
        "204":
          description: Presence recorded.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/config/public:
    get:
      operationId: getPublicConfig
      summary: Non-sensitive configuration needed BEFORE sign-in (login methods, Web SSO target)
      description: >-
        Unauthenticated. Serves what the login screen needs before a session
        exists: which sign-in methods this deployment offers, and the Web SSO
        快捷登录 target. Never contains the MQTT broker block.


        Each key has exactly ONE authoritative endpoint. `features.auth` lives
        here and NOT in `/v1/config/bootstrap`, because the login screen renders
        before any token exists. Clients ignore an `auth` block arriving from
        bootstrap.
      tags: [Config]
      security: []
      parameters:
        - $ref: "#/components/parameters/ConfigBrand"
        - $ref: "#/components/parameters/ConfigPlatform"
        - $ref: "#/components/parameters/ConfigVersion"
      responses:
        "200":
          description: Public configuration payload.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConfig"
  /v1/config/bootstrap:
    get:
      operationId: getBootstrapConfig
      summary: Runtime configuration for authenticated clients (MQTT broker, feature flags, etc.)
      description: >-
        Post-sign-in configuration. Carries the MQTT broker and the feature
        flags that only matter once signed in.


        `features.auth` is deliberately NOT here — see `/v1/config/public`.
      tags: [Config]
      parameters:
        - $ref: "#/components/parameters/ConfigBrand"
        - $ref: "#/components/parameters/ConfigPlatform"
        - $ref: "#/components/parameters/ConfigVersion"
      responses:
        "200":
          description: Bootstrap configuration payload.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapConfig"
        "401":
          $ref: "#/components/responses/Error"
  /v1/workspaces:
