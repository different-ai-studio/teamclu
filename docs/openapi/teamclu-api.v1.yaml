  "/v1/auth/oauth/{provider}/authorize":
    get:
      operationId: oauthAuthorize
      summary: Stateless PKCE OAuth authorize redirect
      description: |
        Builds a GoTrue authorize URL for the given provider and returns a 302
        redirect. The client supplies its own PKCE `code_challenge`; FC holds no
        state. GoTrue redirects to `redirect` (app scheme URL) with a single-use
        authorization code.
      tags: [Auth]
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, example: google }
        - name: redirect
          in: query
          required: true
          schema: { type: string, example: "teamclu://auth-callback" }
        - name: code_challenge
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirect to GoTrue authorize URL
          headers:
            Location:
              schema: { type: string }
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/oauth/exchange:
    post:
      operationId: oauthExchangePkce
      summary: Exchange PKCE authorization code for session tokens
      description: |
        Forwards `{ auth_code, code_verifier }` to GoTrue's
        `POST /auth/v1/token?grant_type=pkce` and returns the session payload.
        FC holds no state — the client supplies the `codeVerifier` it generated
        before the authorize redirect.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, codeVerifier]
              properties:
                code: { type: string }
                codeVerifier: { type: string }
      responses:
        "200":
          description: GoTrue session payload
          content:
            application/json:
              schema: { type: object }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/apps:
    get:
      operationId: listApps
      summary: List the apps visible to the caller in a team
      tags: [Apps]
      parameters:
        - name: teamId
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: Visible apps, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/App" }
        "400":
          $ref: "#/components/responses/Error"
    post:
      operationId: createApp
      summary: Create an app (provisions its 1:1 workspace)
      tags: [Apps]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamId, name, type]
              properties:
                teamId: { type: string }
                name: { type: string }
                type:
                  $ref: "#/components/schemas/AppType"
                visibility: { type: string, enum: [personal, team], default: personal }
                gitRemoteUrl:
                  type: [string, "null"]
                  description: >-
                    Optional repository to import. When given, the local daemon
                    clones it into the app's checkout and writes no starter
                    template; `type` then only decides how the app deploys.
                    Must be an http(s), ssh or git:// address, or the scp-like
                    `git@host:owner/repo.git` form — anything else is rejected
                    with 400, since git reads some other forms as commands to
                    run rather than as addresses.
                  example: https://github.com/owner/repo.git
      responses:
        "201":
          description: |
            The created app. `provisionStatus` is `repo_created` once the
            the workspace exists, or `error` when provisioning failed —
            the row is created either way.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "400":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}:
    get:
      operationId: getApp
      summary: Get one app
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: The app.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateApp
      summary: Update an app (admin required)
      description: |
        Requires `admin` permission (the creator is treated as admin); anyone
        else receives 404 and nothing is written.
        Renames, changes visibility or type, or reports a lifecycle status the
        client owns. `provisionStatus` carries the repo/seed lifecycle the desktop
        drives via the local daemon; `fcStatus` carries the deploy lifecycle —
        the desktop reports `deploy_error` when the daemon build leg fails,
        since nothing server-side can observe that. Illegal transitions are
        rejected.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                visibility: { type: string, enum: [personal, team] }
                provisionStatus: { type: string, enum: [pending, repo_created, seeding, ready, error] }
                fcStatus: { $ref: "#/components/schemas/AppFcStatus" }
                deployError:
                  type: string
                  description: "Reason stored alongside `fcStatus: deploy_error`."
                authMode:
                  $ref: "#/components/schemas/AppAuthMode"
                  description: >-
                    Whether the deployed app has a login wall. Enforced by the
                    proxy gateway, so a change takes effect on the next request
                    — no redeploy needed.
                authAudience:
                  $ref: "#/components/schemas/AppAuthAudience"
                authScope:
                  $ref: "#/components/schemas/AppAuthScope"
                authRules:
                  type: array
                  maxItems: 50
                  items: { $ref: "#/components/schemas/AppAuthRule" }
                  description: >-
                    Exceptions to `authScope`. Longest matching path prefix
                    wins. Rejected with 400 when `authScope` is `paths` and no
                    rule has `auth: required` — that combination claims a login
                    wall while protecting nothing.
                type:
                  $ref: "#/components/schemas/AppType"
                  description: >-
                    What kind of app this is. The row changes at once, but the
                    running function follows only on the next deploy — until
                    then the app's `typePendingRedeploy` is true. Switching TO
                    `data_app` provisions the Postgres schema and injects
                    `DATABASE_URL` on that deploy. Switching AWAY from
                    `data_app` removes `DATABASE_URL` from the function on the
                    next deploy, so code that still uses the database breaks;
                    the schema and its data are kept, and come back if the app
                    is switched back (the schema name is derived from the slug
                    and app id, and provisioning is idempotent). The data
                    browser follows the stored type immediately, answering
                    `409 app_has_no_database` for a type without a database.
                    Only `static_web`, `slides`, `data_app` and `imported` may
                    be written; the legacy `fullstack_tanstack_postgres`, or
                    any other value, is rejected with 400 `validation_failed`.
                    Requires `admin`, like the rest of this PATCH.
      responses:
        "200":
          description: The updated app.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteApp
      summary: Delete an app (admin required)
      description: |
        Requires `admin` permission (the creator is treated as admin). Tears down
        the FC function, HTTP trigger, OSS artifact, and GoTrue OAuth client;
        revokes Gitea deploy keys and archives the repo under a `deleted-` prefix.
        Postgres schema, local workdirs, and linked sessions (app_id nulled) are
        kept. The orphaned workspace row is archived with the archived repo URL.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: App deleted.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, enum: [true] }
        "404":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/deploy:
    post:
      operationId: deployApp
      summary: Start a deploy — mint the artifact upload handle (admin required)
      description: |
        Requires `provisionStatus: ready` and `admin` permission on the app
        (the creator is treated as admin). Members with `prompt` or `view`
        receive 404. Moves `fcStatus` to `awaiting_build` and returns a
        short-lived presigned OSS PUT URL. The caller then kicks its local
        daemon to build the app and upload the artifact there, and calls
        `/deploy/finalize` once the upload succeeds.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                gitCommitSha:
                  type: string
                  pattern: "^[0-9a-f]{7,40}$"
                  description: >-
                    Git commit SHA (7–40 hex) being deployed. Required for an
                    app whose `gitAuthKind` is `gitea_deploy_key`; omitted for
                    one imported from an external remote, whose deploy builds
                    the local checkout as it sits and has no forge commit to
                    pin itself to.
      responses:
        "202":
          description: Deploy started.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/App"
                  - type: object
                    required: [ossObjectName, presignedPut, deployToken]
                    properties:
                      ossObjectName: { type: string }
                      presignedPut:
                        type: string
                        description: Short-lived presigned PUT URL for the build artifact. Secret — never log it.
                      deployToken:
                        type: string
                        format: uuid
                        description: Short-lived bearer required by `/deploy/finalize`. Secret — never log it.
                      gitCommitSha:
                        type: [string, "null"]
                        description: >-
                          Echo of the requested commit SHA for this deploy
                          attempt; null when none was supplied.
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/deploy/finalize:
    post:
      operationId: finalizeAppDeploy
      summary: Finish a deploy — provision the schema, publish the code, return the live URL
      description: |
        Requires `admin` permission on the app (the creator is treated as
        admin); members with `prompt` or `view` receive 404. Provisions
        (idempotently) the app's Postgres schema and scoped role, points the
        FC function at the uploaded artifact with a matching `DATABASE_URL`,
        ensures the HTTP trigger, and stores `fcEndpoint` with `fcStatus: live`.
        Failures land on `deploy_error` with the reason in `provisionError`;
        retry by calling `/deploy` again.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deployToken, declaration]
              properties:
                gitCommitSha:
                  type: string
                  pattern: "^[0-9a-f]{7,40}$"
                  description: >-
                    Git commit SHA of the uploaded artifact. Omitted for an app
                    with no forge repo — see the same field on `/deploy`.
                deployToken:
                  type: string
                  format: uuid
                  description: Bearer returned by `/deploy` for this attempt. Secret — never log it.
                declaration:
                  type: object
                  description: >-
                    The daemon-validated build and start declaration read from
                    the app's required `teamclu.app.json`. The control plane
                    persists `build.kind` and `start`, then configures Function
                    Compute without deriving either from the checkout.
                  required: [build, start]
                  properties:
                    build:
                      $ref: "#/components/schemas/AppBuildSpec"
                    start:
                      $ref: "#/components/schemas/AppStartSpec"
      responses:
        "200":
          description: The app, now live.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/sessions:
    get:
      operationId: listAppSessions
      summary: List the sessions linked to an app
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Sessions linked to the app (empty when it is not visible to the caller).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, teamId, title, mode, createdAt, updatedAt]
                      properties:
                        id: { type: string }
                        teamId: { type: string }
                        title: { type: string }
                        mode: { type: string }
                        lastMessageAt: { type: [string, "null"], format: date-time }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
        "400":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/git-credential:
    get:
      operationId: getAppGitCredential
      summary: Mint a short-lived Gitea deploy key for the app repo
      description: |
        Generates an ed25519 deploy key, registers the public half on the app's
        Gitea repo (`tc-app-{appId}`), and returns the private key for one-time
        use by the local daemon. The private key is never persisted, and is in
        OpenSSH format (`BEGIN OPENSSH PRIVATE KEY`) — OpenSSH cannot load an
        ed25519 key from a PKCS#8 block. Secret — never log the response body.

        Two kinds of caller are authorised:

        - A **member** needs `prompt` or `admin` permission on the app (the
          creator is treated as admin); `view` receives 404.
        - An **agent actor** in the app's team is authorised for any
          Gitea-managed app in that team. This is how a daemon credentials the
          `git push` an agent runs in an app checkout: a daemon holds its own
          cloud account, so it never resolves to a member, and
          `app_member_access` is keyed on members and cannot carry a per-app
          grant for it. The key's title names the agent actor.

        Each call also revokes the keys it minted more than 15 minutes ago. That
        sweep is a backstop, not the primary bound: it only runs when something
        asks the same repo for another key, so a repo nobody returns to keeps
        whatever it was left holding. Holders that can say "done with it" should
        instead `DELETE` the key (see below) — `amuxd git-ssh` does this as soon
        as ssh exits.

        The response carries `deployKeyId` for exactly that purpose.

        404 when the app is not Gitea-managed (`gitAuthKind` is null): there is
        no repo of ours to register a key on.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: JIT deploy-key credential for git push/pull.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppGitCredential" }
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/git-credential/{deployKeyId}:
    delete:
      operationId: revokeAppGitCredential
      summary: Return a deploy key once its holder is done with it
      description: |
        Revokes one JIT deploy key. Authorised exactly like minting, and the key
        must carry the caller's own actor in its title — otherwise revoking
        would be a way to kill a push another machine is in the middle of.

        Idempotent: a key that is already gone, or is not the caller's, answers
        200 with `revoked: false`. "Not usable any more" is what the caller
        asked for either way, and the push it follows has already happened.

        The call also sweeps that repo's expired keys while it holds the
        listing, which is the only tidying a quiet repo ever gets.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
        - name: deployKeyId
          in: path
          required: true
          schema: { type: integer }
          description: Gitea's id for the key, as returned by `getAppGitCredential`.
      responses:
        "200":
          description: Whether this call was the one that removed the key.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: boolean }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/git-head:
    get:
      operationId: getAppGitHead
      summary: Default-branch HEAD commit on the app's Gitea repo
      description: |
        Reads the default branch SHA via the server-side Gitea bot token.
        Visible to the same callers as `getApp`. 404 when the app is not
        Gitea-managed (`gitAuthKind` is null) — such an app's repo belongs to
        someone else and this deployment holds no credential for it.

        `compare=1` additionally reports how many commits the branch is ahead of
        what is deployed. It is opt-in because it costs an extra request to the
        forge, and the deploy path calls this endpoint on every deploy while
        reading only `sha`.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
        - name: compare
          in: query
          required: false
          description: >-
            Set to `1` to populate `undeployedCommits`. Anything else omits the
            comparison and leaves it null.
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: Default branch HEAD.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppGitHead" }
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/logs:
    get:
      operationId: readAppLogs
      summary: Read the deployed app's own logs
      description: |
        What the running function printed, and one entry per HTTP request with
        its status code and duration. Requires `prompt` or `admin` on the app;
        `view` and non-members receive 404, exactly as the data browser does —
        a log line carries whatever the app decided to print, which is its
        users' data.

        Function Compute keeps no logs at all for a function deployed before
        log delivery was configured; those apps answer with an empty `items`
        until their next deploy, which is what points them at the logstore.

        `contains` and `requestId` filter the entries read from the window, not
        all of history: an app's own output carries no request id (the id
        appears only in Function Compute's framing lines, which this endpoint
        reads to attach it), and a substring search is done here rather than as
        a log-service query, whose tokenizer silently drops terms containing
        punctuation. A window whose scan budget was reached comes back with
        `truncated: true`.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
        - name: sinceMinutes
          in: query
          required: false
          description: How far back to read. Clamped to the 14-day retention period.
          schema: { type: integer, minimum: 1, maximum: 10080, default: 30 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: kind
          in: query
          required: false
          description: >-
            `app` is what the application printed; `request` is Function
            Compute's per-request row (status, duration, cold start); `all` is
            both, interleaved.
          schema: { type: string, enum: [app, request, all], default: app }
        - name: contains
          in: query
          required: false
          description: Case-insensitive substring the entry's message must contain.
          schema: { type: string }
        - name: requestId
          in: query
          required: false
          description: Only entries belonging to this request — the way to read one failing request end to end.
          schema: { type: string }
      responses:
        "200":
          description: Log entries, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppLogsPage" }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/membership:
    get:
      operationId: getAppMembership
      summary: Whether the caller is a member of the app's team
      description: |
        Used by deployed apps with `authMode: platform` to gate login: the app
        holds the end-user's bearer token (not a service role) and asks whether
        that user belongs to the team that owns this app. Returns `{ member:
        boolean }` only — no team metadata. Route handler is implemented in
        Task 8; this documents the contract.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Membership verdict for the authenticated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppMembership" }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/custom-domain:
    put:
      operationId: setAppCustomDomain
      summary: Bind a domain the app owner controls
      description: |
        Stores `domain` against the app and issues a fresh verification token,
        clearing any previous verification. The response carries the DNS
        records to add; the domain is NOT served until `verify` succeeds.

        Refused for a hostname belonging to this deployment (the API, the apps
        domain, the login domain and so on), for an IP literal, and for a
        domain already bound to another app.

        SELF-HOST DEPLOYMENTS ONLY. The entry point that makes this work is a
        catch-all site on our own reverse proxy, which accepts a connection for
        any hostname. A deployment on Alibaba Function Compute has no
        equivalent — there a hostname reaches a function only if a custom
        domain was created for it — so a domain bound on such a deployment will
        verify but never serve traffic. Clients aimed at that target should not
        offer this.

        Only the app creator or a member with `admin` on the app may call this;
        others receive 404, like every other app mutation.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
                  description: >-
                    Hostname only, no scheme and no path — `app.example.com`.
                    An internationalised name is stored in its ASCII (punycode)
                    form, which is what DNS and the certificate will carry.
      responses:
        "200":
          description: The stored domain and the DNS records that prove it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppCustomDomain" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAppCustomDomain
      summary: Unbind the app's custom domain
      description: |
        Clears the domain, its token and its verification. The app stays
        reachable on its vanity hostname. Any certificate already issued is
        left to expire on its own — nothing serves the name once the gate
        stops recognising it.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: The app, with the domain cleared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppCustomDomain" }
        "404":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/custom-domain/verify:
    post:
      operationId: verifyAppCustomDomain
      summary: Check the DNS proof for the app's custom domain
      description: |
        Resolves `TXT _teamclu.<domain>` and looks for
        `teamclu-verify=<token>`. On success the domain becomes servable: the
        certificate gate starts answering for it and the proxy routes it to
        this app.

        TXT rather than only the CNAME, because a CNAME cannot exist on an apex
        domain and because the owner can add the TXT before cutting traffic
        over.

        409 `dns_verification_failed` when the record is absent or carries a
        different token — DNS propagation is the usual reason, so this is
        safe to retry.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Ownership proven; the domain is now served.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppCustomDomain" }
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/env:
    get:
      operationId: listAppEnv
      summary: The app's environment variables
      description: |
        The operator's own variables, injected into the deployed function at
        `finalizeDeploy`. Readable by anyone with `prompt` or `admin` on the app
        — the people who write its code need to know what its environment holds.

        A secret's `value` is always `null`, for everyone, including whoever set
        it. Changing a secret means writing a new value.

        `canWrite` says whether this caller may change any of it (`admin`), so
        the client does not need a second request to find out.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: The app's environment, by key.
          content:
            application/json:
              schema:
                type: object
                required: [items, canWrite]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppEnvVar"
                  canWrite: { type: boolean }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/env/{key}:
    put:
      operationId: putAppEnv
      summary: Set or replace one environment variable
      description: |
        Requires `admin`. Creates the key or replaces its value, including
        flipping it between plain and secret.

        Names the platform sets itself are refused with `env_key_reserved`:
        `PORT`, `NODE_ENV`, `DATABASE_URL`, `APP_PUBLIC_URL`, `API_BASE`,
        `SUPABASE_URL`, `SUPABASE_ANON_KEY`, and anything starting `TEAMCLU_`.
        The deploy also applies user variables UNDERNEATH the platform's, so
        such a key could not take effect even if it reached the table.

        The change is NOT live until the app is deployed again — the environment
        is baked into the function. The app row's `envPendingRedeploy` says so.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AppEnvKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
                  maxLength: 8192
                  description: >-
                    May be empty — a variable set to the empty string is a
                    legitimate thing to want. May not contain newlines or NUL.
                isSecret:
                  type: boolean
                  default: false
                  description: >-
                    A secret is sealed with AES-256-GCM and never returned
                    again. Storing a plain value readable is the point of the
                    distinction, so this is the operator's call per key.
      responses:
        "200":
          description: The stored variable (a secret's value comes back null).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppEnvVar"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAppEnv
      summary: Remove one environment variable
      description: |
        Requires `admin`. Like a write, this only reaches the running app on the
        next deploy.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AppEnvKey"
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/cron-jobs:
    get:
      operationId: listAppCronJobs
      summary: List an app's scheduled tasks
      description: |
        Cloud-side schedules: at the given minute, the platform sends one HTTP
        request to the app's own public URL. Distinct from the desktop's cron,
        which runs agent turns against a workspace and needs the machine awake.

        Readable by anyone with any permission on the app; 404 otherwise, like
        every other app route.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: The app's scheduled tasks, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppCronJob"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: createAppCronJob
      summary: Create a scheduled task
      description: |
        Requires `admin` on the app. At most 20 tasks per app.

        The request the task sends carries NO session, so a `path` behind the
        login wall is answered with a redirect to the login service and the run
        is recorded as failed. Make that path public and authenticate it with a
        header of your own (`headers`).
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppCronJobInput"
      responses:
        "201":
          description: The created task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppCronJob"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/cron-jobs/{jobId}:
    patch:
      operationId: updateAppCronJob
      summary: Update a scheduled task
      description: |
        Requires `admin`. Fields not present are left as they were. Changing the
        schedule, the timezone, or `enabled` recomputes `nextRunAt` — a task
        that was disabled for a month does not fire once per missed occurrence
        when it comes back.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AppCronJobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppCronJobInput"
      responses:
        "200":
          description: The updated task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppCronJob"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAppCronJob
      summary: Delete a scheduled task
      description: Requires `admin`. The task's run history goes with it.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AppCronJobId"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/cron-jobs/{jobId}/run:
    post:
      operationId: runAppCronJobNow
      summary: Run a scheduled task immediately
      description: |
        Requires `admin`. Sends the task's request right now and answers with
        the outcome. The schedule is NOT advanced: this is a test, and moving
        `nextRunAt` because someone pressed a button would put the next real run
        at a time nobody chose.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AppCronJobId"
      responses:
        "200":
          description: >-
            What happened. A non-2xx from the app is still a 200 here, with
            `status` set to `failed`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppCronRunOutcome"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/cron-jobs/{jobId}/runs:
    get:
      operationId: listAppCronRuns
      summary: A scheduled task's execution history
      description: |
        Newest first. Only the most recent 20 runs per task are kept; older rows
        are trimmed when a new one is written.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AppCronJobId"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Execution history.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppCronRun"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/internal/app-cron/tick:
    post:
      operationId: appCronTick
      summary: Fire every scheduled task that is due (internal)
      description: |
        The heartbeat, called once a minute by the deployment's own scheduler —
        the `app-cron` compose sidecar on self-host, an external minute cron on
        Function Compute. NOT a user endpoint.

        Authenticated by `Authorization: Bearer <APP_CRON_SECRET>`, compared in
        constant time. An unset secret is refused, so a deployment that has not
        configured one has no scheduler rather than an open trigger.
      tags: [Apps]
      security: []
      responses:
        "200":
          description: What this tick did.
          content:
            application/json:
              schema:
                type: object
                required: [due, ran, outcomes]
                properties:
                  due:
                    type: integer
                    description: Tasks found due.
                  ran:
                    type: integer
                    description: >-
                      Tasks this process claimed and ran. Lower than `due` when
                      another tick claimed one first, which is not an error.
                  outcomes:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppCronRunOutcome"
        "401":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/access:
    get:
      operationId: listAppAccess
      summary: List per-member access grants for an app
      description: |
        Returns all rows in `app_member_access` for the app. Only the app
        creator or a member with `admin` permission may call this; others
        receive 404 (same as other app mutations — do not leak existence).
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Access grants for team members on this app.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppMemberAccessRow"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/access/{memberId}:
    put:
      operationId: setAppAccess
      summary: Grant or update a member's app permission
      description: |
        Upserts `app_member_access` for `(appId, memberId)`. `permissionLevel`
        must be `view`, `prompt`, or `admin`. Only the app creator or a member
        with existing `admin` on this app may call; others receive 404.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AppAccessMemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissionLevel]
              properties:
                permissionLevel:
                  $ref: "#/components/schemas/AppPermissionLevel"
      responses:
        "200":
          description: The upserted access row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppMemberAccessRow"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeAppAccess
      summary: Revoke a member's app permission
      description: |
        Deletes the `app_member_access` row for `(appId, memberId)`. Only the
        app creator or a member with `admin` on this app may call; others
        receive 404.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AppAccessMemberId"
      responses:
        "200":
          description: Row removed (or was already absent).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/data/tables:
    get:
      operationId: listAppDataTables
      summary: List the tables in this app's own database
      description: |
        Introspects the app's Postgres schema and returns every base table with
        its columns and primary key. Requires `prompt` or `admin` on the app;
        `view` (and non-members) receive 404 so the tier does not learn the
        feature exists.

        An empty `items` is the normal state right after the first deploy: the
        provisioner creates the schema, the application creates its tables the
        first time it is requested. It is not an error.

        Only `data_app`-shaped apps have a database at all, and only after a
        successful deploy. Both exclusions answer 409 with distinguishable
        codes (`app_has_no_database`, `app_not_deployed`) rather than 404,
        because the control panel shows a different explanation for each.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Tables in the app's schema.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppDataTable"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/data/tables/{table}/rows:
    get:
      operationId: readAppDataRows
      summary: Read a page of rows from one table
      description: |
        Keyset pagination over the table's primary key — never `OFFSET`, which
        on a production table means reading every row that was skipped. Pass the
        previous page's `nextCursor` as `after`; a null `nextCursor` means this
        was the last page.

        There is deliberately no total row count: `count(*)` is a full scan on a
        large table and would hit the 5s statement timeout before answering.

        `limit` is capped server-side at 100 regardless of what is requested.
        Tables with no primary key fall back to offset paging and are read-only.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AppDataTable"
        - name: after
          in: query
          required: false
          description: Opaque cursor from the previous page's `nextCursor`.
          schema: { type: string }
        - name: direction
          in: query
          required: false
          description: Order along the primary key. Sorting by an arbitrary column is not offered — it would make the cursor unsound.
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: filterColumn
          in: query
          required: false
          description: Column to filter on. Must exist in the table; validated against the catalog, never interpolated.
          schema: { type: string }
        - name: filterOp
          in: query
          required: false
          schema: { type: string, enum: [eq, contains, isNull, notNull] }
        - name: filterValue
          in: query
          required: false
          description: Bound as a parameter. Ignored by `isNull` / `notNull`.
          schema: { type: string }
      responses:
        "200":
          description: One page of rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppDataRowsPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/data/tables/{table}/rows/{rowKey}:
    patch:
      operationId: updateAppDataRow
      summary: Update one row
      description: |
        Requires `admin` on the app; `prompt` receives 403. Updates exactly one
        row, addressed only by its primary key — never by any other column the
        caller can see. A statement that matches anything other than one row
        aborts the transaction.

        The response carries the row **re-read after the write**, so triggers
        and column defaults that rewrote the submitted value are visible.
        Primary-key columns cannot be edited here: the read-back is by key, so
        changing it would report the row as having vanished.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AppDataTable"
        - $ref: "#/components/parameters/AppDataRowKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patch]
              properties:
                patch:
                  type: object
                  additionalProperties: true
                  description: Column name → new value. Every name is checked against the table's catalog entry.
      responses:
        "200":
          description: The row as the database stored it.
          content:
            application/json:
              schema:
                type: object
                required: [row]
                properties:
                  row:
                    type: object
                    additionalProperties: true
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAppDataRow
      summary: Delete one row
      description: |
        Requires `admin`. Deletes exactly one row by primary key; a statement
        matching zero or several rows aborts the transaction. There is no bulk
        delete — this is production data and a table UI makes multi-select
        mistakes too easy.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AppDataTable"
        - $ref: "#/components/parameters/AppDataRowKey"
      responses:
        "200":
          description: Row deleted.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/apps/{appId}/storage/usage:
    get:
      operationId: getAppStorageUsage
      summary: How much of its quota this app's files use
      description: |
        Requires `view`. `bytes` is EVENTUALLY CONSISTENT and `countedAt` says
        how stale it is: an app holding STS credentials writes straight to OSS
        without passing through this API, so the number comes from a periodic
        sweep rather than a running total. `bytes: null` means never measured,
        which is not the same as zero.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Usage and the quota in force.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppStorageUsage"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/storage/usage/refresh:
    post:
      operationId: refreshAppStorageUsage
      summary: Re-measure this app's files now
      description: |
        Requires `view`. Lists the app's prefix and writes the result back, so
        the panel can show a fresh number instead of waiting for the sweep.
        `truncated: true` means the listing hit its page cap and the count is a
        floor, not a total.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Freshly measured usage.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AppStorageUsage"
                  - type: object
                    properties:
                      objects:
                        type: integer
                      truncated:
                        type: boolean
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/storage/objects:
    get:
      operationId: listAppFiles
      summary: List this app's files
      description: |
        Requires `view`. `prefix` filters within the app's own space and can
        never address another app's; `after` is the opaque cursor from a
        previous page. `canWrite` tells the panel whether to render upload and
        delete, so a `view` member is not shown controls that would 404.

        With `delimiter=/` the store collapses everything below the next
        separator into `folders`, and `items` holds only the objects sitting
        directly at `prefix` — one level, the way a file browser reads. Without
        it the listing is fully RECURSIVE, which is what a count or a sweep
        wants and what a browser must not do: an app writing
        `uploads/<user>/<file>` has thousands of keys and about six things a
        person wants to look at.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
        - name: prefix
          in: query
          description: >-
            Folder to list, relative to the app root. Leading slashes and `..`
            segments are stripped; an object store has no parent directory.
          schema:
            type: string
        - name: delimiter
          in: query
          description: >-
            `/` to browse one level. Omit for a fully recursive listing.
          schema:
            type: string
            enum: ["/"]
        - name: after
          in: query
          schema:
            type: string
        - name: limit
          in: query
          description: >-
            1-100. Above the ceiling the request is REFUSED, not clamped — a
            silent clamp would have the caller page forever believing it asked
            for more.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: One page of files.
          content:
            application/json:
              schema:
                type: object
                required: [items, folders, canWrite]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppFile"
                  folders:
                    type: array
                    description: >-
                      Sub-folders at this level, each ending in `/` and relative
                      to the app root. Empty unless `delimiter` was given — an
                      object store has no directories, these are the common
                      prefixes below the next separator.
                    items:
                      type: string
                  nextCursor:
                    type: [string, "null"]
                  canWrite:
                    type: boolean
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/storage/folder:
    delete:
      operationId: deleteAppFolder
      summary: Delete every file under one folder
      description: |
        Requires `prompt`, the same tier as deleting a single file — a folder is
        not a different kind of object in a store like this, it is a prefix, and
        whoever may delete each of its files one at a time may delete them
        together.

        An EMPTY prefix is refused with 400: that would be the whole app, and
        emptying an app's storage is the separate admin-only purge.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
        - name: prefix
          in: query
          required: true
          description: Folder to empty, relative to the app root.
          schema:
            type: string
      responses:
        "200":
          description: How many objects were removed.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: integer }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/storage/objects/{fileKey}/url:
    get:
      operationId: createAppFileDownloadUrl
      summary: Signed URL for one file
      description: |
        Requires `view`. The URL forces `Content-Disposition: attachment`, so an
        HTML file one member uploads cannot execute on the storage origin when
        another opens it.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AppFileKey"
      responses:
        "200":
          description: A short-lived download URL.
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresIn]
                properties:
                  url:
                    type: string
                  size:
                    type: integer
                  contentType:
                    type: [string, "null"]
                  expiresIn:
                    type: integer
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/storage/sign-upload:
    post:
      operationId: createAppFileUploadUrl
      summary: Signed URL to upload one file
      description: |
        Requires `prompt`. The bytes go from the browser straight to OSS; this
        API only signs. 409 `app_storage_quota_exceeded` when the app is already
        over quota - the check happens here, where we are still in the path, and
        not per write.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: |
                    Relative to the app's own root. A leading slash, an empty
                    segment, a `..` segment or a control character is rejected:
                    those are how a key escapes the app's prefix.
                contentType:
                  type: [string, "null"]
      responses:
        "200":
          description: A short-lived upload URL.
          content:
            application/json:
              schema:
                type: object
                required: [url, path, expiresIn]
                properties:
                  url:
                    type: string
                  path:
                    type: string
                  expiresIn:
                    type: integer
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/storage/objects/{fileKey}:
    delete:
      operationId: deleteAppFile
      summary: Delete one file
      description: Requires `prompt`.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AppFileKey"
      responses:
        "200":
          description: File deleted.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/storage/purge:
    post:
      operationId: purgeAppFiles
      summary: Delete every file this app has stored
      description: |
        Requires `admin`, and it is irreversible. Deleting the app itself KEEPS
        its files, precisely because there is no backup; this is the deliberate
        version of that action and therefore sits behind the highest tier.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Number of objects removed.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: integer
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/storage/quota:
    put:
      operationId: setAppStorageQuota
      summary: Set this app's storage ceiling
      description: |
        Requires `admin`. `null` clears the per-app value and falls back to the
        deployment default, so raising that default does not need a backfill.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quotaBytes]
              properties:
                quotaBytes:
                  type: [integer, "null"]
      responses:
        "200":
          description: The quota now in force.
          content:
            application/json:
              schema:
                type: object
                properties:
                  quotaBytes:
                    type: [integer, "null"]
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/storage/sts:
    post:
      operationId: mintAppStorageCredentials
      summary: Temporary OSS credentials for the app itself
      description: |
        THE ONLY ROUTE IN THIS API WHOSE CALLER IS NOT A PERSON. The deployed
        app presents the per-app token that finalize sealed and injected into
        its function env (`TEAMCLU_STORAGE_TOKEN`), and receives STS credentials
        whose session policy confines them to `app-files/<appId>/`.

        A wrong token and an unknown app are the same 401 on purpose. 409
        `app_storage_quota_exceeded` rather than 403 when the app is over quota:
        it is who it says it is, it just has no room, and a 403 would send
        whoever debugs it hunting for a policy bug.

        Refresh on `expiration`, never on a 403.
      tags: [Apps]
      security:
        - appStorageToken: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Credentials scoped to this app's prefix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppStorageCredentials"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    appStorageToken:
      type: http
      scheme: bearer
      description: |
        The per-app storage token, NOT a user access token. Deliberately a
        separate scheme: this is the one credential in the API that identifies
        a deployed app rather than a person, and collapsing it into bearerAuth
        would hide that from anyone reading the contract.
  headers:
    RequestId:
      schema:
        type: string
  parameters:
    AppFileKey:
      name: fileKey
      in: path
      required: true
      description: |
        The file's path, base64url-encoded. Encoded because a path contains
        slashes and a slash cannot survive one path segment - the same trick
        `rowKey` plays for composite primary keys.
      schema:
        type: string
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
    TeamSkillSlug:
      name: slug
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/TeamSkillSlug"
    TeamMcpServerName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$"
    TeamEnvKeyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9_]{1,64}$"
    InviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    AppId:
      name: appId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AppAccessMemberId:
      name: memberId
      in: path
      required: true
      description: Team member actor id receiving the grant.
      schema:
        type: string
        format: uuid
    AppEnvKey:
      name: key
      in: path
      required: true
      description: Environment variable name (letters, digits, underscores).
      schema:
        type: string
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        maxLength: 128
    AppCronJobId:
      name: jobId
      in: path
      required: true
      description: Scheduled task id.
      schema:
        type: string
        format: uuid
    AppDataTable:
      name: table
      in: path
      required: true
      description: >-
        Table name. Resolved against the app schema's `information_schema`
        before any statement is built; a name that is not there is a 404, and
        the catalog's own string — not this one — is what reaches the SQL.
      schema:
        type: string
    AppDataRowKey:
      name: rowKey
      in: path
      required: true
      description: >-
        Opaque base64url form of the row's primary-key values, in the order
        `primaryKey` lists them. Opaque rather than the raw value so a composite
        key, and a value containing a slash, survive a path segment.
      schema:
        type: string
    ConfigBrand:
      name: brand
      in: query
      required: false
      description: >-
        Calling build's brand short name. Accepted so one Cloud API can answer
        per-brand; the current implementation logs it and returns the
        deployment-wide config regardless.
      schema:
        type: string
    ConfigPlatform:
      name: platform
      in: query
      required: false
      description: desktop | web | ios | expo | extension | daemon.
      schema:
        type: string
    ConfigVersion:
      name: version
      in: query
      required: false
      description: Calling build's version, for future version-gated rollouts.
      schema:
        type: string
  responses:
    NotFound:
      description: Resource not found.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error:
      description: Error response.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    InboxItemKind:
      type: string
      description: >-
        Why an item is in the inbox. The vocabulary is deliberately closed
        and every member satisfies one test — nothing happens next until
        this person acts.


        `permission_request` an agent is stopped, waiting for a decision.
        `task_failed` a turn ended with no answer at all.
        `mention` the person was named in a session.
        `task_completed` a delegated task finished and wants acceptance.
        `idea_review` an idea was claimed or submitted and needs review.
      enum:
        - permission_request
        - task_failed
        - mention
        - task_completed
        - idea_review
    InboxItemSource:
      type: object
      description: Where the item came from, so a client can navigate to it.
      required: [sessionId]
      properties:
        sessionId:
          type:
            - string
            - "null"
          format: uuid
        messageId:
          type:
            - string
            - "null"
          format: uuid
        ideaId:
          type:
            - string
            - "null"
          format: uuid
        actorId:
          type:
            - string
            - "null"
          format: uuid
          description: The agent or person whose action produced the item.
        turnId:
          type:
            - string
            - "null"
    InboxItem:
      type: object
      required:
        [id, teamId, kind, priority, title, source, createdAt, readAt, resolvedAt]
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/InboxItemKind"
        priority:
          type: integer
          minimum: 0
          maximum: 2
          description: >-
            0 is blocked on a decision, 1 is waiting for acceptance, 2 is
            informational. Computed server-side so every client ranks the
            same way.
        title:
          type: string
          description: >-
            One line, already localized by the producer. Clients render it
            verbatim and never re-summarize.
        body:
          type:
            - string
            - "null"
          description: Optional second line. Clients truncate rather than wrap far.
        source:
          $ref: "#/components/schemas/InboxItemSource"
        createdAt:
          type: string
          format: date-time
        readAt:
          type:
            - string
            - "null"
          format: date-time
        resolvedAt:
          type:
            - string
            - "null"
          format: date-time
    InboxIngestRequest:
      type: object
      required: [kind, sessionId, targetActorId, title, dedupKey]
      properties:
        kind:
          type: string
          description: >-
            Only the kinds no server-side signal can reconstruct. A turn
            that failed is already visible in `messages.metadata.turn_status`
            and is derived there, not reported here.
          enum:
            - permission_request
            - task_completed
        sessionId:
          type: string
          format: uuid
        targetActorId:
          type: string
          format: uuid
          description: >-
            Who the item is for. The server resolves this to the owning user
            and refuses an actor that is not a participant of `sessionId`.
        title:
          type: string
          maxLength: 200
        body:
          type:
            - string
            - "null"
          maxLength: 2000
        turnId:
          type:
            - string
            - "null"
        dedupKey:
          type: string
          maxLength: 200
          description: >-
            Producer-supplied idempotency key, stable across retries of the
            same logical event. A permission request keys on its request id,
            not on a timestamp.
    TeamSkillSlug:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{1,63}$"
      description: >-
        Skill identifier inside a team registry. Mirrors
        `TEAM_SKILL_SLUG_RE` in the FC repository layer — lowercase
        alphanumerics and hyphens, never leading with a hyphen, 2 to 64
        characters.
    TeamSkillCategory:
      type: string
      description: >
        Fixed set rather than free text. The point is that two skills in the
        same category can be compared side by side; an open vocabulary defeats
        that within a week.
      enum: [general, coding, devops, data, research, writing, communication, integration]
    MarketplaceSkill:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        displayName: { type: string }
        publisher: { type: string }
        summary: { type: string, maxLength: 200 }
        category: { $ref: "#/components/schemas/TeamSkillCategory" }
        whenToUse: { type: string }
        whenNotToUse: { type: string }
        requires: { type: [object, "null"] }
        tags:
          type: array
          items: { type: string }
        status: { type: string, enum: [draft, published, delisted] }
        latestVersion: { type: integer }
        adoptedByTeam:
          type: [object, "null"]
          properties:
            slug: { type: string }
            latestVersion: { type: integer }
            upstreamSubscribed: { type: boolean }
        adoptCount: { type: integer }
        createdAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }
    MarketplaceSkillDetail:
      allOf:
        - $ref: "#/components/schemas/MarketplaceSkill"
        - type: object
          properties:
            versions:
              type: array
              items:
                type: object
                properties:
                  version: { type: integer }
                  contentHash: { type: string }
                  size: { type: integer }
                  changelog: { type: string }
                  publishedAt: { type: [string, "null"], format: date-time }
    TeamSkill:
      type: object
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        slug: { type: string }
        ownerActorId:
          type: string
          format: uuid
          description: Who is accountable for this skill. Transferable.
        summary: { type: string, maxLength: 200 }
        category: { $ref: "#/components/schemas/TeamSkillCategory" }
        whenToUse: { type: string }
        whenNotToUse:
          type: string
          description: >
            Optional; empty is a real answer (stored as ""). Shown next to
            whenToUse rather than folded away — two overlapping skills can
            only be told apart by their boundaries.
        requires:
          type: [array, "null"]
          items: { type: string }
          description: Optional dependency declaration (platform, MCP server, credentials).
        status: { type: string, enum: [draft, published, deprecated] }
        supersededBy: { type: [string, "null"] }
        latestVersion: { type: integer }
        createdBy: { type: string, format: uuid }
        createdAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }
        origin: { type: string, enum: [local, marketplace], default: local }
        upstreamSlug: { type: [string, "null"] }
        upstreamSubscribed: { type: boolean, default: false }
        upstreamDetachedAt: { type: [string, "null"], format: date-time }
        installed: { type: boolean }
        installedVersion: { type: [integer, "null"] }
        installScope: { type: [string, "null"], enum: [global, workspace, null] }
        hasUpdate: { type: boolean }
    TeamSkillVersion:
      type: object
      description: >
        Metadata is snapshotted here on purpose. team_skills carries "current";
        a version row carries the fact at that version, so editing a
        description does not rewrite the notes of every historical version.
      properties:
        version: { type: integer }
        contentHash: { type: string }
        size: { type: integer }
        changelog: { type: string }
        summary: { type: string }
        category: { type: [string, "null"] }
        whenToUse: { type: string }
        whenNotToUse: { type: string }
        requires:
          type: [array, "null"]
          items: { type: string }
        createdBy: { type: string, format: uuid }
        publishedFromVersion:
          type: [integer, "null"]
          minimum: 1
          readOnly: true
          description: >
            Installed/baseline version the publisher's working copy was built from.
            Set by the server from the CAS baseline (`expectedLatestVersion`); not
            accepted on publish requests.
        createdAt: { type: [string, "null"], format: date-time }
    TeamSkillInstall:
      type: object
      description: >
        actorId generalises over both install subjects — a member installing
        for themselves, and a `visibility=team` agent an admin installs for.
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        skillId: { type: string, format: uuid }
        installedVersion: { type: integer }
        scope: { type: string, enum: [global, workspace] }
        workspaceId: { type: [string, "null"], format: uuid }
        installedAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }
        slug: { type: string }
        latestVersion: { type: integer }
        status: { type: string }
        hasUpdate: { type: boolean }
    TeamSkillPublish:
      type: object
      required: [slug, summary, category, changelog, contentHash]
      properties:
        slug: { $ref: "#/components/schemas/TeamSkillSlug" }
        summary: { type: string, maxLength: 200 }
        category: { $ref: "#/components/schemas/TeamSkillCategory" }
        whenToUse: { type: string }
        whenNotToUse: { type: string }
        requires:
          type: [array, "null"]
          items: { type: string }
        changelog: { type: string }
        contentHash: { type: string }
        size: { type: integer }
        ownerActorId: { type: string, format: uuid }
        status: { type: string, enum: [draft, published, deprecated] }
    KnowledgeAclRule:
      type: object
      description: >
        A restricted knowledge prefix and the actors allowed to see it.
        Whitelist semantics: anyone not in `actorIds` is denied.
      properties:
        id: { type: string, format: uuid }
        pathPrefix:
          type: string
          description: >
            Always starts with `knowledge/` and ends with `/`. The trailing
            slash is what makes matching happen on a path boundary, so
            `knowledge/hr/` never covers `knowledge/hr-public/`.
          example: "knowledge/hr/"
        actorIds:
          type: array
          description: Actors granted access. Members only in practice — agents inherit their device owner.
          items: { type: string, format: uuid }
        createdBy: { type: string, format: uuid }
        createdAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }
        affectedFiles:
          type: integer
          description: Present on create — live files the new rule covers.
        affectedMembers:
          type: integer
          description: Present on create — members that lost access.
    KnowledgeAclWrite:
      type: object
      required: [pathPrefix]
      properties:
        pathPrefix:
          type: string
          description: Must start with `knowledge/` and end with `/`.
          example: "knowledge/hr/"
        actorIds:
          type: array
          items: { type: string, format: uuid }
        confirmRevokeExisting:
          type: boolean
          default: false
          description: >
            Required when the prefix already holds files. Acknowledges that
            those files will be removed from every unlisted member's device.
    KnowledgeAclImpact:
      type: object
      properties:
        pathPrefix: { type: string }
        affectedFiles:
          type: integer
          description: Live (non-deleted) files under the prefix.
        affectedMembers:
          type: integer
          description: Member actors that would lose access. Agents are not counted — they inherit their device owner.
    TeamMcpServer:
      type: object
      description: >
        A catalog entry. Presence here means "available to the team", not
        "running" — `installed` reflects only the calling actor.
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        name: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$" }
        transport: { type: string, enum: [local, remote] }
        command: { type: [string, "null"] }
        args: { type: [array, "null"], items: { type: string } }
        url: { type: [string, "null"] }
        headers: { type: [object, "null"], additionalProperties: { type: string } }
        env: { type: [object, "null"], additionalProperties: { type: string } }
        description: { type: [string, "null"] }
        installed: { type: boolean }
        createdBy: { type: [string, "null"], format: uuid }
        updatedBy: { type: [string, "null"], format: uuid }
        createdAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }
    TeamMcpServerWrite:
      type: object
      description: >
        Create or patch body. `transport=local` requires `command` and forbids
        `url`; `transport=remote` is the mirror image. Secret-looking keys in
        `env`/`headers` must carry a `${KEY}` placeholder, not a literal.
      properties:
        name: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$" }
        transport: { type: string, enum: [local, remote] }
        command: { type: [string, "null"] }
        args: { type: [array, "null"], items: { type: string } }
        url: { type: [string, "null"] }
        headers: { type: [object, "null"], additionalProperties: { type: string } }
        env: { type: [object, "null"], additionalProperties: { type: string } }
        description: { type: [string, "null"] }
    TeamMcpServerConfigEntry:
      type: object
      description: >
        One entry of the daemon-facing `mcpServers` map — the on-disk Cursor
        shape, with only the fields relevant to its transport.
      properties:
        command: { type: string }
        args: { type: array, items: { type: string } }
        url: { type: string }
        headers: { type: object, additionalProperties: { type: string } }
        env: { type: object, additionalProperties: { type: string } }
    TeamMcpInstall:
      type: object
      description: Always the calling actor's own install — installs are self-only.
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        serverId: { type: string, format: uuid }
        name: { type: string }
        installedAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }
    TeamEnvEnvelope:
      type: object
      description: >
        Client-side AES-256-GCM envelope. The server stores these three fields
        verbatim and holds no key — it cannot decrypt, by design.
      required: [v, nonce, ciphertext]
      properties:
        v: { type: integer, minimum: 1 }
        nonce: { type: string, description: Base64 12-byte nonce. }
        ciphertext: { type: string, description: Base64 ciphertext including the GCM tag. }
    TeamEnvSecret:
      type: object
      description: >
        Note what is absent: there is no `value`, and no description/category
        either — that metadata is encrypted inside the envelope alongside the
        value, so only the client can read it.
      properties:
        keyId: { type: string, pattern: "^[a-z0-9_]{1,64}$" }
        envelope: { $ref: "#/components/schemas/TeamEnvEnvelope" }
        createdBy: { type: [string, "null"], format: uuid }
        updatedBy: { type: [string, "null"], format: uuid }
        createdAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }
    AppType:
      type: string
      description: |
        What kind of app this is. All deploy through the same pipeline; the type
        selects the starter template the local daemon writes and decides whether
        the deploy provisions a Postgres schema (`data_app` only).

        `imported` is not chosen by anyone — it is what the two import paths
        store, because `type` is NOT NULL and every unrecognized value is read
        as `data_app`, which would make an imported repo demand a Postgres
        schema and the team's org on its first deploy.

        `fullstack_tanstack_postgres` is the legacy id for `data_app` and is
        still stored on apps created before the split. `PATCH /v1/apps/{appId}`
        refuses to write it; an app is moved off it by setting `data_app`.
      enum: [static_web, slides, data_app, imported, fullstack_tanstack_postgres]
    AppFcStatus:
      type: string
      description: |
        Deploy lifecycle, orthogonal to `provisionStatus` (which tracks the repo
        and its seeding). `null` means the app has never been deployed.
      enum: [not_deployed, awaiting_build, building, deploying, live, deploy_error]
    AppBuildKind:
      type: string
      description: |
        How the app artifact is built. This is persisted in `apps.runtime`;
        Function Compute's runtime is declared separately in `start.fcRuntime`.
      enum: [node, python, go, php, java, container]
      default: node
    AppBuildSpec:
      type: object
      required: [kind, output]
      properties:
        kind:
          $ref: "#/components/schemas/AppBuildKind"
        output:
          type: string
          description: Relative artifact output path inside the checkout.
        command:
          type: string
          description: Optional shell build command.
        dockerfile:
          type: string
          description: Relative Dockerfile path for container builds.
        context:
          type: string
          description: Relative Docker build context.
    AppStartSpec:
      type: object
      required: [port]
      properties:
        fcRuntime:
          type: string
          description: Function Compute runtime for non-container builds.
        command:
          type: array
          items: { type: string }
        args:
          type: array
          items: { type: string }
        port:
          type: integer
          minimum: 1
          maximum: 65535
        layers:
          type: array
          items: { type: string }
          description: Function Compute layer ARNs; an empty list disables defaults.
        healthCheckPath:
          type: string
          pattern: "^/"
    AppAuthMode:
      type: string
      description: |
        How the deployed app authenticates end users. `none` means the live URL
        is reachable without login; `platform` uses TeamClu SSO (GoTrue OAuth
        client per app); `third` uses the app's own OAuth client id stored on
        this row (secret in `app_secrets`, never returned here).
      enum: [none, platform, third]
      default: none
    App:
      type: object
      required: [id, teamId, name, slug, type, visibility, provisionStatus, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        createdByActorId:
          type: [string, "null"]
          format: uuid
          description: >-
            Actor that created the app. Clients resolve it to a name through the
            team's actor directory; a team app list without it is a list of
            names nobody can place.
        name: { type: string }
        slug: { type: string }
        type:
          $ref: "#/components/schemas/AppType"
        visibility: { type: string, enum: [personal, team] }
        workspaceId:
          type: [string, "null"]
          format: uuid
          description: >-
            The app's own workspace, created with the app. Its `path` is filled
            in by the desktop once the local daemon reports where it put the
            checkout (`teams/<teamId>/apps/<appId>`); until then the daemon has
            no directory to resolve for this app.
        gitRemoteUrl:
          type: [string, "null"]
          description: >-
            The app's git remote: the Gitea repo provisioned for it (an SSH URL
            — the deploy key we issue cannot authenticate over HTTPS), or the
            repository it was imported from. Set at creation and not editable.
        gitAuthKind:
          type: [string, "null"]
          enum: [gitea_deploy_key, null]
          description: >-
            `gitea_deploy_key` when this deployment provisioned the app's repo
            and holds a deploy key for it — `/git-head` and `/git-credential`
            answer only for those. Null for an app imported from a remote we
            have no credential for; those deploy the local checkout instead.
        gitCommitSha:
          type: [string, "null"]
          pattern: "^[0-9a-f]{7,40}$"
          description: >-
            HEAD commit SHA on the app's Gitea repo at last successful deploy;
            null before the first deploy completes.
        runtime:
          $ref: "#/components/schemas/AppBuildKind"
          description: Build kind persisted from the last successful declaration.
        startSpec:
          oneOf:
            - $ref: "#/components/schemas/AppStartSpec"
            - type: "null"
          description: Start configuration persisted from the last successful declaration.
        authMode:
          $ref: "#/components/schemas/AppAuthMode"
        authAudience:
          $ref: "#/components/schemas/AppAuthAudience"
        authScope:
          $ref: "#/components/schemas/AppAuthScope"
        authRules:
          type: array
          items: { $ref: "#/components/schemas/AppAuthRule" }
          description: >-
            Exceptions to `authScope`; longest matching path prefix wins.
            Empty on most apps — the whole site behind the wall needs no
            exceptions.
        customDomain:
          type: [string, "null"]
          description: >-
            A domain the app's owner controls, bound to this app. Null until
            one is set. Serving on it also requires `customDomainVerifiedAt`.
        customDomainVerifiedAt:
          type: [string, "null"]
          format: date-time
          description: >-
            When DNS ownership of `customDomain` was last proven. Null means
            the domain is stored but NOT served: the certificate gate answers
            404 for it, so no certificate is ever requested.
        authModePendingRedeploy:
          type: boolean
          description: >-
            The function env still lags the app's auth settings — the Supabase
            variables an app may use itself are injected at finalize, not on
            the PATCH. This does NOT mean the site is unprotected: the login
            wall lives in the proxy gateway and takes effect immediately.
            Server-derived from `fc_status` and the deployed mode; false for an
            app that has never been live.
        envPendingRedeploy:
          type: boolean
          description: >-
            The app's environment variables have changed since the running
            function was built. The environment is baked in at finalize, so an
            edit does nothing until the next deploy. Server-derived from
            `fc_status` and the two env timestamps; false for an app that has
            never been live.
        typePendingRedeploy:
          type: boolean
          description: >-
            The app's `type` changed since the running function was deployed,
            in the one way a deploy acts on — whether the function gets a
            database — so the running app does not reflect it until the next
            deploy. Switching among the types without a database
            (`static_web`, `slides`, `imported`) is never pending. Server-derived
            from `fc_status` and the deployed type; false for an app that has
            never been live.
        oauthClientId:
          type: [string, "null"]
          description: >-
            Public OAuth client id when `authMode` is `third`, or the GoTrue
            client id when `authMode` is `platform`. Never includes the matching
            secret.
        provisionStatus:
          type: string
          enum: [pending, repo_created, seeding, ready, error]
        fcStatus:
          oneOf:
            - $ref: "#/components/schemas/AppFcStatus"
            - type: "null"
        fcEndpoint:
          type: [string, "null"]
          description: >-
            Function Compute trigger URL of the deployed app; set once
            `fcStatus` is `live`. Its hostname carries a random suffix, so it
            cannot be derived from the app — prefer `publicUrl` when present.
        publicUrl:
          type: [string, "null"]
          description: >-
            Vanity URL (`https://<slug>-<first 8 of id>.<apps domain>`) served
            by the deployment's own reverse proxy. Derived, never stored, and
            null when the deployment has no apps domain configured — then
            `fcEndpoint` is the only address the app has.
        fcFunctionName: { type: [string, "null"] }
        fcRegion: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AppGitCredential:
      type: object
      required: [remoteUrl, authKind, privateKeyPem, deployKeyId, expiresAt]
      description: >-
        One-time deploy-key credential for the app's Gitea repo. Secret — never log.
      properties:
        remoteUrl: { type: string }
        authKind: { type: string, enum: [deploy_key] }
        privateKeyPem:
          type: string
          description: PKCS#8 PEM private key for git over SSH.
        deployKeyId:
          type: integer
          description: Gitea deploy key id (for optional cleanup after push).
        expiresAt:
          type: string
          format: date-time
          description: Informational TTL (~15m); the key remains until deleted on Gitea.
    AppLogEntry:
      type: object
      required: [ts, kind, level, message]
      properties:
        ts: { type: string, format: date-time }
        kind:
          type: string
          enum: [app, request]
          description: "`app`: printed by the application. `request`: Function Compute's own per-request row."
        level:
          type: string
          enum: [info, warn, error]
          description: >-
            For an `app` entry this is inferred from the text — Function Compute
            adds no level of its own. For a `request` entry it follows the
            status code.
        message: { type: string }
        requestId:
          type: [string, "null"]
          description: >-
            Present on every `request` entry, and on an `app` entry whose
            invocation could be identified from the surrounding framing lines.
        instanceId: { type: [string, "null"] }
        statusCode: { type: [integer, "null"] }
        durationMs: { type: [number, "null"] }
        method: { type: [string, "null"] }
        path: { type: [string, "null"] }
        coldStart: { type: [boolean, "null"] }
    AppLogsPage:
      type: object
      required: [items, truncated]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AppLogEntry"
        truncated:
          type: boolean
          description: More entries matched than `limit`, or the scan budget ended the window early.
        from:
          type: [string, "null"]
          format: date-time
          description: Start of the window actually read. Null when the app has no logstore yet.
        to:
          type: [string, "null"]
          format: date-time
    AppGitHead:
      type: object
      required: [sha, branch, deployedSha, undeployedCommits]
      properties:
        sha:
          type: string
          description: Default-branch HEAD commit id on the app's Gitea repo.
        branch:
          type: string
          description: >-
            The default branch's name. Returned because "3 commits behind" is
            much easier to act on when it also says behind what.
        deployedSha:
          type: [string, "null"]
          description: >-
            The commit the running function was built from (`apps.git_commit_sha`).
            Null when the app has never been deployed.
        undeployedCommits:
          type: [integer, "null"]
          description: >-
            Commits on the branch that the deployed commit does not have. `0`
            means the deployed commit IS the head. Null means the question was
            not asked (no `compare=1`), or could not be answered — nothing is
            deployed yet, or the forge could not compare the two, which is what
            a force-push away from the deployed commit looks like.
    AppAuthAudience:
      type: string
      enum: [any, org]
      description: >-
        Who may pass an app's login wall. `any` — anyone with an account on
        this platform's Supabase, which visitors create through the app's own
        login page. `org` — additionally, the visitor's organisation must be
        the one that owns the app. Only read when `authMode` is `platform`.
        Defaults to `org`: opening an app to everyone is a decision to be made
        on purpose, not one to arrive at by omission.
    AppAuthScope:
      type: string
      enum: [all, paths]
      description: >-
        The baseline for which paths sit behind the login wall, applied when no
        rule in `authRules` matches. `all` — the whole site. `paths` — only
        what the rules protect. Defaults to `all`.
    AppAuthRule:
      type: object
      required: [path, auth]
      description: >-
        One exception to `authScope`. Matching is by case-insensitive path
        PREFIX (`/admin` covers `/admin` and `/admin/...`, but never
        `/administrator`), and the LONGEST matching prefix decides — so the
        rule set reads the same whatever order it is stored in.
      properties:
        path:
          type: string
          pattern: "^/"
          description: >-
            Path prefix. A trailing `/*` is accepted and stripped (a prefix
            already covers every sub-path); a `*` anywhere else is rejected,
            since it can only mean the author expected glob matching.
        auth:
          type: string
          enum: [required, public]
        audience:
          type: string
          enum: [any, org]
          description: >-
            Who satisfies the login on this path. Only meaningful with
            `auth: required`, and OPTIONAL: an absent `audience` means "use the
            app's own `authAudience`", never a default of its own. Reading it as
            `org` when absent would tighten the wall on every app currently set
            to `any` — every rule stored before this field existed is absent.
    AppEnvVar:
      type: object
      required: [key, isSecret, value, updatedAt]
      properties:
        key: { type: string }
        isSecret: { type: boolean }
        value:
          type: [string, "null"]
          description: >-
            The stored value, or null when `isSecret`. Null is not "empty" — a
            secret's value is never returned to anyone.
        updatedAt: { type: string, format: date-time }
    AppCronJobInput:
      type: object
      description: >-
        Fields of a scheduled task. On create, `name` and `schedule` are
        required; on update every field is optional and what is absent is left
        alone.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        enabled:
          type: boolean
          default: true
          description: A disabled task has no `nextRunAt` and is never claimed by a tick.
        schedule:
          type: string
          description: >-
            Five cron fields — minute hour day-of-month month day-of-week —
            supporting `*`, lists, ranges and `/n` steps, plus three-letter
            month and weekday names. When BOTH day fields are restricted, a run
            happens if EITHER matches, as Vixie cron has always done. `@daily`,
            `L`/`W`/`#` and seconds are not supported.
        timezone:
          type: string
          default: UTC
          description: >-
            IANA zone the expression is read in. A local time inside a
            spring-forward gap simply does not occur that day; a time inside an
            autumn overlap runs once, not twice.
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE, HEAD]
          default: GET
        path:
          type: string
          pattern: "^/"
          maxLength: 512
          description: >-
            Path on the app's own public URL. Path only — the host comes from
            the app row at fire time, so a task can never be aimed at another
            origin and keeps working if the app is renamed.
        headers:
          type: object
          additionalProperties: { type: string }
          description: >-
            Extra request headers, at most 20. This is where a task carries its
            own shared secret: the request has NO session, so authenticating it
            is the app's job. `host` and hop-by-hop headers are dropped.
        body:
          type: [string, "null"]
          maxLength: 65536
          description: Ignored on GET and HEAD, which cannot carry one.
        timeoutMs:
          type: integer
          minimum: 1000
          maximum: 60000
          default: 30000
    AppCronJob:
      type: object
      required: [id, appId, name, enabled, schedule, timezone, method, path, headers, timeoutMs, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        appId: { type: string, format: uuid }
        name: { type: string }
        enabled: { type: boolean }
        schedule: { type: string }
        timezone: { type: string }
        method: { type: string }
        path: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
        body: { type: [string, "null"] }
        timeoutMs: { type: integer }
        lastRunAt: { type: [string, "null"], format: date-time }
        nextRunAt:
          type: [string, "null"]
          format: date-time
          description: >-
            When this task fires next. Null means never again — it is disabled,
            or its expression names a date that does not exist (Feb 30). Both
            are ordinary states, not errors.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AppCronRunOutcome:
      type: object
      required: [jobId, status, responseStatus, error]
      properties:
        jobId: { type: string, format: uuid }
        status:
          type: string
          enum: [success, failed, timeout]
          description: >-
            `success` is any 2xx or 3xx that is not a bounce to the login
            service. An app's own redirect is a success; the login wall turning
            the task away is not.
        responseStatus: { type: [integer, "null"] }
        error: { type: [string, "null"] }
    AppCronRun:
      type: object
      required: [id, jobId, startedAt, status]
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        status:
          type: string
          enum: [success, failed, timeout]
        responseStatus: { type: [integer, "null"] }
        durationMs: { type: [integer, "null"] }
        error: { type: [string, "null"] }
    AppCustomDomain:
      type: object
      required: [domain, verified, dns]
      description: >-
        The app's custom domain and the proof it needs. `dns` is what the owner
        must add at their registrar; it is returned on every response here so a
        client never has to reconstruct it.
      properties:
        domain:
          type: [string, "null"]
          description: ASCII (punycode) form of the bound hostname; null when none is bound.
        verified:
          type: boolean
        verifiedAt:
          type: [string, "null"]
          format: date-time
        dns:
          type: array
          description: Empty when no domain is bound.
          items:
            type: object
            required: [type, name, value]
            properties:
              type: { type: string, enum: [CNAME, TXT] }
              name: { type: string }
              value: { type: string }
    AppMembership:
      type: object
      required: [member]
      description: >-
        Whether the authenticated user is a member of the team that owns the
        app. Used by deployed apps to gate platform SSO without a service role.
      properties:
        member:
          type: boolean
          description: >-
            True when the caller has a member actor in the app's `teamId`;
            false otherwise (including when the app is personal and the caller
            is not the creator).
    AppPermissionLevel:
      type: string
      enum: [view, prompt, admin]
      description: >-
        Per-member app capability. `view` — see metadata only; `prompt` — git
        write (clone/push) but no deploy or grant management; `admin` — full
        control including deploy and access management.
    AppMemberAccessRow:
      type: object
      required: [memberId, permissionLevel, createdAt]
      properties:
        memberId:
          type: string
          format: uuid
          description: Granted team member actor id.
        permissionLevel:
          $ref: "#/components/schemas/AppPermissionLevel"
        grantedByMemberId:
          type: [string, "null"]
          format: uuid
          description: Member who last wrote this grant.
        createdAt:
          type: string
          format: date-time
    AppDataColumn:
      type: object
      required: [name, dataType, nullable]
      properties:
        name:
          type: string
        dataType:
          type: string
          description: Postgres `information_schema.columns.data_type`.
        nullable:
          type: boolean
    AppFile:
      type: object
      required: [path, size]
      properties:
        path:
          type: string
          description: Relative to the app's own root, never the full object key.
        size:
          type: integer
        lastModified:
          type: [string, "null"]
          format: date-time
        etag:
          type: [string, "null"]
    AppStorageUsage:
      type: object
      required: [bytes, quotaBytes, overQuota]
      properties:
        bytes:
          type: [integer, "null"]
          description: |
            Bytes measured at `countedAt`. Null means never measured. Stale by
            design - see the endpoint description.
        countedAt:
          type: [string, "null"]
          format: date-time
        quotaBytes:
          type: [integer, "null"]
          description: The app's own ceiling, else the deployment default. Null is unlimited.
        overQuota:
          type: boolean
    AppStorageCredentials:
      type: object
      required: [accessKeyId, accessKeySecret, securityToken, expiration, bucket, prefix, region, endpoint]
      properties:
        accessKeyId:
          type: string
        accessKeySecret:
          type: string
        securityToken:
          type: string
        expiration:
          type: string
          format: date-time
          description: Refresh before this. Do not wait for a 403.
        bucket:
          type: string
        prefix:
          type: string
          description: |
            Every key the app writes must start with this. The credentials
            cannot address anything outside it, so a key that omits it fails
            with AccessDenied rather than landing somewhere unexpected.
        region:
          type: string
        endpoint:
          type: string
    AppDataTable:
      type: object
      required: [name, columns, primaryKey, editable]
      properties:
        name:
          type: string
        columns:
          type: array
          items:
            $ref: "#/components/schemas/AppDataColumn"
        primaryKey:
          type: array
          items: { type: string }
          description: Ordered primary-key columns; empty when the table has none.
        editable:
          type: boolean
          description: >-
            False when there is no primary key. Without one there is no safe
            "this row" — `update … where title = 'x'` can match several — so the
            table stays browsable and row actions are disabled.
    AppDataRowsPage:
      type: object
      required: [table, columns, primaryKey, editable, rows, nextCursor]
      properties:
        table:
          type: string
        columns:
          type: array
          items:
            $ref: "#/components/schemas/AppDataColumn"
        primaryKey:
          type: array
          items: { type: string }
        editable:
          type: boolean
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
          description: >-
            Values are returned in full. Truncating long text belongs in the UI
            — a server-side truncation would mean the value someone copies out
            is silently not the value in the database.
        nextCursor:
          type: [string, "null"]
          description: Pass as `after` for the next page. Null on the last page.
    BootstrapConfig:
      type: object
      description: >-
        Runtime configuration delivered to authenticated clients on startup.
        Every field is optional; clients fall back to their baked build config
        when one is omitted. An empty object is a valid answer and means "no
        overrides" — it must NEVER be read as "everything is disabled".
      properties:
        mqtt:
          $ref: "#/components/schemas/BootstrapMqttConfig"
        features:
          $ref: "#/components/schemas/BootstrapFeatures"
        webSso:
          allOf:
            - $ref: "#/components/schemas/WebSsoConfig"
          deprecated: true
          description: >-
            DEPRECATED — read this from `/v1/config/public` instead. Still
            served here because shipped clients (which fetch the public config
            only from a newer build) resolve their 快捷登录 target from this
            block; removing it would break their sign-in until they update.
      additionalProperties: true
    PublicConfig:
      type: object
      description: >-
        Unauthenticated pre-sign-in configuration. Same "absent means fall back
        to the build config" rule as BootstrapConfig.
      properties:
        webSso:
          $ref: "#/components/schemas/WebSsoConfig"
        features:
          $ref: "#/components/schemas/PublicFeatures"
      additionalProperties: true
    WebSsoConfig:
      type: object
      required: [loginUrl]
      description: 快捷登录 target — the partner admin console whose session is harvested.
      properties:
        loginUrl:
          type: string
          description: Admin console sign-in URL opened in the modal webview.
        storageKey:
          type:
            - string
            - "null"
          description: >-
            supabase-js localStorage key on that console (`sb-<ref>-auth-token`).
            Cannot be derived from the host, so it is delivered explicitly.
    PublicFeatures:
      type: object
      description: Feature flags the login screen needs before a session exists.
      properties:
        auth:
          $ref: "#/components/schemas/AuthFeatures"
      additionalProperties: false
    AuthFeatures:
      type: object
      description: >-
        Which sign-in methods this deployment offers. Each flag overrides the
        client's baked `features.auth.*`, EXCEPT `webSSO`, which is ANDed with
        the build flag: enabling it server-side alone is not enough, because the
        allowed admin-console hosts are compiled into the desktop binary
        (`WEBSSO_ADMIN_HOSTS`, apps/desktop/build.rs).
      properties:
        google: { type: boolean }
        wechat: { type: boolean }
        phone: { type: boolean }
        password: { type: boolean }
        webSSO: { type: boolean }
      additionalProperties: false
    BootstrapFeatures:
      type: object
      description: >-
        Post-sign-in feature flags. UI gating only — never authorization: a
        client with a tampered flag must still be refused by the endpoint that
        owns the feature.


        `updater` is deliberately absent and not overridable. It gates the
        startup auto-check as well as the UI, so a server-side mistake would
        strand the installed fleet with no way to update out of it.
      properties:
        channels:
          $ref: "#/components/schemas/ChannelFeatures"
        apps: { type: boolean }
        lockLlmConfig:
          type: boolean
          description: >-
            Locks clients out of changing or leaving the team LLM config.
            Deployment-scoped, matching what it already meant as the build-time
            `team.lockLlmConfig` (i.e. per brand) — not per team.
      additionalProperties: false
    ChannelFeatures:
      type: object
      description: Per-channel gateway toggles. Merged key-by-key over the build config.
      properties:
        discord: { type: boolean }
        feishu: { type: boolean }
        email: { type: boolean }
        kook: { type: boolean }
        wecom: { type: boolean }
        wechat: { type: boolean }
      additionalProperties: false
    BootstrapMqttConfig:
      type: object
      required: [url]
      description: >-
        Broker address handed to clients. Credentials are NOT part of this
        payload: clients authenticate to EMQX with username=actor_id and
        password=<Supabase access_token> (JWT auth).
      properties:
        url:
          type: string
          description: Full broker URL including scheme (mqtt://, mqtts://, ws://, wss://) and port.
        tcpUrl:
          type:
            - string
            - "null"
          description: >-
            Raw-TCP address for clients whose MQTT stack cannot do WebSocket
            (iOS CocoaMQTT, Expo). Desktop and daemon prefer `url`.
        useTls:
          type:
            - boolean
            - "null"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum:
                - missing_auth
                - invalid_json
                - validation_failed
                - forbidden
                - not_found
                - conflict
                - rate_limited
                - upstream_unavailable
                - internal
            message:
              type: string
            requestId:
              type: string
    Team:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type:
            - string
            - "null"
        createdAt:
          type:
            - string
            - "null"
        visibility:
          description: |
            Team visibility within its org. `private` (default) teams are
            invite/bootstrap-only; `public` teams are discoverable and
            self-service joinable by other users in the shared DEFAULT_ORG.
          type: string
          enum: [public, private]
        orgId:
          type:
            - string
            - "null"
        orgName:
          type:
            - string
            - "null"
        isMember:
          description: |
            Present in the `GET /v1/teams?scope=all` picker listing. `false`
            marks a public DEFAULT_ORG team the caller may join via
            `POST /v1/teams/{teamId}/join`; `true` (or absent) means the caller
            is already an actor in the team.
          type: boolean
    Session:
      type: object
      required: [id, teamId, title, mode, hasUnread]
      properties:
        id:
          type: string
        teamId:
          type: string
        title:
          type: string
        mode:
          type: string
          enum: [solo, collab, control]
        ideaId:
          type:
            - string
            - "null"
        lastMessageAt:
          type:
            - string
            - "null"
        lastMessagePreview:
          type:
            - string
            - "null"
        hasUnread:
          type: boolean
        appId:
          description: >-
            The app this session belongs to, when it was created from one
            (`amux.sessions.app_id`). Served by the list RPC as of
            20260907000000; `null` both for ordinary sessions and for a
            database that predates that migration.
          type:
            - string
            - "null"
        source:
          description: >-
            How the session was created. 'user' for normal sessions, 'cron' for
            sessions auto-created by a scheduled task, 'gateway' for gateway
            (WeCom etc.) bindings, 'thread' for agent-reply fork threads.
          type: string
          enum: [user, cron, gateway, thread]
        parentSessionId:
          description: Parent session when source='thread'.
          type:
            - string
            - "null"
        threadRootMessageId:
          description: Anchor agent_reply message when source='thread'.
          type:
            - string
            - "null"
        cronJobId:
          description: >-
            For source='cron', the desktop-local cron job id that created this
            session (a daemon-local string id, not a cloud reference).
          type:
            - string
            - "null"
        summary:
          description: >-
            Display-row field. Previously served only by the removed
            GET /v1/teams/{teamId}/sessions.
          type:
            - string
            - "null"
        primaryAgentId:
          type:
            - string
            - "null"
        createdByActorId:
          type:
            - string
            - "null"
        binding:
          description: >-
            For source='gateway', the chat URI this session is *currently* the
            live one for (e.g. wecom://{corp}/{agent}/single/{userid}). Released
            to null when /new moves the chat onto a fresh session, so it answers
            "is this the current session", not "which chat is this".
          type:
            - string
            - "null"
        gatewayKey:
          description: >-
            For source='gateway', the chat this session belongs to for its whole
            life. Unlike `binding` it is never released, so a session that /new
            has moved past can still say where it came from — which is what
            listing a chat's own session history is keyed on.
          type:
            - string
            - "null"
        participantCount:
          description: >-
            Number of participants in the session, counted server-side. It used
            to be derived by a follow-up query that listed every session id in a
            URL, which is what outgrew the gateway's request-line limit.
          type: integer
        createdAt:
          type:
            - string
            - "null"
        updatedAt:
          type:
            - string
            - "null"
    Message:
      type: object
      required: [id, teamId, sessionId, kind, content, createdAt]
      properties:
        id:
          type: string
        teamId:
          type: string
        sessionId:
          type: string
        turnId:
          type:
            - string
            - "null"
        senderActorId:
          type:
            - string
            - "null"
        replyToMessageId:
          type:
            - string
            - "null"
        kind:
          type: string
        content:
          type: string
        metadata:
          type:
            - object
            - "null"
        model:
          type:
            - string
            - "null"
        createdAt:
          type: string
        updatedAt:
          type:
            - string
            - "null"
    InsertMessageRequest:
      type: object
      required: [id, teamId, senderActorId, content]
      properties:
        id:
          type: string
        teamId:
          type: string
        senderActorId:
          type: string
        content:
          type: string
        kind:
          type: string
          default: text
        metadata:
          type:
            - object
            - "null"
        turnId:
          type:
            - string
            - "null"
        replyToMessageId:
          type:
            - string
            - "null"
        model:
          type:
            - string
            - "null"
        createdAt:
          type:
            - string
            - "null"
    ClaimInviteResult:
      type: object
      required: [actorId, teamId, actorType, displayName]
      properties:
        actorId:
          type: string
        teamId:
          type: string
        actorType:
          type: string
        displayName:
          type: string
        refreshToken:
          type:
            - string
            - "null"
    PendingInvite:
      type: object
      required: [inviteId, teamId]
      properties:
        inviteId:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        teamName:
          type:
            - string
            - "null"
        teamRole:
          type:
            - string
            - "null"
        displayName:
          type:
            - string
            - "null"
          description: The name the inviter typed for this person.
        invitedByDisplayName:
          type:
            - string
            - "null"
        inviteEmail:
          type:
            - string
            - "null"
        invitePhone:
          type:
            - string
            - "null"
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
        matchedVia:
          type:
            - string
            - "null"
          enum: [email, phone, null]
          description: Which of the caller's verified contacts this invite matched on.
    TeamWorkspaceConfig:
      type: object
      required: [teamId, defaultWorkspaceId]
      properties:
        teamId:
          type: string
        defaultWorkspaceId:
          type:
            - string
            - "null"
        pinnedWorkspaceIds:
          type: array
          items:
            type: string
        updatedAt:
          type:
            - string
            - "null"
    MergedWorkspaceConfig:
      type: object
      # `litellmTeamId` left the required set when the team gateway replaced
      # LiteLLM. It is still RETURNED (as null where absent) so older desktop
      # and iOS builds keep parsing the response — those do not update in
      # lockstep with the server. Removing it from the payload is a separate,
      # later step, gated on the minimum supported client no longer reading it.
      required: [syncMode]
      properties:
        syncMode:
          type:
            - string
            - "null"
        litellmTeamId:
          type:
            - string
            - "null"
        llm:
          type: object
          description: |
            The team's AI gateway as the client should use it. When the team
            has stored a `baseUrl` (via `PUT /v1/teams/{teamId}/llm-config`)
            that config is returned verbatim — including `enabled: false` with
            a `baseUrl`, which is how a team opts out. A team with NO stored
            `baseUrl` is served the deployment's own gateway instead: `enabled`
            true, `baseUrl` `<request origin>/ai/v1/teams/{teamId}`, and the
            three public tiers as `models` — provided this Cloud API runs a
            gateway (`AI_GATEWAY_INTERNAL_URL` + `AI_GATEWAY_SERVICE_TOKEN`).
            Nothing flips `llm_enabled` at team creation, so without this
            default every new team had a signup credit grant and no model.
          required: [enabled, baseUrl, models]
          properties:
            enabled: { type: boolean }
            baseUrl:
              type:
                - string
                - "null"
            models:
              type: array
              items:
                type: object
                required: [id, name]
                properties:
                  id: { type: string }
                  name: { type: string }
    UsageSummary:
      type: object
      required: [credits, inputTokens, outputTokens, requests]
      properties:
        credits: { type: integer }
        inputTokens: { type: integer }
        cachedInputTokens:
          type: integer
          description: |
            Subset of inputTokens that hit the upstream prompt cache. Recorded
            for margin analysis; NOT billed differently — the tier price is
            what the customer pays.
        outputTokens: { type: integer }
        requests: { type: integer }
    TeamCredits:
      type: object
      required: [teamId, balanceCredits, usedCredits]
      properties:
        teamId: { type: string }
        balanceCredits: { type: integer }
        usedCredits: { type: integer, description: Credits spent in the current period }
        period:
          type: object
          properties:
            range: { type: string }
            startUtc: { type: string }
            endUtc: { type: string }
    CreditUsageReport:
      type: object
      required: [range, startUtc, endUtc, summary, byModel, byActor]
      properties:
        range: { type: string, enum: [day, week, month, year] }
        startUtc: { type: string }
        endUtc: { type: string }
        summary: { $ref: '#/components/schemas/UsageSummary' }
        byModel:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/UsageSummary'
              - type: object
                properties:
                  publicModelId: { type: string }
        byActor:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/UsageSummary'
              - type: object
                properties:
                  actorId: { type: ["string", "null"] }
    CreditLedgerEntry:
      type: object
      required: [id, kind, amountCredits, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [top_up, grant, adjustment, refund] }
        amountCredits: { type: integer, description: Signed; refunds are negative }
        note: { type: ["string", "null"] }
        createdAt: { type: string }
    CreditPackage:
      type: object
      required: [priceId, credits, currency, name]
      properties:
        priceId: { type: string }
        credits:
          type: integer
          description: Credits granted on purchase, from the Price's metadata.credits
        unitAmount:
          type: ["integer", "null"]
          description: Price in MINOR currency units (cents, 分); null for a Price with no fixed amount
        currency: { type: string }
        name: { type: string }
    TeamQuotas:
      type: object
      properties:
        period: { type: string, enum: [week, month] }
        defaultLimitCredits: { type: ["integer", "null"], description: "null = unlimited" }
        lowBalanceCredits: { type: ["integer", "null"], description: "null = no alert" }
        members:
          type: array
          items:
            type: object
            required: [actorId]
            properties:
              actorId: { type: string }
              limitCredits: { type: ["integer", "null"] }
    Workspace:
      type: object
      required: [id, teamId, name, archived, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        agentId:
          description: The agent (device daemon) that registered this workspace.
          type:
            - string
            - "null"
          format: uuid
        name:
          type: string
        path:
          description: Absolute local path on the registering agent's machine.
          type:
            - string
            - "null"
        slug:
          type:
            - string
            - "null"
        archived:
          type: boolean
        metadata:
          type:
            - object
            - "null"
          additionalProperties: true
        createdAt:
          type:
            - string
            - "null"
          format: date-time
        updatedAt:
          type:
            - string
            - "null"
          format: date-time
    WorkspacePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
        nextCursor:
          type:
            - string
            - "null"
    WorkspaceUpsert:
      type: object
      required: [teamId, name]
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type:
            - string
            - "null"
        archived:
          type: boolean
        metadata:
          type:
            - object
            - "null"
          additionalProperties: true
    Actor:
      type: object
      required: [id, teamId, kind, displayName]
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        kind:
