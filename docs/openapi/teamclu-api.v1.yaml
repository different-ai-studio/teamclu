        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/sessions/{sessionId}/thread-summaries:
    get:
      operationId: listSessionThreadSummaries
      summary: Thread badge summaries for a parent session
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Thread summaries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionThreadSummary"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/sessions/{sessionId}/messages:
    get:
      operationId: listMessages
      summary: List messages
      description: |
        One page of a session's history, walking **backward** from the newest
        message: the default page is the tail of the conversation, and
        `nextCursor` reaches further into the past. Messages inside a page are
        ordered oldest-first, so a client can render them in order.

        This endpoint was previously unbounded — it returned the entire history
        and always reported `nextCursor: null`. A session with 6k messages
        measured 6.1s / 3.7MB, 20k took 22.9s, and 40k exceeded the database
        statement timeout and failed with a 500.
      tags: [Messages]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: limit
          in: query
          description: Messages per page, counted back from the newest.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
        - name: cursor
          in: query
          description: >-
            From a previous response's `nextCursor`. Returns the page of
            messages immediately OLDER than that page.
          schema:
            type: string
      responses:
        "200":
          description: Session messages.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"
                  nextCursor:
                    type:
                      - string
                      - "null"
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: insertMessage
      summary: Insert message
      tags: [Messages]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: Idempotency-Key
          in: header
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsertMessageRequest"
      responses:
        "200":
          description: Inserted or replayed message.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/messages/{messageId}:
    patch:
      operationId: patchMessage
      summary: Update message content or metadata
      tags: [Messages]
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                metadata:
                  type:
                    - object
                    - "null"
                  additionalProperties: true
      responses:
        "200":
          description: Updated message.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteMessage
      summary: Delete message
      tags: [Messages]
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: OK
        "401":
          $ref: "#/components/responses/Error"
  /v1/invites/claim:
