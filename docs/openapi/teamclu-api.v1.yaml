        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/skills/{slug}/detach:
    post:
      operationId: detachMarketplaceSkill
      summary: Stop following marketplace updates for an adopted skill
      tags: [Marketplace, TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamSkillSlug"
      responses:
        "200":
          description: Detached skill.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamSkill" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/admin/marketplace/skill-blobs/prepare:
    post:
      operationId: prepareMarketplaceSkillBlob
      summary: Prepare a marketplace package upload (admin secret)
      tags: [MarketplaceAdmin]
      parameters:
        - name: x-webhook-secret
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentHash, size]
              properties:
                contentHash: { type: string, pattern: '^[a-f0-9]{64}$' }
                size: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Upload instructions.
        "401": { $ref: "#/components/responses/Error" }
  /v1/admin/marketplace/skill-blobs/complete:
    post:
      operationId: completeMarketplaceSkillBlob
      summary: Verify a marketplace package blob (admin secret)
      tags: [MarketplaceAdmin]
      parameters:
        - name: x-webhook-secret
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentHash, size]
              properties:
                contentHash: { type: string }
                size: { type: integer }
      responses:
        "200":
          description: Verified.
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/admin/marketplace/skills:
    post:
      operationId: createMarketplaceSkill
      summary: Create a marketplace catalog item (admin secret)
      tags: [MarketplaceAdmin]
      parameters:
        - name: x-webhook-secret
          in: header
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Created.
        "401": { $ref: "#/components/responses/Error" }
  /v1/admin/marketplace/skills/{slug}/versions:
    post:
      operationId: createMarketplaceSkillVersion
      summary: Upload a marketplace version without promoting (admin secret)
      tags: [MarketplaceAdmin]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: x-webhook-secret
          in: header
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Version row created (unpublished).
        "401": { $ref: "#/components/responses/Error" }
  /v1/admin/marketplace/skills/{slug}/versions/{version}/promote:
    post:
      operationId: promoteMarketplaceSkillVersion
      summary: Promote a marketplace version to latest (admin secret)
      tags: [MarketplaceAdmin]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: x-webhook-secret
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Promoted.
        "401": { $ref: "#/components/responses/Error" }
  /v1/admin/marketplace/skills/{slug}/versions/{version}/revert:
    post:
      operationId: revertMarketplaceSkillVersion
      summary: Roll forward a revert of an earlier marketplace version (admin secret)
      tags: [MarketplaceAdmin]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: x-webhook-secret
          in: header
          required: true
          schema: { type: string }
      responses:
        "201":
          description: New version published as revert.
        "401": { $ref: "#/components/responses/Error" }
  /v1/admin/marketplace/skills/{slug}:
    patch:
      operationId: updateMarketplaceSkill
      summary: Patch marketplace metadata or delist (admin secret)
      tags: [MarketplaceAdmin]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: x-webhook-secret
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated.
        "401": { $ref: "#/components/responses/Error" }
  /v1/admin/marketplace/align:
    post:
      operationId: alignMarketplaceSubscriptions
      summary: Eagerly align all subscribed teams (optional latency cut)
      tags: [MarketplaceAdmin]
      parameters:
        - name: x-webhook-secret
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Align count.
        "401": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/skills:
    get:
      operationId: listTeamSkills
      summary: List the team skills registry
      description: >
        Full registry, not just what the caller installed. `actorId` selects
        whose install state decorates each row — omit for the caller, pass a
        team agent's actor id to inspect that agent.
      tags: [TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [draft, published, deprecated] }
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/TeamSkillCategory" }
      responses:
        "200":
          description: Registry entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TeamSkill" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: publishTeamSkill
      summary: Publish a skill (version 1)
      description: >
        The publish gate. `summary`, `category`, and `changelog` are required —
        they are the list subtitle, filter, and version note. `whenToUse` and
        `whenNotToUse` are optional: empty is a real answer, not a missing field.
        The package zip is uploaded separately via the amuxc blob path; only
        its contentHash arrives here.
      tags: [TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamSkillPublish" }
      responses:
        "201":
          description: Published.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamSkill" }
        "400": { $ref: "#/components/responses/Error" }
        "409":
          description: A skill with that slug already exists — publish a version instead.
          $ref: "#/components/responses/Error"
  /v1/teams/{teamId}/skill-blobs/prepare:
    post:
      operationId: prepareTeamSkillBlob
      summary: Prepare a skill package blob upload
      description: >
        Upserts an amuxc_blobs placeholder and returns a short-lived
        presigned PUT URL when the object is not already in OSS. Does not
        create an amuxc_files sync path — skill packages are content-addressed
        only.
      tags: [TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentHash, size]
              properties:
                contentHash: { type: string, description: sha256 hex of the zip }
                size: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Upload instructions for the package blob.
          content:
            application/json:
              schema:
                type: object
                required: [contentHash, size, ossKey, requiresUpload]
                properties:
                  contentHash: { type: string }
                  size: { type: integer }
                  ossKey: { type: string }
                  requiresUpload: { type: boolean }
                  presignedPut: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/skill-blobs/complete:
    post:
      operationId: completeTeamSkillBlob
      summary: Verify and mark a skill package blob uploaded
      description: >
        After the client PUTs to the presigned URL, HEAD-checks OSS and marks
        the amuxc_blobs row verified so download can resolve it.
      tags: [TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentHash, size]
              properties:
                contentHash: { type: string }
                size: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Blob verified.
          content:
            application/json:
              schema:
                type: object
                required: [contentHash, size, ossKey]
                properties:
                  contentHash: { type: string }
                  size: { type: integer }
                  ossKey: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/skill-installs:
    get:
      operationId: listTeamSkillInstalls
      summary: What a given actor should have installed
      description: >
        The reconcile list. A daemon hosting a team agent pulls the full set and
        diffs it against its local lockfile — full set rather than a delta,
        because notifications drop and daemons go offline.
      tags: [TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Install records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TeamSkillInstall" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/skills/{slug}:
    get:
      operationId: getTeamSkill
      summary: Skill detail with version history
      tags: [TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamSkillSlug"
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Skill detail.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TeamSkill"
                  - type: object
                    properties:
                      versions:
                        type: array
                        items: { $ref: "#/components/schemas/TeamSkillVersion" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateTeamSkill
      summary: Edit metadata, transfer owner, deprecate
      tags: [TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamSkillSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                summary: { type: string, maxLength: 200 }
                category: { $ref: "#/components/schemas/TeamSkillCategory" }
                whenToUse: { type: string }
                whenNotToUse: { type: string }
                requires:
                  type: [array, "null"]
                  items: { type: string }
                ownerActorId: { type: string, format: uuid }
                status: { type: string, enum: [draft, published, deprecated] }
                supersededBy:
                  type: [string, "null"]
                  description: When deprecating, the slug that replaces this one.
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamSkill" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteTeamSkill
      summary: Remove a skill from the registry
      tags: [TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamSkillSlug"
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/skills/{slug}/versions:
    post:
      operationId: publishTeamSkillVersion
      summary: Publish a new version
      description: >
        Metadata fields are optional here and inherit the skill's current
        values, so a content-only change stays a one-liner. Whatever is
        effective at publish time is snapshotted onto the version row, so
        somebody sitting on v1 keeps reading v1's notes.
      tags: [TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamSkillSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentHash, changelog, expectedLatestVersion]
              properties:
                contentHash: { type: string }
                size: { type: integer }
                changelog: { type: string }
                expectedLatestVersion:
                  type: integer
                  minimum: 0
                  description: >
                    Registry `latestVersion` the publisher's draft was built from
                    (installed/baseline version). Must match the current registry
                    `latestVersion` or the publish is rejected with
                    `409 stale_team_skill_base`. Passing the headline latest while
                    the draft lags behind would let stale edits overwrite newer
                    team releases.
                summary: { type: string, maxLength: 200 }
                category: { $ref: "#/components/schemas/TeamSkillCategory" }
                whenToUse: { type: string }
                whenNotToUse: { type: string }
                requires:
                  type: [array, "null"]
                  items: { type: string }
      responses:
        "201":
          description: Version published.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamSkillVersion" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: Registry moved since the publisher loaded it (`stale_team_skill_base`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /v1/teams/{teamId}/skills/{slug}/versions/{version}:
    get:
      operationId: getTeamSkillVersion
      summary: Version record (metadata, not the package bytes)
      tags: [TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamSkillSlug"
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Version record, including the contentHash to fetch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamSkillVersion" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/skills/{slug}/versions/{version}/download:
    get:
      operationId: downloadTeamSkillVersion
      summary: Short-lived signed URL for the package zip
      description: >
        Does not proxy bytes. Resolves the version's package location and
        returns a signed GET URL (expires in 900 seconds).


        `blob_scope=marketplace` signs the `object_path` snapshotted on
        the version row and never looks up `amuxc_blobs` — marketplace
        packages are deliberately absent from that table. `blob_scope=team`
        (default) resolves `contentHash → amuxc_blobs.oss_key` for this
        team. Clients never see `object_path` / `oss_key`; the response
        is always `{ url, contentHash, size }`.


        The signed URL carries its own credentials. Do not attach the
        caller's bearer token when fetching it.


        Design: docs/architecture/team-skill-package-download-contract.md
      tags: [TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamSkillSlug"
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Signed download URL for this version's package.
          content:
            application/json:
              schema:
                type: object
                required: [url, contentHash, size]
                properties:
                  url: { type: string, format: uri }
                  contentHash: { type: string }
                  size: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Package blob is not uploaded yet (`blob_missing`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /v1/teams/{teamId}/skills/{slug}/versions/{version}/revert:
    post:
      operationId: revertTeamSkillVersion
      summary: Re-publish an earlier version as the new latest
      description: >
        The undo for a bad publish. Installs auto-follow `latestVersion`, so a
        broken version reaches every member within one reconcile tick; without
        this the only remedy is for the author to reconstruct the old package by
        hand.


        Note what this does *not* do: `latestVersion` never moves backwards.
        Rolling it back would leave members whose `installedVersion` exceeds it,
        and "is there an update" stops having an answer. The revert publishes
        `latestVersion + 1` carrying the target version's content and its
        metadata snapshot.
      tags: [TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamSkillSlug"
        - name: version
          in: path
          required: true
          description: The version whose content should become the new latest.
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedLatestVersion]
              properties:
                expectedLatestVersion:
                  type: integer
                  minimum: 0
                  description: >
                    Registry `latestVersion` the caller loaded before choosing to
                    revert. Must match the current registry `latestVersion` or the
                    revert is rejected with `409 stale_team_skill_base`.
                changelog:
                  type: string
                  description: Defaults to "Reverted to v{version}".
      responses:
        "201":
          description: The newly published version carrying the old content.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamSkillVersion" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: >
            Conflict. Either the registry moved since the caller loaded it
            (`stale_team_skill_base`), or the target version is already the
            latest (`conflict`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /v1/teams/{teamId}/skills/{slug}/install:
    put:
      operationId: installTeamSkill
      summary: Record an install
      description: >
        Four gates. (1) Installing for yourself (the caller's member actor) is
        always allowed. (2) Installing onto an agent the caller owns — personal
        or team — is allowed: a member's own machine is an agent, not a member
        actor, and the install has to be recorded against the actor the daemon
        will be asked "what do you have installed". (3) Installing onto a
        `visibility=team` agent the caller does not own requires a team admin.
        (4) Installing onto another member's actor is always refused — an admin
        owns the team's shared agents, not a teammate's personal setup.
      tags: [TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamSkillSlug"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                actorId:
                  type: string
                  format: uuid
                  description: Defaults to the caller's actor in this team.
                version: { type: integer, minimum: 1 }
                scope: { type: string, enum: [global, workspace], default: global }
                workspaceId: { type: string, format: uuid }
      responses:
        "200":
          description: Install recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamSkillInstall" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      operationId: uninstallTeamSkill
      summary: Record an uninstall
      tags: [TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamSkillSlug"
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Uninstalled. }
        "403": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/knowledge-acl:
    get:
      operationId: listKnowledgeAcl
      summary: List restricted knowledge prefixes
      description: >
        Owner/admin only. Returns every restricted prefix in the team with the
        actors granted access to it.


        The rules are NOT exposed to ordinary members and are never sent to sync
        clients: a directory name is itself sensitive, so a restricted directory
        is invisible to those without access rather than shown as locked.
      tags: [KnowledgeAcl]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Rules with their grants.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/KnowledgeAclRule" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createKnowledgeAcl
      summary: Restrict a knowledge prefix
      description: >
        Owner/admin only. Whitelist semantics — once a prefix has a rule it is
        closed to every actor not listed in `actorIds`.


        Restricting a directory that already holds files removes those files from
        every unlisted member's device on their next sync. Because that is not
        reversible for copies already taken, the call returns 409
        `confirmation_required` (with the affected counts in `details`) unless
        `confirmRevokeExisting` is true. Use the `preview` endpoint to obtain
        those counts before asking the user to confirm.


        Revocation stops distribution; it does not recall content that was
        already synced. Knowledge is stored in plaintext server-side — this is
        in-team access control, not confidentiality from the operator.
      tags: [KnowledgeAcl]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeAclWrite" }
      responses:
        "201":
          description: Created, with the impact of the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeAclRule" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: The prefix already holds files and `confirmRevokeExisting` was not set.
          $ref: "#/components/responses/Error"
        "422":
          description: The team is at its rule limit.
          $ref: "#/components/responses/Error"
  /v1/teams/{teamId}/knowledge-acl/preview:
    post:
      operationId: previewKnowledgeAcl
      summary: Preview the impact of restricting a prefix
      description: >
        Owner/admin only. Dry run — writes nothing. Answers how many live files
        and how many members a proposed restriction would cut off, so the
        confirmation screen can show the number before the admin commits.


        `affectedMembers` counts member actors only. Agents inherit the
        permissions of the device owner they run for, so they are not counted.
      tags: [KnowledgeAcl]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pathPrefix]
              properties:
                pathPrefix: { type: string, example: "knowledge/hr/" }
                actorIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Impact of the proposed rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeAclImpact" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/knowledge-acl/{aclId}:
    patch:
      operationId: updateKnowledgeAcl
      summary: Change who may see a restricted prefix
      description: >
        Owner/admin only. Adding an actor also re-surfaces the prefix's existing
        files in the manifest, so a newly granted member receives content that
        predates their grant.
      tags: [KnowledgeAcl]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: aclId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                addActorIds:
                  type: array
                  items: { type: string, format: uuid }
                removeActorIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Updated rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeAclRule" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteKnowledgeAcl
      summary: Remove a restriction
      description: >
        Owner/admin only. The prefix reopens to the whole team and its files are
        re-surfaced so every member receives them on the next sync.
      tags: [KnowledgeAcl]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: aclId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Removed. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/mcp-servers:
    get:
      operationId: listTeamMcpServers
      summary: List the team MCP catalog
      description: >
        Full catalog, decorated with an actor's `installed` flag. `actorId`
        defaults to the caller; pass a team agent's actor id to inspect what
        that agent has installed. Reading another actor's install state is
        allowed, writing it is not — install and uninstall are self-only.
      tags: [TeamMcp]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Catalog entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TeamMcpServer" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createTeamMcpServer
      summary: Add a server to the team MCP catalog
      description: >
        Any team member may add. Adding does not run anything on anyone's
        machine — a server only reaches a member once that member installs it.
        Values in `env`/`headers` whose key looks like a secret must use a
        `${KEY}` placeholder resolved at runtime from team env; literals are
        rejected with 422.
      tags: [TeamMcp]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamMcpServerWrite" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMcpServer" }
        "400": { $ref: "#/components/responses/Error" }
        "409":
          description: A server with that name already exists.
          $ref: "#/components/responses/Error"
        "422":
          description: A secret-looking env/header value was a literal instead of a `${KEY}` placeholder.
          $ref: "#/components/responses/Error"
  /v1/teams/{teamId}/mcp-servers/config:
    get:
      operationId: getTeamMcpConfig
      summary: Resolved MCP config for the caller (daemon-facing)
      description: >
        Exactly a Cursor `mcpServers` map containing ONLY the servers the caller
        has installed. This is the byte shape the daemon previously read from
        `.mcp/*.json` on disk, so its parser is unchanged — the daemon writes
        this body straight into its local cache.
      tags: [TeamMcp]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Installed servers, in on-disk config shape.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mcpServers:
                    type: object
                    additionalProperties: { $ref: "#/components/schemas/TeamMcpServerConfigEntry" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/mcp-servers/{name}:
    patch:
      operationId: updateTeamMcpServer
      summary: Edit a catalog entry
      description: Creator or team admin only.
      tags: [TeamMcp]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamMcpServerName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamMcpServerWrite" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMcpServer" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422":
          description: A secret-looking env/header value was a literal instead of a `${KEY}` placeholder.
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteTeamMcpServer
      summary: Remove a catalog entry
      description: Creator or team admin only. Cascades to every member's install record.
      tags: [TeamMcp]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamMcpServerName"
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/mcp-servers/{name}/install:
    put:
      operationId: installTeamMcpServer
      summary: Install a team MCP server for yourself
      description: >
        Self-only, idempotent. Passing an actorId is a 400: installing means
        "run this command on my machine", which is not a decision anyone gets to
        make on another person's behalf.
      tags: [TeamMcp]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamMcpServerName"
      responses:
        "200":
          description: Installed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMcpInstall" }
        "400":
          description: actorId was supplied — installs are self-only.
          $ref: "#/components/responses/Error"
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: uninstallTeamMcpServer
      summary: Uninstall a team MCP server for yourself
      tags: [TeamMcp]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamMcpServerName"
      responses:
        "204": { description: Uninstalled. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/env-secrets:
    get:
      operationId: listTeamEnvSecrets
      summary: List team env secrets (ciphertext only)
      description: >
        Returns the encrypted envelopes as stored. The server holds no key and
        cannot decrypt; description/category/author metadata live inside the
        ciphertext, so only `createdBy`/`updatedBy` (plaintext columns kept for
        authorisation) are readable here.
      tags: [TeamEnvSecrets]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Encrypted team env entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TeamEnvSecret" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/env-secrets/{keyId}:
    put:
      operationId: putTeamEnvSecret
      summary: Create or replace a team env secret
      description: >
        Upsert. The body carries only the client-encrypted envelope. `createdBy`
        is never reassigned on update — it is the delete gate, and letting the
        most recent writer claim it would quietly transfer deletion rights.
      tags: [TeamEnvSecrets]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamEnvKeyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [envelope]
              properties:
                envelope: { $ref: "#/components/schemas/TeamEnvEnvelope" }
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamEnvSecret" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422":
          description: Reserved key id (e.g. tc_api_key, _team_secret.*).
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteTeamEnvSecret
      summary: Delete a team env secret
      description: >
        Creator or team admin only — narrower than update on purpose. Changing a
        value is collaboration; removing a key strips an env var from every
        member's runtime.
      tags: [TeamEnvSecrets]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamEnvKeyId"
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/credits:
    get:
      operationId: getTeamCredits
      tags: [teams]
      summary: Team credit balance and current-period spend
      description: |
        Visible to every team member: an exhausted balance stops their work, so
        they need to be able to see why. The ledger and every mutation are
        owner-only — see `/credits/ledger` and `/credits/top-up`.
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Balance plus the current period's usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamCredits' }
        '403': { description: Not a member of this team }
        '503': { description: ai_gateway_unavailable — the gateway is not configured }

  /v1/teams/{teamId}/credits/usage:
    get:
      operationId: getCreditUsage
      tags: [teams]
      summary: Token and credit usage, grouped by tier and by member
      description: |
        Periods are anchored to Asia/Shanghai, the same boundaries the gateway
        uses to enforce member quotas — a report on a different calendar would
        show "900 of 1000 used" next to a refusal.

        Grouped by the PUBLIC tier (`default` / `pro` / `max`), never by the
        upstream model the request actually landed on.
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - name: range
          in: query
          schema: { type: string, enum: [day, week, month, year], default: month }
        - name: date
          in: query
          description: A yyyy-mm-dd inside the period to report on. Defaults to now.
          schema: { type: string }
      responses:
        '200':
          description: Usage report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditUsageReport' }
        '403': { description: Not a member of this team }

  /v1/teams/{teamId}/credits/ledger:
    get:
      operationId: getCreditLedger
      tags: [teams]
      summary: Top-up history (owner only)
      description: |
        Top-ups, grants, adjustments and refunds. Deliberately excludes `usage`,
        which is one row per request and belongs in the usage report.
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: Ledger entries, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CreditLedgerEntry' }
        '403': { description: Only team owners may read the ledger }

  /v1/teams/{teamId}/credits/top-up:
    post:
      operationId: topUpCredits
      tags: [teams]
      summary: Add credits to a team (owner only)
      description: |
        `idempotencyKey` is required, not optional. A retried delivery must not
        credit twice, and the server cannot invent the key — one generated per
        request is a new key on every retry, which defeats the purpose.

        Returns 200 for a duplicate as well: from the caller's side the credit
        is applied either way, and `applied` says which happened.
      parameters:
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountCredits, idempotencyKey]
              properties:
                amountCredits: { type: integer, minimum: 1 }
                idempotencyKey: { type: string }
                kind:
                  type: string
                  enum: [top_up, grant, adjustment, refund]
                  default: top_up
                note: { type: ["string", "null"] }
      responses:
        '200':
          description: Balance after the operation
          content:
            application/json:
              schema:
                type: object
                required: [teamId, applied, balanceCredits]
                properties:
                  teamId: { type: string }
                  applied:
                    type: boolean
                    description: false when this idempotencyKey was already recorded
                  balanceCredits: { type: integer }
        '403': { description: Only team owners may top up }

  /v1/teams/{teamId}/credits/packages:
    get:
      operationId: listCreditPackages
      tags: [teams]
      summary: Credit packages a team can buy
      description: |
        Resolved from the deployment's Stripe Price allowlist, so amounts and
        the credits each grants live in exactly one place (the Price and its
        `metadata.credits`) rather than being duplicated client-side.

        Readable by any member — the top-up screen shows what is on offer even
        to someone who cannot buy it. Empty when the deployment has no Stripe
        configured, which the client renders as "top-up unavailable" rather
        than as an error.

        `unitAmount` is in Stripe's MINOR units (cents, 分) and is passed
        through unconverted.
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Offered packages
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CreditPackage' }
        '403': { description: Not a member of this team }

  /v1/teams/{teamId}/credits/checkout-session:
    post:
      operationId: createCreditCheckoutSession
      tags: [teams]
      summary: Open a Stripe Checkout Session for a credit package (owner only)
      description: |
        Returns a hosted Checkout URL. Open it in the SYSTEM browser, not an
        embedded webview: 3DS and wallet flows break there, and a payment page
        with no address bar is not something to ask a user to trust.

        Do not block the UI waiting for the credits. They arrive over the
        Stripe webhook (or the reconciliation pass behind it), so the client
        shows "processing" and lets the balance refresh.

        The team is taken from the path, never from the body — the Session is
        the only thing a payment can be attributed by.
      parameters:
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priceId]
              properties:
                priceId:
                  type: string
                  description: Must be one of the ids from `/credits/packages`
      responses:
        '200':
          description: Hosted Checkout Session
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, url]
                properties:
                  sessionId: { type: string }
                  url: { type: string, format: uri }
        '400': { description: priceId missing or not an offered package }
        '403': { description: Only team owners may buy credits }
        '503': { description: Stripe is not configured for this deployment }

  /v1/teams/{teamId}/quotas:
    get:
      operationId: getMemberQuotas
      tags: [teams]
      summary: Period and per-member credit limits
      description: |
        `period` is TEAM-level, not per-member: members on different periods
        would make "used this period" incomparable across the roster.

        A member with no entry falls back to `defaultLimitCredits`. An actor of
        type `agent` with no entry is unlimited — cron runs unattended, and
        stalling it on a limit nobody is awake to raise turns a spend cap into
        an outage.
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Quota settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamQuotas' }
    put:
      operationId: setMemberQuotas
      tags: [teams]
      summary: Update period and member limits (owner only)
      parameters:
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamQuotas' }
      responses:
        '200': { description: Updated }
        '403': { description: Only team owners may change limits }

  /v1/teams/{teamId}/actors:
    get:
      operationId: listTeamActors
      summary: List team actors
      description: >-
        Members, plus the agents the caller may see (team-visible ones and their
        own personal ones). Retired agents — `agentStatus` of `disabled` or
        `archived` — are omitted. Look them up by id (`POST /v1/actors/by-ids`,
        `GET /v1/actors/{actorId}`) to resolve the author of an older message;
        those readers are deliberately unfiltered.
      tags: [Actors]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: kind
          in: query
          schema:
            type: string
            enum: [agent, user, external]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        "200":
          description: Actor page.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActorPage"
        "401":
          $ref: "#/components/responses/Error"
  /v1/actors/{actorId}:
    get:
      operationId: getActor
      summary: Get single actor
      tags: [Actors]
      parameters:
        - name: actorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Actor.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Actor"
        "404":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/actors/external:
    post:
      operationId: upsertExternalActor
      summary: Upsert external actor
      tags: [Actors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamId, source, sourceId, displayName]
              properties:
                teamId:
                  type: string
                  format: uuid
                source:
                  type: string
                sourceId:
                  type: string
                displayName:
                  type: string
      responses:
        "200":
          description: Upserted actor.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [actorId]
                properties:
                  actorId:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/teams/{teamId}/agents/connected:
    get:
      operationId: listConnectedAgents
      summary: List connected agents
      description: >-
        Team-visible agents plus the caller's own personal ones. Retired agents
        (`status` of `disabled` or `archived`) are omitted, matching
        `GET /v1/teams/{teamId}/actors` and the device-binding endpoints, which
        have always required an active agent.
      tags: [Actors]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Connected agents.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConnectedAgent"
        "401":
          $ref: "#/components/responses/Error"
  /v1/teams/{teamId}/agents/for-device:
    get:
      operationId: findAgentForDevice
      summary: Look up this machine's agent in this team
      tags: [Actors]
      description: >-
        Read-only companion to `ensure-for-device`. The desktop calls this first:
        a machine that already has an agent here is bound with no interaction,
        and only a machine that does not gets to interrupt the user for a name.


        Owner-scoped — it only ever reports an agent the caller owns, so one
        member cannot probe whether another member's machine is in the team.
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: deviceId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: The agent for this machine, or nulls when it has none.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [agentId, displayName]
                properties:
                  agentId:
                    type:
                      - string
                      - "null"
                    format: uuid
                  displayName:
                    type:
                      - string
                      - "null"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/teams/{teamId}/agents/ensure-for-device:
    post:
      operationId: ensureAgentForDevice
      summary: Ensure this machine has an agent in this team
      tags: [Actors]
      description: >-
        Idempotent per (team, device): returns the caller-owned agent already
        bound to `deviceId` in this team, or creates one, and mints a one-shot
        invite for the local daemon to claim. Replaces the create/bind/reset
        wizard — the desktop calls this after login instead of asking.


        An agent bound to `deviceId` but owned by another account counts as
        absent, so a shared machine gets one agent per account and neither can
        take over the other's. Created agents are `personal`; publishing one to
        the team is a separate `PATCH /v1/agents/{agentActorId}`.


        `deviceId` is not readable back through the API — it never appears in
        `ConnectedAgent`, so one member cannot enumerate another's machines.
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, displayName]
              properties:
                deviceId:
                  type: string
                  minLength: 1
                  description: >-
                    Stable per-machine id owned by the daemon
                    (`~/.amuxd/device-id`), surfaced to the app by the daemon's
                    local `GET /v1/info`. Not the webview's
                    telemetry install id, which resets with local storage.
                displayName:
                  type: string
                  minLength: 1
                  description: >-
                    Name for a newly created agent — what the user typed when this
                    machine was first bound, or the hostname if they skipped.
                    **Create-only**: ignored when an agent already exists, so a
                    rebind never overwrites a later rename.
      responses:
        "200":
          description: The agent for this machine, plus an invite to claim it.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [agentId, token, created]
                properties:
                  agentId:
                    type: string
                    format: uuid
                  token:
                    type: string
                    description: One-shot agent invite, 600s TTL.
                  expiresAt:
                    type:
                      - string
                      - "null"
                    format: date-time
                  created:
                    type: boolean
                    description: >-
                      True when the agent was just created, false when an
                      existing one was re-bound. Drives the progress copy only.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
