              required: [marketplaceSlug]
              properties:
                marketplaceSlug: { type: string }
                slug: { $ref: "#/components/schemas/TeamSkillSlug" }
                version: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Team skill created from catalog.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamSkill" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/skills/{slug}/detach:
    post:
      operationId: detachMarketplaceSkill
      summary: Stop following marketplace updates for an adopted skill
      tags: [Marketplace, TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamSkillSlug"
      responses:
        "200":
          description: Detached skill.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamSkill" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/admin/marketplace/skill-blobs/prepare:
    post:
      operationId: prepareMarketplaceSkillBlob
      summary: Prepare a marketplace package upload (admin secret)
      tags: [MarketplaceAdmin]
      parameters:
        - name: x-webhook-secret
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentHash, size]
              properties:
                contentHash: { type: string, pattern: '^[a-f0-9]{64}$' }
                size: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Upload instructions.
        "401": { $ref: "#/components/responses/Error" }
  /v1/admin/marketplace/skill-blobs/complete:
    post:
      operationId: completeMarketplaceSkillBlob
      summary: Verify a marketplace package blob (admin secret)
      tags: [MarketplaceAdmin]
      parameters:
        - name: x-webhook-secret
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentHash, size]
              properties:
                contentHash: { type: string }
                size: { type: integer }
      responses:
        "200":
          description: Verified.
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/admin/marketplace/skills:
    post:
      operationId: createMarketplaceSkill
      summary: Create a marketplace catalog item (admin secret)
      tags: [MarketplaceAdmin]
      parameters:
        - name: x-webhook-secret
          in: header
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Created.
        "401": { $ref: "#/components/responses/Error" }
  /v1/admin/marketplace/skills/{slug}/versions:
    post:
      operationId: createMarketplaceSkillVersion
      summary: Upload a marketplace version without promoting (admin secret)
      tags: [MarketplaceAdmin]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: x-webhook-secret
          in: header
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Version row created (unpublished).
        "401": { $ref: "#/components/responses/Error" }
  /v1/admin/marketplace/skills/{slug}/versions/{version}/promote:
    post:
      operationId: promoteMarketplaceSkillVersion
      summary: Promote a marketplace version to latest (admin secret)
      tags: [MarketplaceAdmin]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: x-webhook-secret
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Promoted.
        "401": { $ref: "#/components/responses/Error" }
  /v1/admin/marketplace/skills/{slug}/versions/{version}/revert:
    post:
      operationId: revertMarketplaceSkillVersion
      summary: Roll forward a revert of an earlier marketplace version (admin secret)
      tags: [MarketplaceAdmin]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: x-webhook-secret
          in: header
          required: true
          schema: { type: string }
      responses:
        "201":
          description: New version published as revert.
        "401": { $ref: "#/components/responses/Error" }
  /v1/admin/marketplace/skills/{slug}:
    patch:
      operationId: updateMarketplaceSkill
      summary: Patch marketplace metadata or delist (admin secret)
      tags: [MarketplaceAdmin]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: x-webhook-secret
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated.
        "401": { $ref: "#/components/responses/Error" }
  /v1/admin/marketplace/align:
    post:
      operationId: alignMarketplaceSubscriptions
      summary: Eagerly align all subscribed teams (optional latency cut)
      tags: [MarketplaceAdmin]
      parameters:
        - name: x-webhook-secret
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Align count.
        "401": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/skills:
    get:
      operationId: listTeamSkills
      summary: List the team skills registry
      description: >
        Full registry, not just what the caller installed. `actorId` selects
        whose install state decorates each row — omit for the caller, pass a
        team agent's actor id to inspect that agent.
      tags: [TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [draft, published, deprecated] }
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/TeamSkillCategory" }
      responses:
        "200":
          description: Registry entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TeamSkill" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: publishTeamSkill
      summary: Publish a skill (version 1)
      description: >
        The publish gate. summary / category / whenToUse / whenNotToUse /
        changelog are all required — the registry exists so those stop living
        inside one free-text description. The package zip is uploaded
        separately via the amuxc blob path; only its contentHash arrives here.
      tags: [TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamSkillPublish" }
      responses:
        "201":
          description: Published.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamSkill" }
        "400": { $ref: "#/components/responses/Error" }
        "409":
          description: A skill with that slug already exists — publish a version instead.
          $ref: "#/components/responses/Error"
  /v1/teams/{teamId}/skill-blobs/prepare:
    post:
      operationId: prepareTeamSkillBlob
      summary: Prepare a skill package blob upload
      description: >
        Upserts an amuxc_blobs placeholder and returns a short-lived
        presigned PUT URL when the object is not already in OSS. Does not
        create an amuxc_files sync path — skill packages are content-addressed
        only.
      tags: [TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentHash, size]
              properties:
                contentHash: { type: string, description: sha256 hex of the zip }
                size: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Upload instructions for the package blob.
          content:
            application/json:
              schema:
                type: object
                required: [contentHash, size, ossKey, requiresUpload]
                properties:
                  contentHash: { type: string }
                  size: { type: integer }
                  ossKey: { type: string }
                  requiresUpload: { type: boolean }
                  presignedPut: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/skill-blobs/complete:
    post:
      operationId: completeTeamSkillBlob
      summary: Verify and mark a skill package blob uploaded
      description: >
        After the client PUTs to the presigned URL, HEAD-checks OSS and marks
        the amuxc_blobs row verified so download can resolve it.
      tags: [TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentHash, size]
              properties:
                contentHash: { type: string }
                size: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Blob verified.
          content:
            application/json:
              schema:
                type: object
                required: [contentHash, size, ossKey]
                properties:
                  contentHash: { type: string }
                  size: { type: integer }
                  ossKey: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/skill-installs:
    get:
      operationId: listTeamSkillInstalls
      summary: What a given actor should have installed
      description: >
        The reconcile list. A daemon hosting a team agent pulls the full set and
        diffs it against its local lockfile — full set rather than a delta,
        because notifications drop and daemons go offline.
      tags: [TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Install records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TeamSkillInstall" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/skills/{slug}:
    get:
      operationId: getTeamSkill
      summary: Skill detail with version history
      tags: [TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamSkillSlug"
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Skill detail.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TeamSkill"
                  - type: object
                    properties:
                      versions:
                        type: array
                        items: { $ref: "#/components/schemas/TeamSkillVersion" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateTeamSkill
      summary: Edit metadata, transfer owner, deprecate
      tags: [TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamSkillSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                summary: { type: string, maxLength: 200 }
                category: { $ref: "#/components/schemas/TeamSkillCategory" }
                whenToUse: { type: string }
                whenNotToUse: { type: string }
                requires: { type: [object, "null"] }
                ownerActorId: { type: string, format: uuid }
                status: { type: string, enum: [draft, published, deprecated] }
                supersededBy:
                  type: [string, "null"]
                  description: When deprecating, the slug that replaces this one.
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamSkill" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteTeamSkill
      summary: Remove a skill from the registry
      tags: [TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamSkillSlug"
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/skills/{slug}/versions:
    post:
      operationId: publishTeamSkillVersion
      summary: Publish a new version
      description: >
        Metadata fields are optional here and inherit the skill's current
        values, so a content-only change stays a one-liner. Whatever is
        effective at publish time is snapshotted onto the version row, so
        somebody sitting on v1 keeps reading v1's notes.
      tags: [TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamSkillSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentHash, changelog]
              properties:
                contentHash: { type: string }
                size: { type: integer }
                changelog: { type: string }
                summary: { type: string, maxLength: 200 }
                category: { $ref: "#/components/schemas/TeamSkillCategory" }
                whenToUse: { type: string }
                whenNotToUse: { type: string }
                requires: { type: [object, "null"] }
      responses:
        "201":
          description: Version published.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamSkillVersion" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/skills/{slug}/versions/{version}:
    get:
      operationId: getTeamSkillVersion
      summary: Resolve a version's package blob
      tags: [TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamSkillSlug"
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Version record, including the contentHash to fetch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamSkillVersion" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/skills/{slug}/versions/{version}/revert:
    post:
      operationId: revertTeamSkillVersion
      summary: Re-publish an earlier version as the new latest
      description: >
        The undo for a bad publish. Installs auto-follow `latestVersion`, so a
        broken version reaches every member within one reconcile tick; without
        this the only remedy is for the author to reconstruct the old package by
        hand.


        Note what this does *not* do: `latestVersion` never moves backwards.
        Rolling it back would leave members whose `installedVersion` exceeds it,
        and "is there an update" stops having an answer. The revert publishes
        `latestVersion + 1` carrying the target version's content and its
        metadata snapshot.
      tags: [TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamSkillSlug"
        - name: version
          in: path
          required: true
          description: The version whose content should become the new latest.
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                changelog:
                  type: string
                  description: Defaults to "Reverted to v{version}".
      responses:
        "201":
          description: The newly published version carrying the old content.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamSkillVersion" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: That version is already the latest.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/teams/{teamId}/skills/{slug}/install:
    put:
      operationId: installTeamSkill
      summary: Record an install
      description: >
        Three gates. Installing for yourself is always allowed. Installing onto
        a `visibility=team` agent actor requires a team admin. Installing onto
        another member's actor is always refused — an admin owns the team's
        shared agents, not a teammate's personal setup.
      tags: [TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamSkillSlug"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                actorId:
                  type: string
                  format: uuid
                  description: Defaults to the caller's actor in this team.
                version: { type: integer, minimum: 1 }
                scope: { type: string, enum: [global, workspace], default: global }
                workspaceId: { type: string, format: uuid }
      responses:
        "200":
          description: Install recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamSkillInstall" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      operationId: uninstallTeamSkill
      summary: Record an uninstall
      tags: [TeamSkills]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamSkillSlug"
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Uninstalled. }
        "403": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/mcp-servers:
    get:
      operationId: listTeamMcpServers
      summary: List the team MCP catalog
      description: >
        Full catalog, decorated with an actor's `installed` flag. `actorId`
        defaults to the caller; pass a team agent's actor id to inspect what
        that agent has installed. Reading another actor's install state is
        allowed, writing it is not — install and uninstall are self-only.
      tags: [TeamMcp]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Catalog entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TeamMcpServer" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createTeamMcpServer
      summary: Add a server to the team MCP catalog
      description: >
        Any team member may add. Adding does not run anything on anyone's
        machine — a server only reaches a member once that member installs it.
        Values in `env`/`headers` whose key looks like a secret must use a
        `${KEY}` placeholder resolved at runtime from team env; literals are
        rejected with 422.
      tags: [TeamMcp]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamMcpServerWrite" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMcpServer" }
        "400": { $ref: "#/components/responses/Error" }
        "409":
          description: A server with that name already exists.
          $ref: "#/components/responses/Error"
        "422":
          description: A secret-looking env/header value was a literal instead of a `${KEY}` placeholder.
          $ref: "#/components/responses/Error"
  /v1/teams/{teamId}/mcp-servers/config:
    get:
      operationId: getTeamMcpConfig
      summary: Resolved MCP config for the caller (daemon-facing)
      description: >
        Exactly a Cursor `mcpServers` map containing ONLY the servers the caller
        has installed. This is the byte shape the daemon previously read from
        `.mcp/*.json` on disk, so its parser is unchanged — the daemon writes
        this body straight into its local cache.
      tags: [TeamMcp]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Installed servers, in on-disk config shape.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mcpServers:
                    type: object
                    additionalProperties: { $ref: "#/components/schemas/TeamMcpServerConfigEntry" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/mcp-servers/{name}:
    patch:
      operationId: updateTeamMcpServer
      summary: Edit a catalog entry
      description: Creator or team admin only.
      tags: [TeamMcp]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamMcpServerName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamMcpServerWrite" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMcpServer" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422":
          description: A secret-looking env/header value was a literal instead of a `${KEY}` placeholder.
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteTeamMcpServer
      summary: Remove a catalog entry
      description: Creator or team admin only. Cascades to every member's install record.
      tags: [TeamMcp]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamMcpServerName"
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/mcp-servers/{name}/install:
    put:
      operationId: installTeamMcpServer
      summary: Install a team MCP server for yourself
      description: >
        Self-only, idempotent. Passing an actorId is a 400: installing means
        "run this command on my machine", which is not a decision anyone gets to
        make on another person's behalf.
      tags: [TeamMcp]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamMcpServerName"
      responses:
        "200":
          description: Installed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMcpInstall" }
        "400":
          description: actorId was supplied — installs are self-only.
          $ref: "#/components/responses/Error"
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: uninstallTeamMcpServer
      summary: Uninstall a team MCP server for yourself
      tags: [TeamMcp]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamMcpServerName"
      responses:
        "204": { description: Uninstalled. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/env-secrets:
    get:
      operationId: listTeamEnvSecrets
      summary: List team env secrets (ciphertext only)
      description: >
        Returns the encrypted envelopes as stored. The server holds no key and
        cannot decrypt; description/category/author metadata live inside the
        ciphertext, so only `createdBy`/`updatedBy` (plaintext columns kept for
        authorisation) are readable here.
      tags: [TeamEnvSecrets]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Encrypted team env entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TeamEnvSecret" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/env-secrets/{keyId}:
    put:
      operationId: putTeamEnvSecret
      summary: Create or replace a team env secret
      description: >
        Upsert. The body carries only the client-encrypted envelope. `createdBy`
        is never reassigned on update — it is the delete gate, and letting the
        most recent writer claim it would quietly transfer deletion rights.
      tags: [TeamEnvSecrets]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamEnvKeyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [envelope]
              properties:
                envelope: { $ref: "#/components/schemas/TeamEnvEnvelope" }
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamEnvSecret" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422":
          description: Reserved key id (e.g. tc_api_key, _team_secret.*).
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteTeamEnvSecret
      summary: Delete a team env secret
      description: >
        Creator or team admin only — narrower than update on purpose. Changing a
        value is collaboration; removing a key strips an env var from every
        member's runtime.
      tags: [TeamEnvSecrets]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/TeamEnvKeyId"
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
