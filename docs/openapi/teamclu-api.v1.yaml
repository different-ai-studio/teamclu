            - "null"
          format: uuid
        enabled:
          type: boolean
        dnd_start_min:
          type:
            - integer
            - "null"
          description: Quiet-hours start as local minute-of-day (0..1439).
        dnd_end_min:
          type:
            - integer
            - "null"
          description: Quiet-hours end as local minute-of-day (0..1439).
        dnd_tz:
          type:
            - string
