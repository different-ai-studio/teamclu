        "200":
          description: Matching workspaces
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: [string, "null"] }
                        path: { type: [string, "null"] }
        "400":
          $ref: "#/components/responses/Error"
  /v1/teams/{teamId}/shortcut-role-bindings:
    get:
      operationId: listShortcutRoleBindings
      summary: List shortcut resource → role bindings for a team
      tags: [Shortcuts]
      parameters:
        - name: teamId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Role bindings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        resource_id: { type: string }
                        permission_roles:
                          type: array
                          items:
                            type: object
                            properties:
                              role_id: { type: string }
        "400":
          $ref: "#/components/responses/Error"
  /v1/actors/by-ids:
    post:
      operationId: listActorDirectoryByIds
      summary: Look up actor directory entries by id list
      tags: [Actors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actorIds]
              properties:
                actorIds:
                  type: array
                  items: { type: string }
                teamId:
                  type: [string, "null"]
      responses:
        "200":
          description: Matching actor directory entries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { type: object }
        "400":
          $ref: "#/components/responses/Error"
  /v1/actors/access/{accessId}:
    delete:
      operationId: removeAgentAccessById
      summary: Remove an agent_member_access row by id
      tags: [Actors]
      parameters:
        - name: accessId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Error"
  /v1/teams/{teamId}/actors/{actorId}:
    delete:
      operationId: removeTeamActorScoped
      summary: Remove team actor (teamId + actorId path)
      description: |
        Same as DELETE /v1/teams/{teamId}/members/{actorId}. Personal agents
        require the owning member; team agents require team owner/admin.
      tags: [Teams]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: actorId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/teams/{teamId}/workspace-git-config:
    get:
      operationId: loadTeamWorkspaceGitConfig
      summary: Load team workspace git/AI gateway config
      tags: [Workspaces]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Config row or null
          content:
            application/json:
              schema:
                type: [object, "null"]
                properties:
                  team_id: { type: string }
                  workspace_path: { type: [string, "null"] }
                  git_url: { type: [string, "null"] }
                  git_branch: { type: [string, "null"] }
                  git_token: { type: [string, "null"] }
                  ai_gateway_endpoint: { type: [string, "null"] }
                  enabled: { type: boolean }
                  metadata: { type: [object, "null"] }
                  updated_at: { type: [string, "null"] }
    put:
      operationId: saveTeamWorkspaceGitConfig
      summary: Upsert team workspace git/AI gateway config
      tags: [Workspaces]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace_path: { type: [string, "null"] }
                git_url: { type: [string, "null"] }
                git_branch: { type: [string, "null"] }
                git_token: { type: [string, "null"] }
                ai_gateway_endpoint: { type: [string, "null"] }
                enabled: { type: boolean }
                metadata: { type: [object, "null"] }
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/signin-otp:
    post:
      operationId: signInOtp
      summary: Proxy to Supabase GoTrue /auth/v1/otp (email or SMS OTP)
      description: >
        Provide either `email` or `phone` (E.164, e.g. +8613800138000). For
        phone, an SMS code is sent; pass `options.channel` to override the
        default "sms" delivery channel.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Exactly one of email or phone must be provided.
              properties:
                email: { type: string, format: email }
                phone: { type: string, description: "E.164 phone, e.g. +8613800138000" }
                options: { type: object }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /v1/auth/verify-otp:
    post:
      operationId: verifyOtp
      summary: Proxy to Supabase GoTrue /auth/v1/verify
      description: >
        Provide either `email` or `phone` (matching the signin-otp request)
        plus `token`. `type` defaults to "email"; phone verification uses "sms".
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              description: Exactly one of email or phone must be provided.
              properties:
                email: { type: string, format: email }
                phone: { type: string, description: "E.164 phone, e.g. +8613800138000" }
                token: { type: string }
                type: { type: string, default: email, enum: [email, sms, signup, email_change, phone_change, recovery] }
      responses:
        "200":
          description: GoTrue session payload
          content:
            application/json:
              schema: { type: object }
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/signout:
    post:
      operationId: signOut
      summary: Proxy to Supabase GoTrue /auth/v1/logout
      tags: [Auth]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "401":
          $ref: "#/components/responses/Error"
  /v1/auth/user:
    patch:
      operationId: updateAuthUser
      summary: Proxy to Supabase GoTrue PUT /auth/v1/user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { type: object }
        "401":
          $ref: "#/components/responses/Error"
  /v1/auth/signin-idtoken:
    post:
      operationId: signInWithIdToken
      summary: Native OIDC sign-in / identity link (Apple, Google) via GoTrue id_token grant
      description: |
        Exchanges a provider ID token for a Supabase session. When called with
        a Bearer access token, GoTrue links the OIDC identity to the current
        user instead of minting a new one — powering the anonymous → Apple
        upgrade flow.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, idToken]
              properties:
                provider:
                  type: string
                  enum: [apple, google]
                idToken:
                  type: string
                nonce:
                  type: [string, "null"]
      responses:
        "200":
          description: GoTrue session
          content:
            application/json:
              schema: { type: object }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/auth/signin-password:
    post:
      operationId: signInWithPassword
      summary: Proxy to Supabase GoTrue password grant
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: GoTrue session payload
          content:
            application/json:
              schema: { type: object }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/auth/signup:
    post:
      operationId: signUp
      summary: Proxy to Supabase GoTrue /signup with email + password
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: GoTrue session payload (or confirmation pending)
          content:
            application/json:
              schema: { type: object }
        "400":
          $ref: "#/components/responses/Error"
  "/v1/auth/oauth/{provider}/authorize":
    get:
      operationId: oauthAuthorize
      summary: Stateless PKCE OAuth authorize redirect
      description: |
        Builds a GoTrue authorize URL for the given provider and returns a 302
        redirect. The client supplies its own PKCE `code_challenge`; FC holds no
        state. GoTrue redirects to `redirect` (app scheme URL) with a single-use
        authorization code.
      tags: [Auth]
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, example: google }
        - name: redirect
          in: query
          required: true
          schema: { type: string, example: "teamclu://auth-callback" }
        - name: code_challenge
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirect to GoTrue authorize URL
          headers:
            Location:
              schema: { type: string }
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/oauth/exchange:
    post:
      operationId: oauthExchangePkce
      summary: Exchange PKCE authorization code for session tokens
      description: |
        Forwards `{ auth_code, code_verifier }` to GoTrue's
        `POST /auth/v1/token?grant_type=pkce` and returns the session payload.
        FC holds no state — the client supplies the `codeVerifier` it generated
        before the authorize redirect.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, codeVerifier]
              properties:
                code: { type: string }
                codeVerifier: { type: string }
      responses:
        "200":
          description: GoTrue session payload
          content:
            application/json:
              schema: { type: object }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/apps:
    get:
      operationId: listApps
      summary: List the apps visible to the caller in a team
      tags: [Apps]
      parameters:
        - name: teamId
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: Visible apps, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/App" }
        "400":
          $ref: "#/components/responses/Error"
    post:
      operationId: createApp
      summary: Create an app (provisions its 1:1 workspace)
      tags: [Apps]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamId, name, type]
              properties:
                teamId: { type: string }
                name: { type: string }
                type:
                  $ref: "#/components/schemas/AppType"
                visibility: { type: string, enum: [personal, team], default: personal }
                gitRemoteUrl:
                  type: [string, "null"]
                  description: >-
                    Optional repository to import. When given, the local daemon
                    clones it into the app's checkout and writes no starter
                    template; `type` then only decides how the app deploys.
                    Must be an http(s), ssh or git:// address, or the scp-like
                    `git@host:owner/repo.git` form — anything else is rejected
                    with 400, since git reads some other forms as commands to
                    run rather than as addresses.
                  example: https://github.com/owner/repo.git
      responses:
        "201":
          description: |
            The created app. `provisionStatus` is `repo_created` once the
            the workspace exists, or `error` when provisioning failed —
            the row is created either way.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "400":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}:
    get:
      operationId: getApp
      summary: Get one app
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: The app.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateApp
      summary: Update an app (creator only)
      description: |
        Renames, changes visibility, or reports a lifecycle status the client
        owns. `provisionStatus` carries the repo/seed lifecycle the desktop
        drives via the local daemon; `fcStatus` carries the deploy lifecycle —
        the desktop reports `deploy_error` when the daemon build leg fails,
        since nothing server-side can observe that. Illegal transitions are
        rejected.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                visibility: { type: string, enum: [personal, team] }
                provisionStatus: { type: string, enum: [pending, repo_created, seeding, ready, error] }
                fcStatus: { $ref: "#/components/schemas/AppFcStatus" }
                deployError:
                  type: string
                  description: "Reason stored alongside `fcStatus: deploy_error`."
                authMode:
                  $ref: "#/components/schemas/AppAuthMode"
                  description: >-
                    How the deployed app authenticates end users. Side effects
                    (GoTrue OAuth client registration, secrets) are applied in
                    Task 7; the field is accepted here for PATCH updates.
      responses:
        "200":
          description: The updated app.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteApp
      summary: Delete an app (admin required)
      description: |
        Requires `admin` permission (the creator is treated as admin). Tears down
        the FC function, HTTP trigger, OSS artifact, and GoTrue OAuth client;
        revokes Gitea deploy keys and archives the repo under a `deleted-` prefix.
        Postgres schema, local workdirs, and linked sessions (app_id nulled) are
        kept. The orphaned workspace row is archived with the archived repo URL.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: App deleted.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, enum: [true] }
        "404":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/deploy:
    post:
      operationId: deployApp
      summary: Start a deploy — mint the artifact upload handle (admin required)
      description: |
        Requires `provisionStatus: ready` and `admin` permission on the app
        (the creator is treated as admin). Members with `prompt` or `view`
        receive 404. Moves `fcStatus` to `awaiting_build` and returns a
        short-lived presigned OSS PUT URL. The caller then kicks its local
        daemon to build the app and upload the artifact there, and calls
        `/deploy/finalize` once the upload succeeds.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                gitCommitSha:
                  type: string
                  pattern: "^[0-9a-f]{7,40}$"
                  description: >-
                    Git commit SHA (7–40 hex) being deployed. Required for an
                    app whose `gitAuthKind` is `gitea_deploy_key`; omitted for
                    one imported from an external remote, whose deploy builds
                    the local checkout as it sits and has no forge commit to
                    pin itself to.
      responses:
        "202":
          description: Deploy started.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/App"
                  - type: object
                    required: [ossObjectName, presignedPut, deployToken]
                    properties:
                      ossObjectName: { type: string }
                      presignedPut:
                        type: string
                        description: Short-lived presigned PUT URL for the build artifact. Secret — never log it.
                      deployToken:
                        type: string
                        format: uuid
                        description: Short-lived bearer required by `/deploy/finalize`. Secret — never log it.
                      gitCommitSha:
                        type: [string, "null"]
                        description: >-
                          Echo of the requested commit SHA for this deploy
                          attempt; null when none was supplied.
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/deploy/finalize:
    post:
      operationId: finalizeAppDeploy
      summary: Finish a deploy — provision the schema, publish the code, return the live URL
      description: |
        Requires `admin` permission on the app (the creator is treated as
        admin); members with `prompt` or `view` receive 404. Provisions
        (idempotently) the app's Postgres schema and scoped role, points the
        FC function at the uploaded artifact with a matching `DATABASE_URL`,
        ensures the HTTP trigger, and stores `fcEndpoint` with `fcStatus: live`.
        Failures land on `deploy_error` with the reason in `provisionError`;
        retry by calling `/deploy` again.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deployToken]
              properties:
                gitCommitSha:
                  type: string
                  pattern: "^[0-9a-f]{7,40}$"
                  description: >-
                    Git commit SHA of the uploaded artifact. Omitted for an app
                    with no forge repo — see the same field on `/deploy`.
                deployToken:
                  type: string
                  format: uuid
                  description: Bearer returned by `/deploy` for this attempt. Secret — never log it.
      responses:
        "200":
          description: The app, now live.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/sessions:
    get:
      operationId: listAppSessions
      summary: List the sessions linked to an app
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Sessions linked to the app (empty when it is not visible to the caller).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, teamId, title, mode, createdAt, updatedAt]
                      properties:
                        id: { type: string }
                        teamId: { type: string }
                        title: { type: string }
                        mode: { type: string }
                        lastMessageAt: { type: [string, "null"], format: date-time }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
        "400":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/git-credential:
    get:
      operationId: getAppGitCredential
      summary: Mint a short-lived Gitea deploy key for the app repo
      description: |
        Generates an ed25519 deploy key, registers the public half on the app's
        Gitea repo (`tc-app-{appId}`), and returns the private key for one-time
        use by the local daemon. Requires `prompt` or `admin` permission on the
        app (the creator is treated as admin); `view` receives 404. The private
        key is never persisted, and is in OpenSSH format (`BEGIN OPENSSH PRIVATE
        KEY`) — OpenSSH cannot load an ed25519 key from a PKCS#8 block. Secret
        — never log the response body.

        Each call also revokes the keys it minted more than 15 minutes ago, so
        `expiresAt` bounds how long a handed-out credential stays usable.

        404 when the app is not Gitea-managed (`gitAuthKind` is null): there is
        no repo of ours to register a key on.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: JIT deploy-key credential for git push/pull.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppGitCredential" }
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/git-head:
    get:
      operationId: getAppGitHead
      summary: Default-branch HEAD commit on the app's Gitea repo
      description: |
        Reads the default branch SHA via the server-side Gitea bot token.
        Visible to the same callers as `getApp`. 404 when the app is not
        Gitea-managed (`gitAuthKind` is null).
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Default branch HEAD.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppGitHead" }
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/membership:
    get:
      operationId: getAppMembership
      summary: Whether the caller is a member of the app's team
      description: |
        Used by deployed apps with `authMode: platform` to gate login: the app
        holds the end-user's bearer token (not a service role) and asks whether
        that user belongs to the team that owns this app. Returns `{ member:
        boolean }` only — no team metadata. Route handler is implemented in
        Task 8; this documents the contract.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Membership verdict for the authenticated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppMembership" }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/access:
    get:
      operationId: listAppAccess
      summary: List per-member access grants for an app
      description: |
        Returns all rows in `app_member_access` for the app. Only the app
        creator or a member with `admin` permission may call this; others
        receive 404 (same as other app mutations — do not leak existence).
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Access grants for team members on this app.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppMemberAccessRow"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/access/{memberId}:
    put:
      operationId: setAppAccess
      summary: Grant or update a member's app permission
      description: |
        Upserts `app_member_access` for `(appId, memberId)`. `permissionLevel`
        must be `view`, `prompt`, or `admin`. Only the app creator or a member
        with existing `admin` on this app may call; others receive 404.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AppAccessMemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissionLevel]
              properties:
                permissionLevel:
                  $ref: "#/components/schemas/AppPermissionLevel"
      responses:
        "200":
          description: The upserted access row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppMemberAccessRow"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeAppAccess
      summary: Revoke a member's app permission
      description: |
        Deletes the `app_member_access` row for `(appId, memberId)`. Only the
        app creator or a member with `admin` on this app may call; others
        receive 404.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AppAccessMemberId"
      responses:
        "200":
          description: Row removed (or was already absent).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/data/tables:
    get:
      operationId: listAppDataTables
      summary: List the tables in this app's own database
      description: |
        Introspects the app's Postgres schema and returns every base table with
        its columns and primary key. Requires `prompt` or `admin` on the app;
        `view` (and non-members) receive 404 so the tier does not learn the
        feature exists.

        An empty `items` is the normal state right after the first deploy: the
        provisioner creates the schema, the application creates its tables the
        first time it is requested. It is not an error.

        Only `data_app`-shaped apps have a database at all, and only after a
        successful deploy. Both exclusions answer 409 with distinguishable
        codes (`app_has_no_database`, `app_not_deployed`) rather than 404,
        because the control panel shows a different explanation for each.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Tables in the app's schema.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppDataTable"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/data/tables/{table}/rows:
    get:
      operationId: readAppDataRows
      summary: Read a page of rows from one table
      description: |
        Keyset pagination over the table's primary key — never `OFFSET`, which
        on a production table means reading every row that was skipped. Pass the
        previous page's `nextCursor` as `after`; a null `nextCursor` means this
        was the last page.

        There is deliberately no total row count: `count(*)` is a full scan on a
        large table and would hit the 5s statement timeout before answering.

        `limit` is capped server-side at 100 regardless of what is requested.
        Tables with no primary key fall back to offset paging and are read-only.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AppDataTable"
        - name: after
          in: query
          required: false
          description: Opaque cursor from the previous page's `nextCursor`.
          schema: { type: string }
        - name: direction
          in: query
          required: false
          description: Order along the primary key. Sorting by an arbitrary column is not offered — it would make the cursor unsound.
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: filterColumn
          in: query
          required: false
          description: Column to filter on. Must exist in the table; validated against the catalog, never interpolated.
          schema: { type: string }
        - name: filterOp
          in: query
          required: false
          schema: { type: string, enum: [eq, contains, isNull, notNull] }
        - name: filterValue
          in: query
          required: false
          description: Bound as a parameter. Ignored by `isNull` / `notNull`.
          schema: { type: string }
      responses:
        "200":
          description: One page of rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppDataRowsPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
  /v1/apps/{appId}/data/tables/{table}/rows/{rowKey}:
    patch:
      operationId: updateAppDataRow
      summary: Update one row
      description: |
        Requires `admin` on the app; `prompt` receives 403. Updates exactly one
        row, addressed only by its primary key — never by any other column the
        caller can see. A statement that matches anything other than one row
        aborts the transaction.

        The response carries the row **re-read after the write**, so triggers
        and column defaults that rewrote the submitted value are visible.
        Primary-key columns cannot be edited here: the read-back is by key, so
        changing it would report the row as having vanished.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AppDataTable"
        - $ref: "#/components/parameters/AppDataRowKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patch]
              properties:
                patch:
                  type: object
                  additionalProperties: true
                  description: Column name → new value. Every name is checked against the table's catalog entry.
      responses:
        "200":
          description: The row as the database stored it.
          content:
            application/json:
              schema:
                type: object
                required: [row]
                properties:
                  row:
                    type: object
                    additionalProperties: true
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAppDataRow
      summary: Delete one row
      description: |
        Requires `admin`. Deletes exactly one row by primary key; a statement
        matching zero or several rows aborts the transaction. There is no bulk
        delete — this is production data and a table UI makes multi-select
        mistakes too easy.
      tags: [Apps]
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AppDataTable"
        - $ref: "#/components/parameters/AppDataRowKey"
      responses:
        "200":
          description: Row deleted.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  headers:
    RequestId:
      schema:
        type: string
  parameters:
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
    TeamSkillSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{1,63}$"
    TeamMcpServerName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$"
    TeamEnvKeyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9_]{1,64}$"
    InviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    AppId:
      name: appId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AppAccessMemberId:
      name: memberId
      in: path
      required: true
      description: Team member actor id receiving the grant.
      schema:
        type: string
        format: uuid
    AppDataTable:
      name: table
      in: path
      required: true
      description: >-
        Table name. Resolved against the app schema's `information_schema`
        before any statement is built; a name that is not there is a 404, and
        the catalog's own string — not this one — is what reaches the SQL.
      schema:
        type: string
    AppDataRowKey:
      name: rowKey
      in: path
      required: true
      description: >-
        Opaque base64url form of the row's primary-key values, in the order
        `primaryKey` lists them. Opaque rather than the raw value so a composite
        key, and a value containing a slash, survive a path segment.
      schema:
        type: string
    ConfigBrand:
      name: brand
      in: query
      required: false
      description: >-
        Calling build's brand short name. Accepted so one Cloud API can answer
        per-brand; the current implementation logs it and returns the
        deployment-wide config regardless.
      schema:
        type: string
    ConfigPlatform:
      name: platform
      in: query
      required: false
      description: desktop | web | ios | expo | extension | daemon.
      schema:
        type: string
    ConfigVersion:
      name: version
      in: query
      required: false
      description: Calling build's version, for future version-gated rollouts.
      schema:
        type: string
  responses:
    NotFound:
      description: Resource not found.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error:
      description: Error response.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    TeamSkillCategory:
      type: string
      description: >
        Fixed set rather than free text. The point is that two skills in the
        same category can be compared side by side; an open vocabulary defeats
        that within a week.
      enum: [general, coding, devops, data, research, writing, communication, integration]
    MarketplaceSkill:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        displayName: { type: string }
        publisher: { type: string }
        summary: { type: string, maxLength: 200 }
        category: { $ref: "#/components/schemas/TeamSkillCategory" }
        whenToUse: { type: string }
        whenNotToUse: { type: string }
        requires: { type: [object, "null"] }
        tags:
          type: array
          items: { type: string }
        status: { type: string, enum: [draft, published, delisted] }
        latestVersion: { type: integer }
        adoptedByTeam:
          type: [object, "null"]
          properties:
            slug: { type: string }
            latestVersion: { type: integer }
            upstreamSubscribed: { type: boolean }
        adoptCount: { type: integer }
        createdAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }
    MarketplaceSkillDetail:
      allOf:
        - $ref: "#/components/schemas/MarketplaceSkill"
        - type: object
          properties:
            versions:
              type: array
              items:
                type: object
                properties:
                  version: { type: integer }
                  contentHash: { type: string }
                  size: { type: integer }
                  changelog: { type: string }
                  publishedAt: { type: [string, "null"], format: date-time }
    TeamSkill:
      type: object
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        slug: { type: string }
        ownerActorId:
          type: string
          format: uuid
          description: Who is accountable for this skill. Transferable.
        summary: { type: string, maxLength: 200 }
        category: { $ref: "#/components/schemas/TeamSkillCategory" }
        whenToUse: { type: string }
        whenNotToUse:
          type: string
          description: >
            Required, and shown next to whenToUse rather than folded away —
            two overlapping skills can only be told apart by their boundaries.
        requires:
          type: [object, "null"]
          description: Optional dependency declaration (platform, MCP server, credentials).
        status: { type: string, enum: [draft, published, deprecated] }
        supersededBy: { type: [string, "null"] }
        latestVersion: { type: integer }
        createdBy: { type: string, format: uuid }
        createdAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }
        origin: { type: string, enum: [local, marketplace], default: local }
        upstreamSlug: { type: [string, "null"] }
        upstreamSubscribed: { type: boolean, default: false }
        upstreamDetachedAt: { type: [string, "null"], format: date-time }
        installed: { type: boolean }
        installedVersion: { type: [integer, "null"] }
        installScope: { type: [string, "null"], enum: [global, workspace, null] }
        hasUpdate: { type: boolean }
    TeamSkillVersion:
      type: object
      description: >
        Metadata is snapshotted here on purpose. team_skills carries "current";
        a version row carries the fact at that version, so editing a
        description does not rewrite the notes of every historical version.
      properties:
        version: { type: integer }
        contentHash: { type: string }
        size: { type: integer }
        changelog: { type: string }
        summary: { type: string }
        whenToUse: { type: string }
        whenNotToUse: { type: string }
        requires: { type: [object, "null"] }
        createdBy: { type: string, format: uuid }
        createdAt: { type: [string, "null"], format: date-time }
    TeamSkillInstall:
      type: object
      description: >
        actorId generalises over both install subjects — a member installing
        for themselves, and a `visibility=team` agent an admin installs for.
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        skillId: { type: string, format: uuid }
        installedVersion: { type: integer }
        scope: { type: string, enum: [global, workspace] }
        workspaceId: { type: [string, "null"], format: uuid }
        installedAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }
        slug: { type: string }
        latestVersion: { type: integer }
        status: { type: string }
        hasUpdate: { type: boolean }
    TeamSkillPublish:
      type: object
      required: [slug, summary, category, whenToUse, whenNotToUse, changelog, contentHash]
      properties:
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,63}$" }
        summary: { type: string, maxLength: 200 }
        category: { $ref: "#/components/schemas/TeamSkillCategory" }
        whenToUse: { type: string }
        whenNotToUse: { type: string }
        requires: { type: [object, "null"] }
        changelog: { type: string }
        contentHash: { type: string }
        size: { type: integer }
        ownerActorId: { type: string, format: uuid }
        status: { type: string, enum: [draft, published, deprecated] }
    TeamMcpServer:
      type: object
      description: >
        A catalog entry. Presence here means "available to the team", not
        "running" — `installed` reflects only the calling actor.
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        name: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$" }
        transport: { type: string, enum: [local, remote] }
        command: { type: [string, "null"] }
        args: { type: [array, "null"], items: { type: string } }
        url: { type: [string, "null"] }
        headers: { type: [object, "null"], additionalProperties: { type: string } }
        env: { type: [object, "null"], additionalProperties: { type: string } }
        description: { type: [string, "null"] }
        installed: { type: boolean }
        createdBy: { type: [string, "null"], format: uuid }
        updatedBy: { type: [string, "null"], format: uuid }
        createdAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }
    TeamMcpServerWrite:
      type: object
      description: >
        Create or patch body. `transport=local` requires `command` and forbids
        `url`; `transport=remote` is the mirror image. Secret-looking keys in
        `env`/`headers` must carry a `${KEY}` placeholder, not a literal.
      properties:
        name: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$" }
        transport: { type: string, enum: [local, remote] }
        command: { type: [string, "null"] }
        args: { type: [array, "null"], items: { type: string } }
        url: { type: [string, "null"] }
        headers: { type: [object, "null"], additionalProperties: { type: string } }
        env: { type: [object, "null"], additionalProperties: { type: string } }
        description: { type: [string, "null"] }
    TeamMcpServerConfigEntry:
      type: object
      description: >
        One entry of the daemon-facing `mcpServers` map — the on-disk Cursor
        shape, with only the fields relevant to its transport.
      properties:
        command: { type: string }
        args: { type: array, items: { type: string } }
        url: { type: string }
        headers: { type: object, additionalProperties: { type: string } }
        env: { type: object, additionalProperties: { type: string } }
    TeamMcpInstall:
      type: object
      description: Always the calling actor's own install — installs are self-only.
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        serverId: { type: string, format: uuid }
        name: { type: string }
        installedAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }
    TeamEnvEnvelope:
      type: object
      description: >
        Client-side AES-256-GCM envelope. The server stores these three fields
        verbatim and holds no key — it cannot decrypt, by design.
      required: [v, nonce, ciphertext]
      properties:
        v: { type: integer, minimum: 1 }
        nonce: { type: string, description: Base64 12-byte nonce. }
        ciphertext: { type: string, description: Base64 ciphertext including the GCM tag. }
    TeamEnvSecret:
      type: object
      description: >
        Note what is absent: there is no `value`, and no description/category
        either — that metadata is encrypted inside the envelope alongside the
        value, so only the client can read it.
      properties:
        keyId: { type: string, pattern: "^[a-z0-9_]{1,64}$" }
        envelope: { $ref: "#/components/schemas/TeamEnvEnvelope" }
        createdBy: { type: [string, "null"], format: uuid }
        updatedBy: { type: [string, "null"], format: uuid }
        createdAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }
    AppType:
      type: string
      description: |
        What kind of app this is. All three deploy through the same pipeline;
        the type selects the starter template the local daemon writes and
        decides whether the deploy provisions a Postgres schema (`data_app`
        only). `fullstack_tanstack_postgres` is the legacy id for `data_app`
        and is still stored on apps created before the split.
      enum: [static_web, slides, data_app, fullstack_tanstack_postgres]
    AppFcStatus:
      type: string
      description: |
        Deploy lifecycle, orthogonal to `provisionStatus` (which tracks the repo
        and its seeding). `null` means the app has never been deployed.
      enum: [not_deployed, awaiting_build, building, deploying, live, deploy_error]
    AppRuntime:
      type: string
      description: |
        FC runtime for the deployed artifact. Phase 1 supports `node` only;
        `container` is reserved for bring-your-own-image deploys.
      enum: [node, container]
      default: node
    AppAuthMode:
      type: string
      description: |
        How the deployed app authenticates end users. `none` means the live URL
        is reachable without login; `platform` uses TeamClu SSO (GoTrue OAuth
        client per app); `third` uses the app's own OAuth client id stored on
        this row (secret in `app_secrets`, never returned here).
      enum: [none, platform, third]
      default: none
    App:
      type: object
      required: [id, teamId, name, slug, type, visibility, provisionStatus, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        type:
          $ref: "#/components/schemas/AppType"
        visibility: { type: string, enum: [personal, team] }
        workspaceId:
          type: [string, "null"]
          format: uuid
          description: >-
            The app's own workspace, created with the app. Its `path` is filled
            in by the desktop once the local daemon reports where it put the
            checkout (`teams/<teamId>/apps/<appId>`); until then the daemon has
            no directory to resolve for this app.
        gitRemoteUrl:
          type: [string, "null"]
          description: >-
            The app's git remote: the Gitea repo provisioned for it (an SSH URL
            — the deploy key we issue cannot authenticate over HTTPS), or the
            repository it was imported from. Set at creation and not editable.
        gitAuthKind:
          type: [string, "null"]
          enum: [gitea_deploy_key, null]
          description: >-
            `gitea_deploy_key` when this deployment provisioned the app's repo
            and holds a deploy key for it — `/git-head` and `/git-credential`
            answer only for those. Null for an app imported from a remote we
            have no credential for; those deploy the local checkout instead.
        gitCommitSha:
          type: [string, "null"]
          pattern: "^[0-9a-f]{7,40}$"
          description: >-
            HEAD commit SHA on the app's Gitea repo at last successful deploy;
            null before the first deploy completes.
        runtime:
          $ref: "#/components/schemas/AppRuntime"
        authMode:
          $ref: "#/components/schemas/AppAuthMode"
        authModePendingRedeploy:
          type: boolean
          description: >-
            `authMode` was changed after the app went live, so the running
            function still enforces the mode it was deployed with — the OAuth
            env is injected at finalize, not on the PATCH. True until the next
            successful deploy. Clients MUST surface this: an app switched to
            `platform` reads as protected while its site is still public.
            Server-derived from `fc_status` and the deployed mode; false for an
            app that has never been live.
        oauthClientId:
          type: [string, "null"]
          description: >-
            Public OAuth client id when `authMode` is `third`, or the GoTrue
            client id when `authMode` is `platform`. Never includes the matching
            secret.
        provisionStatus:
          type: string
          enum: [pending, repo_created, seeding, ready, error]
        fcStatus:
          oneOf:
            - $ref: "#/components/schemas/AppFcStatus"
            - type: "null"
        fcEndpoint:
          type: [string, "null"]
          description: >-
            Function Compute trigger URL of the deployed app; set once
            `fcStatus` is `live`. Its hostname carries a random suffix, so it
            cannot be derived from the app — prefer `publicUrl` when present.
        publicUrl:
          type: [string, "null"]
          description: >-
            Vanity URL (`https://<slug>-<first 8 of id>.<apps domain>`) served
            by the deployment's own reverse proxy. Derived, never stored, and
            null when the deployment has no apps domain configured — then
            `fcEndpoint` is the only address the app has.
        fcFunctionName: { type: [string, "null"] }
        fcRegion: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AppGitCredential:
      type: object
      required: [remoteUrl, authKind, privateKeyPem, deployKeyId, expiresAt]
      description: >-
        One-time deploy-key credential for the app's Gitea repo. Secret — never log.
      properties:
        remoteUrl: { type: string }
        authKind: { type: string, enum: [deploy_key] }
        privateKeyPem:
          type: string
          description: PKCS#8 PEM private key for git over SSH.
        deployKeyId:
          type: integer
          description: Gitea deploy key id (for optional cleanup after push).
        expiresAt:
          type: string
          format: date-time
          description: Informational TTL (~15m); the key remains until deleted on Gitea.
    AppGitHead:
      type: object
      required: [sha]
      properties:
        sha:
          type: string
          description: Default-branch HEAD commit id on the app's Gitea repo.
    AppMembership:
      type: object
      required: [member]
      description: >-
        Whether the authenticated user is a member of the team that owns the
        app. Used by deployed apps to gate platform SSO without a service role.
      properties:
        member:
          type: boolean
          description: >-
            True when the caller has a member actor in the app's `teamId`;
            false otherwise (including when the app is personal and the caller
            is not the creator).
    AppPermissionLevel:
      type: string
      enum: [view, prompt, admin]
      description: >-
        Per-member app capability. `view` — see metadata only; `prompt` — git
        write (clone/push) but no deploy or grant management; `admin` — full
        control including deploy and access management.
    AppMemberAccessRow:
      type: object
      required: [memberId, permissionLevel, createdAt]
      properties:
        memberId:
          type: string
          format: uuid
          description: Granted team member actor id.
        permissionLevel:
          $ref: "#/components/schemas/AppPermissionLevel"
        grantedByMemberId:
          type: string
          format: uuid
          nullable: true
          description: Member who last wrote this grant.
        createdAt:
          type: string
          format: date-time
    AppDataColumn:
      type: object
      required: [name, dataType, nullable]
      properties:
        name:
          type: string
        dataType:
          type: string
          description: Postgres `information_schema.columns.data_type`.
        nullable:
          type: boolean
    AppDataTable:
      type: object
      required: [name, columns, primaryKey, editable]
      properties:
        name:
          type: string
        columns:
          type: array
          items:
            $ref: "#/components/schemas/AppDataColumn"
        primaryKey:
          type: array
          items: { type: string }
          description: Ordered primary-key columns; empty when the table has none.
        editable:
          type: boolean
          description: >-
            False when there is no primary key. Without one there is no safe
            "this row" — `update … where title = 'x'` can match several — so the
            table stays browsable and row actions are disabled.
    AppDataRowsPage:
      type: object
      required: [table, columns, primaryKey, editable, rows, nextCursor]
      properties:
        table:
          type: string
        columns:
          type: array
          items:
            $ref: "#/components/schemas/AppDataColumn"
        primaryKey:
          type: array
          items: { type: string }
        editable:
          type: boolean
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
          description: >-
            Values are returned in full. Truncating long text belongs in the UI
            — a server-side truncation would mean the value someone copies out
            is silently not the value in the database.
        nextCursor:
          type: [string, "null"]
          description: Pass as `after` for the next page. Null on the last page.
    BootstrapConfig:
      type: object
      description: >-
        Runtime configuration delivered to authenticated clients on startup.
        Every field is optional; clients fall back to their baked build config
        when one is omitted. An empty object is a valid answer and means "no
        overrides" — it must NEVER be read as "everything is disabled".
      properties:
        mqtt:
          $ref: "#/components/schemas/BootstrapMqttConfig"
        features:
          $ref: "#/components/schemas/BootstrapFeatures"
        webSso:
          allOf:
            - $ref: "#/components/schemas/WebSsoConfig"
          deprecated: true
          description: >-
            DEPRECATED — read this from `/v1/config/public` instead. Still
            served here because shipped clients (which fetch the public config
            only from a newer build) resolve their 快捷登录 target from this
            block; removing it would break their sign-in until they update.
      additionalProperties: true
    PublicConfig:
      type: object
      description: >-
        Unauthenticated pre-sign-in configuration. Same "absent means fall back
        to the build config" rule as BootstrapConfig.
      properties:
        webSso:
          $ref: "#/components/schemas/WebSsoConfig"
        features:
          $ref: "#/components/schemas/PublicFeatures"
      additionalProperties: true
    WebSsoConfig:
      type: object
      required: [loginUrl]
      description: 快捷登录 target — the partner admin console whose session is harvested.
      properties:
        loginUrl:
          type: string
          description: Admin console sign-in URL opened in the modal webview.
        storageKey:
          type:
            - string
            - "null"
          description: >-
            supabase-js localStorage key on that console (`sb-<ref>-auth-token`).
            Cannot be derived from the host, so it is delivered explicitly.
    PublicFeatures:
      type: object
      description: Feature flags the login screen needs before a session exists.
      properties:
        auth:
          $ref: "#/components/schemas/AuthFeatures"
      additionalProperties: false
    AuthFeatures:
      type: object
      description: >-
        Which sign-in methods this deployment offers. Each flag overrides the
        client's baked `features.auth.*`, EXCEPT `webSSO`, which is ANDed with
        the build flag: enabling it server-side alone is not enough, because the
        allowed admin-console hosts are compiled into the desktop binary
        (`WEBSSO_ADMIN_HOSTS`, apps/desktop/build.rs).
      properties:
        google: { type: boolean }
        wechat: { type: boolean }
        phone: { type: boolean }
        password: { type: boolean }
        webSSO: { type: boolean }
      additionalProperties: false
    BootstrapFeatures:
      type: object
      description: >-
        Post-sign-in feature flags. UI gating only — never authorization: a
        client with a tampered flag must still be refused by the endpoint that
        owns the feature.


        `updater` is deliberately absent and not overridable. It gates the
        startup auto-check as well as the UI, so a server-side mistake would
        strand the installed fleet with no way to update out of it.
      properties:
        channels:
          $ref: "#/components/schemas/ChannelFeatures"
        apps: { type: boolean }
        lockLlmConfig:
          type: boolean
          description: >-
            Locks clients out of changing or leaving the team LLM config.
            Deployment-scoped, matching what it already meant as the build-time
            `team.lockLlmConfig` (i.e. per brand) — not per team.
      additionalProperties: false
    ChannelFeatures:
      type: object
      description: Per-channel gateway toggles. Merged key-by-key over the build config.
      properties:
        discord: { type: boolean }
        feishu: { type: boolean }
        email: { type: boolean }
        kook: { type: boolean }
        wecom: { type: boolean }
        wechat: { type: boolean }
      additionalProperties: false
    BootstrapMqttConfig:
      type: object
      required: [url]
      description: >-
        Broker address handed to clients. Credentials are NOT part of this
        payload: clients authenticate to EMQX with username=actor_id and
        password=<Supabase access_token> (JWT auth).
      properties:
        url:
          type: string
          description: Full broker URL including scheme (mqtt://, mqtts://, ws://, wss://) and port.
        tcpUrl:
          type:
            - string
            - "null"
          description: >-
            Raw-TCP address for clients whose MQTT stack cannot do WebSocket
            (iOS CocoaMQTT, Expo). Desktop and daemon prefer `url`.
        useTls:
          type:
            - boolean
            - "null"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum:
                - missing_auth
                - invalid_json
                - validation_failed
                - forbidden
                - not_found
                - conflict
                - rate_limited
                - upstream_unavailable
                - internal
            message:
              type: string
            requestId:
              type: string
    Team:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type:
            - string
            - "null"
        createdAt:
          type:
            - string
            - "null"
        visibility:
          description: |
            Team visibility within its org. `private` (default) teams are
            invite/bootstrap-only; `public` teams are discoverable and
            self-service joinable by other users in the shared DEFAULT_ORG.
          type: string
          enum: [public, private]
        orgId:
          type:
            - string
            - "null"
        orgName:
          type:
            - string
            - "null"
        isMember:
          description: |
            Present in the `GET /v1/teams?scope=all` picker listing. `false`
            marks a public DEFAULT_ORG team the caller may join via
            `POST /v1/teams/{teamId}/join`; `true` (or absent) means the caller
            is already an actor in the team.
          type: boolean
    Session:
      type: object
      required: [id, teamId, title, mode, hasUnread]
      properties:
        id:
          type: string
        teamId:
          type: string
        title:
          type: string
        mode:
          type: string
          enum: [solo, collab, control]
        ideaId:
          type:
            - string
            - "null"
        lastMessageAt:
          type:
            - string
            - "null"
        lastMessagePreview:
          type:
            - string
            - "null"
        hasUnread:
          type: boolean
        source:
          description: >-
            How the session was created. 'user' for normal sessions, 'cron' for
            sessions auto-created by a scheduled task, 'gateway' for gateway
            (WeCom etc.) bindings.
          type: string
          enum: [user, cron, gateway]
        cronJobId:
          description: >-
            For source='cron', the desktop-local cron job id that created this
            session (a daemon-local string id, not a cloud reference).
          type:
            - string
            - "null"
        summary:
          description: >-
            Display-row field. Previously served only by the removed
            GET /v1/teams/{teamId}/sessions.
          type:
            - string
            - "null"
        primaryAgentId:
          type:
            - string
            - "null"
        createdByActorId:
          type:
            - string
            - "null"
        binding:
          description: >-
            For source='gateway', the chat URI this session is *currently* the
            live one for (e.g. wecom://{corp}/{agent}/single/{userid}). Released
            to null when /new moves the chat onto a fresh session, so it answers
            "is this the current session", not "which chat is this".
          type:
            - string
            - "null"
        gatewayKey:
          description: >-
            For source='gateway', the chat this session belongs to for its whole
            life. Unlike `binding` it is never released, so a session that /new
            has moved past can still say where it came from — which is what
            listing a chat's own session history is keyed on.
          type:
            - string
            - "null"
        participantCount:
          description: >-
            Number of participants in the session, counted server-side. It used
            to be derived by a follow-up query that listed every session id in a
            URL, which is what outgrew the gateway's request-line limit.
          type: integer
        createdAt:
          type:
            - string
            - "null"
        updatedAt:
          type:
            - string
            - "null"
    Message:
