          type:
            - string
            - "null"
        metadata:
          type:
            - object
            - "null"
          additionalProperties: true
    ActorPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Actor"
        nextCursor:
          type:
            - string
            - "null"
    ConnectedAgent:
      allOf:
        - $ref: "#/components/schemas/Actor"
        - type: object
          properties:
            lastSeenAt:
              type:
                - string
                - "null"
              format: date-time
            agentType:
              type: string
    AgentProfilePatch:
      type: object
      properties:
        displayName:
          type: string
        avatarUrl:
          type:
            - string
            - "null"
        description:
          type:
            - string
            - "null"
    AgentDefaultsPatch:
      type: object
      properties:
        defaultAgentType:
          type: string
        supportedAgentTypes:
          type: array
          items:
            type: string
    AgentAccess:
      type: object
      required: [agentActorId, actorId, role]
      properties:
        agentActorId:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        role:
          type: string
    SessionCreate:
      type: object
      required: [teamId, title, mode]
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        title:
          type: string
        mode:
          type: string
          enum: [solo, collab, control]
        ideaId:
          type:
            - string
            - "null"
          format: uuid
        primaryAgentActorId:
          type:
            - string
            - "null"
          format: uuid
        participantActorIds:
          type: array
          items:
            type: string
            format: uuid
        additionalActorIds:
          type: array
          items:
            type: string
            format: uuid
        workspaceByActorId:
          type: object
          additionalProperties:
            type: string
            format: uuid
          description: |
            Cloud workspace UUID for each agent participant. Overrides
            `agents.default_workspace_id` for that actor. Member seats stay
            unbound (workspace_id is not applicable).
    SessionThreadSummary:
      type: object
      required: [threadSessionId, rootMessageId, messageCount, participantCount]
      properties:
        threadSessionId:
          type: string
          format: uuid
        rootMessageId:
          type: string
          format: uuid
        messageCount:
          type: integer
        lastMessageAt:
          type:
            - string
            - "null"
          format: date-time
        participantCount:
          type: integer
    SessionWithParticipants:
      allOf:
        - $ref: "#/components/schemas/Session"
        - type: object
          properties:
            participants:
              type: array
              items:
                $ref: "#/components/schemas/SessionParticipant"
    SessionParticipant:
      type: object
      required: [sessionId, actorId, role]
      properties:
        sessionId:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        role:
          type: string
        joinedAt:
          type:
            - string
            - "null"
          format: date-time
        # An agent participant's working state for this session (ADR-0005).
        # `listSessionParticipants` has returned these three since that
        # migration; the schema simply had not caught up. NULL on member rows —
        # not applicable rather than missing.
        workspaceId:
          type:
            - string
            - "null"
          format: uuid
        model:
          type:
            - string
            - "null"
          description: Written by PATCH …/participants/{actorId}/model.
        lastProcessedMessageId:
          type:
            - string
            - "null"
          format: uuid
    SessionParticipantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionParticipant"
    SessionRoster:
      type: object
      required: [sessionId, callerActorId, items]
      properties:
        sessionId:
          type: string
          format: uuid
        callerActorId:
          type: string
          format: uuid
        title:
          type:
            - string
            - "null"
          description: Session title for async context anchoring.
        selfAgent:
          type:
            - object
            - "null"
          description: Caller agent ownership metadata (present when caller is an agent).
          properties:
            visibility:
              type:
                - string
                - "null"
              description: Agent visibility (`personal` or `team`).
            ownerMemberId:
              type:
                - string
                - "null"
              format: uuid
              description: Member actor id of the personal agent owner.
            ownerDisplayName:
              type:
                - string
                - "null"
              description: Display name of the personal agent owner.
        appContext:
          oneOf:
            - $ref: "#/components/schemas/SessionAppContext"
            - type: "null"
          description: >-
            Secret-free control-plane snapshot for the app linked to this
            session. Present only for an authenticated agent participant.
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionRosterEntry"
    SessionRosterEntry:
      type: object
      required: [actorId, displayName, kind, isSelf]
      properties:
        actorId:
          type: string
          format: uuid
        displayName:
          type:
            - string
            - "null"
        kind:
          type:
            - string
            - "null"
          description: Actor type (`member`, `agent`, `external`, …).
        isSelf:
          type: boolean
          description: True when this row is the authenticated caller.
    SessionAppContext:
      type: object
      required:
        - snapshotAt
        - id
        - name
        - type
        - visibility
        - deployment
        - auth
        - database
        - storage
        - environment
        - cronJobs
        - customDomain
      description: >-
        App metadata safe to include in an agent system prompt. Environment
        values, secret values, cron header/body values, data rows, file names,
        access lists and DNS verification tokens are deliberately excluded.
      properties:
        snapshotAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        visibility:
          type: string
        canonicalUrl:
          type:
            - string
            - "null"
          format: uri
        provisionStatus:
          type:
            - string
            - "null"
        fcStatus:
          type:
            - string
            - "null"
        deployment:
          type: object
          required:
            - gitCommitSha
            - runtime
            - startSpec
            - typePendingRedeploy
            - envPendingRedeploy
            - authModePendingRedeploy
          properties:
            gitCommitSha:
              type: [string, "null"]
            runtime:
              type: [string, "null"]
            startSpec:
              type: [object, "null"]
              additionalProperties: true
            typePendingRedeploy:
              type: boolean
            envPendingRedeploy:
              type: boolean
            authModePendingRedeploy:
              type: boolean
        auth:
          type: object
          required: [mode, audience, scope, rules]
          properties:
            mode:
              type: string
            audience:
              type: string
            scope:
              type: string
            rules:
              type: array
              items:
                type: object
                additionalProperties: true
        database:
          type: object
          required: [configured, live]
          properties:
            configured:
              type: boolean
            live:
              type: boolean
        storage:
          type: object
          required: [controlPlaneAvailable, overQuota]
          properties:
            controlPlaneAvailable:
              type: boolean
              description: >-
                Whether this deployment supports app object storage. An older
                live function may still require redeployment to receive its env.
            overQuota:
              type: boolean
        environment:
          type: object
          required: [keys]
          properties:
            keys:
              type: array
              items:
                type: object
                required: [key, isSecret]
                properties:
                  key:
                    type: string
                  isSecret:
                    type: boolean
        cronJobs:
          type: array
          items:
            type: object
            required: [name, enabled, schedule, timezone, method, path, headerNames]
            properties:
              name:
                type: string
              enabled:
                type: boolean
              schedule:
                type: string
              timezone:
                type: string
              method:
                type: string
              path:
                type: string
              headerNames:
                type: array
                items:
                  type: string
        customDomain:
          type: object
          required: [domain, verified]
          properties:
            domain:
              type: [string, "null"]
            verified:
              type: boolean
    TeamMember:
      type: object
      required: [actorId, teamId, role]
      properties:
        actorId:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
