      description: >
        Published catalog entries. Pass teamId to decorate each row with
        adoptedByTeam. Design: docs/architecture/skills-marketplace.md
      tags: [Marketplace]
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/TeamSkillCategory" }
        - name: teamId
          in: query
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          description: >
            Page size. Default 100, max 200. Pass 1 to probe whether the
            catalog is non-empty (sidebar entry, design §10.1).
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Catalog entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MarketplaceSkill" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/marketplace/skills/{slug}:
    get:
      operationId: getMarketplaceSkill
      summary: Marketplace skill detail + published versions
      tags: [Marketplace]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { $ref: "#/components/schemas/TeamSkillSlug" }
        - name: teamId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Catalog detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketplaceSkillDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/teams/{teamId}/skills/adopt:
    post:
      operationId: adoptMarketplaceSkill
