  /v1/inbox:
    get:
      operationId: listInboxItems
      summary: List inbox items for the current user
      description: >-
        The inbox holds only work that is blocked on this person — an agent
        waiting for a permission decision, a turn that failed without
        producing anything, a mention, a delegated task waiting to be
        accepted, an idea waiting for review. Ordinary messages and status
        changes never appear here.
      tags: [Inbox]
      parameters:
        - name: teamId
          in: query
          description: >-
            Narrow to one team. Omit to return items across every team the
            caller belongs to, which is what the mobile client does — the
            inbox is a personal surface and spans teams.
          schema:
            type: string
            format: uuid
        - name: state
          in: query
          description: >-
            Which items to return. `unread` is the badge surface and the
            default; `open` adds read-but-unresolved items; `all` includes
            resolved ones.
          schema:
            type: string
            enum: [unread, open, all]
            default: unread
        - name: kind
          in: query
          description: Narrow to a single item kind.
          schema:
            $ref: "#/components/schemas/InboxItemKind"
        - name: maxPriority
          in: query
          description: >-
            Return only items at or above this urgency, where 0 is most
            urgent. Clients pass 1 so merely-informational items stay out of
            the default surface.
          schema:
            type: integer
            minimum: 0
            maximum: 2
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Inbox page for the current user.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, unreadCount]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/InboxItem"
                  nextCursor:
                    type:
                      - string
                      - "null"
                  unreadCount:
                    type: integer
                    description: >-
                      Unread items matching the same filters, ignoring the
                      page window. Drives the tab badge so clients need no
                      second call.
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: ingestInboxItem
      summary: Report an event the server cannot observe on its own
      description: >-
        Called by a daemon for the two kinds that never reach the Cloud API
        by any other route. A permission request lives only on the session
        live topic, and a completed delegated task is indistinguishable from
        an ordinary reply once it lands in `messages`. Every other kind is
        derived server-side and is rejected here, so a compromised daemon
        cannot forge a mention or an idea review.


        Authorization deliberately departs from the usual facade rule of
        forwarding the caller token to Supabase and letting RLS decide. The
        row belongs to the *recipient*, not the caller, so RLS would refuse
        it. Instead the caller is authenticated normally, this endpoint
        checks that some actor owned by the caller and the target actor are
        both participants of `sessionId`, and only then writes with the
        service role. Do not "fix" this back to a token passthrough.


        The membership check must not use `current_actor_id()` — it returns
        the caller's oldest actor, which silently diverges from the actor a
        daemon reports as if that account ever gains a second one. Match on
        any actor owned by the caller instead.


        Idempotent on `dedupKey`. Retried cron turns and redelivered MQTT
        frames converge on one row rather than one per attempt.
      tags: [Inbox]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboxIngestRequest"
      responses:
        "201":
          description: Item created.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxItem"
        "200":
          description: >-
            An item with this `dedupKey` already existed and is returned
            unchanged. Not an error — this is the retry path.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxItem"
        "400":
          description: >-
            Malformed body, or a `kind` this endpoint refuses because the
            server derives it itself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          description: >-
            The caller or the target actor is not a participant of
            `sessionId`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/inbox/read:
