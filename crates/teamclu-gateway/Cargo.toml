[package]
name = "teamclu-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
# Discord
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "rustls_backend"] }

# Email
imap = "2"
native-tls = "0.2"
mail-parser = "0.9"
lettre = { version = "0.11", features = ["native-tls", "smtp-transport"] }
yup-oauth2 = "12"
webbrowser = "1"
flate2 = "1"

# WebSocket-based gateways (Kook, Feishu, WeChat, WeCom)
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }

# Image processing (WeChat/WeCom media)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

# WeCom AES decryption + media upload
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
md5 = "0.7"

async-trait = "0.1"
thiserror = "2"

# Core
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "process", "io-util", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "stream", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
futures = "0.3"
futures-util = "0.3"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
anyhow = "1"
regex = "1"
url = "2"
nanoid = "0.4"
# PERF-20 / STR-7: local SQLite files only. libsql's default features are
# `core + replication + remote + sync + tls`, which drag in tonic, tonic-web,
# tower-http, hyper 0.14 and hyper-rustls — a second HTTP stack and a second
# TLS stack, for a replication client nothing here opens. WAL comes from an
# explicit `PRAGMA journal_mode=WAL` (local_cache/store.rs), not from the
# `sync` feature. Feature unification means BOTH crates have to say this:
# resolver 2 unifies features across the workspace, so one of them keeping
# the defaults re-enables them for the other.
libsql = { version = "0.9", default-features = false, features = ["core"] }
indexmap = { version = "2", features = ["serde"] }
urlencoding = "2"
getrandom = "0.2"
dirs = "6"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
